<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>001 - 贪吃蛇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px;
            user-select: none;
        }
        h1 { margin-bottom: 8px; color: #00d4ff; font-size: 1.8em; }
        .score { font-size: 1.3em; margin-bottom: 12px; color: #aaa; }
        .score span { color: #ffd700; font-weight: bold; font-size: 1.4em; }
        canvas {
            border: 2px solid #333; background: #16213e;
            border-radius: 4px;
        }
        .info { margin-top: 12px; color: #777; font-size: 14px; }
        .controls { margin-top: 8px; color: #555; font-size: 13px; }
        .game-over-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); padding: 30px 50px; border-radius: 12px;
            text-align: center; display: none; z-index: 10;
        }
        .game-over-msg h2 { color: #ff4444; margin-bottom: 12px; font-size: 2em; }
        .game-over-msg p { color: #ccc; margin-bottom: 20px; font-size: 1.2em; }
        .game-over-msg button {
            padding: 10px 30px; font-size: 1.1em;
            background: #00d4ff; color: #1a1a2e; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .game-over-msg button:hover { background: #00e8ff; }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇</h1>
    <div class="score">得分：<span id="score">0</span></div>
    <canvas id="game" width="600" height="600"></canvas>
    <div class="info">游戏 #001 — 使用方向键或 WASD 控制方向</div>
    <div class="controls">空格键暂停 | R 键重新开始 | 吃食物加速</div>

    <div class="game-over-msg" id="gameOver">
        <h2>游戏结束 💀</h2>
        <p>最终得分：<strong id="finalScore">0</strong></p>
        <button onclick="restart()">🔄 再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        const GRID = 20;         // 每格像素
        const COLS = canvas.width / GRID;
        const ROWS = canvas.height / GRID;

        let snake = [];
        let food = {};
        let dir = { x: 1, y: 0 };
        let nextDir = { x: 1, y: 0 };
        let score = 0;
        let gameLoop = null;
        let paused = false;
        let speed = 120;         // 初始速度 (ms)

        function init() {
            snake = [
                { x: 5, y: ROWS / 2 },
                { x: 4, y: ROWS / 2 },
                { x: 3, y: ROWS / 2 },
            ];
            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            score = 0;
            speed = 120;
            paused = false;
            document.getElementById('score').textContent = '0';
            document.getElementById('gameOver').style.display = 'none';
            placeFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        }

        function placeFood() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS),
                };
            } while (snake.some(s => s.x === pos.x && s.y === pos.y));
            food = pos;
        }

        function update() {
            dir = { ...nextDir };

            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            // 撞墙
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                return gameOver();
            }

            // 撞自己
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                return gameOver();
            }

            snake.unshift(head);

            // 吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                placeFood();
                // 加速
                if (speed > 50) {
                    speed -= 1;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, speed);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // 背景
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 网格线（淡）
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= canvas.width; x += GRID) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 食物（脉冲光晕）
            const fx = food.x * GRID + GRID / 2;
            const fy = food.y * GRID + GRID / 2;
            const pulse = 0.6 + 0.4 * Math.sin(Date.now() / 200);
            ctx.fillStyle = `rgba(255,68,68,${pulse})`;
            ctx.beginPath();
            ctx.arc(fx, fy, GRID / 2 - 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(fx - 2, fy - 2, 3, 0, Math.PI * 2);
            ctx.fill();

            // 蛇身
            snake.forEach((s, i) => {
                const x = s.x * GRID + 1;
                const y = s.y * GRID + 1;
                const size = GRID - 2;

                if (i === 0) {
                    // 蛇头
                    ctx.fillStyle = '#00ff88';
                } else {
                    // 渐变：越靠近尾巴越暗
                    const ratio = i / snake.length;
                    const g = Math.floor(255 * (1 - ratio));
                    ctx.fillStyle = `rgb(0,${Math.max(g, 50)},${Math.floor(136 * (1 - ratio))})`;
                }

                ctx.beginPath();
                ctx.roundRect(x, y, size, size, 4);
                ctx.fill();
            });

            // 暂停标识
            if (paused) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 36px "Segoe UI"';
                ctx.textAlign = 'center';
                ctx.fillText('⏸  暂停中', canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'start';
            }
        }

        function gameOver() {
            clearInterval(gameLoop);
            gameLoop = null;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
            draw(); // 最后再画一帧
        }

        function restart() {
            if (gameLoop) clearInterval(gameLoop);
            init();
            draw();
        }

        // --- 键盘控制 ---
        document.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();

            // 方向
            if ((key === 'arrowup' || key === 'w') && dir.y !== 1) {
                nextDir = { x: 0, y: -1 };
                e.preventDefault();
            }
            if ((key === 'arrowdown' || key === 's') && dir.y !== -1) {
                nextDir = { x: 0, y: 1 };
                e.preventDefault();
            }
            if ((key === 'arrowleft' || key === 'a') && dir.x !== 1) {
                nextDir = { x: -1, y: 0 };
                e.preventDefault();
            }
            if ((key === 'arrowright' || key === 'd') && dir.x !== -1) {
                nextDir = { x: 1, y: 0 };
                e.preventDefault();
            }

            // 暂停
            if (key === ' ') {
                e.preventDefault();
                if (!gameLoop) return; // 已结束
                if (paused) {
                    paused = false;
                    gameLoop = setInterval(update, speed);
                } else {
                    paused = true;
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                draw();
            }

            // 重新开始
            if (key === 'r') {
                e.preventDefault();
                restart();
            }
        });

        // --- 触屏支持 ---
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        canvas.addEventListener('touchmove', e => {
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;

            if (Math.abs(dx) > Math.abs(dy)) {
                // 水平滑动
                if (dx > 0 && dir.x !== -1) nextDir = { x: 1, y: 0 };
                else if (dx < 0 && dir.x !== 1) nextDir = { x: -1, y: 0 };
            } else {
                // 垂直滑动
                if (dy > 0 && dir.y !== -1) nextDir = { x: 0, y: 1 };
                else if (dy < 0 && dir.y !== 1) nextDir = { x: 0, y: -1 };
            }
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        // 启动
        init();
        draw();
    </script>
</body>
</html>
