<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>052 - 下100层</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 10px; user-select: none; -webkit-user-select: none; }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }
        .top-bar { display: flex; gap: 16px; margin-bottom: 4px; font-size: clamp(0.8em, 2.5vw, 0.9em); color: #aaa; flex-wrap: wrap; justify-content: center; }
        .top-bar span { color: #ffd700; font-weight: bold; }
        .canvas-wrap { width: 100%; max-width: 360px; }
        canvas { width: 100%; display: block; border: 2px solid #333; border-radius: 6px; touch-action: manipulation; background: #0a0a1e; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 8px 18px; border: 2px solid #444; background: transparent; color: #ccc; border-radius: 8px; cursor: pointer; font-size: clamp(0.75em, 2.5vw, 0.9em); -webkit-tap-highlight-color: transparent; }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }
        .overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px; text-align: center; display: none; z-index: 10; }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; color: #ffd700; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button { padding: 10px 28px; font-size: 1em; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>👟 下100层 — #052</h1>
    <div class="top-bar">
        <span>📏 层数 <span id="score">0</span></span>
        <span>⚡ 速度 <span id="speed">1</span>x</span>
        <span>🏆 <span id="best">0</span></span>
    </div>
    <div class="canvas-wrap"><canvas id="game"></canvas></div>
    <div class="btn-row"><button class="btn primary" id="newBtn">🔄 新游戏</button></div>
    <div class="info" style="color:#555;font-size:0.7em;margin-top:4px;">💡 ←→/AD 移动 | 踩蓝色弹跳平台弹起 | ❌红色平台一次即碎 | ⚡闪电平台加速下落</div>
    <div class="overlay" id="endOverlay">
        <h2>💥 摔倒了！</h2>
        <p>层数：<strong id="endScore">0</strong></p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W, H, player, platforms, score, bestScore, gameOver, animId;
        let totalScroll, scrollSpeed, particles, keys, speedTimer, speedMultiplier;

        function resize() {
            const maxW = Math.min(canvas.parentElement.clientWidth, 360);
            W = maxW; H = Math.floor(W * 1.35);
            canvas.width = W; canvas.height = H;
        }

        function newGame() {
            cancelAnimationFrame(animId);
            if (speedTimer) { clearTimeout(speedTimer); speedTimer = null; }
            resize();
            score = 0; gameOver = false; totalScroll = 0; scrollSpeed = 1.0; speedMultiplier = 1.0;
            particles = []; keys = {};
            bestScore = parseInt(localStorage.getItem('down100-best') || '0');
            document.getElementById('score').textContent = '0';
            document.getElementById('speed').textContent = '1.0';
            document.getElementById('best').textContent = bestScore;
            document.getElementById('endOverlay').style.display = 'none';
            // Player at fixed screen position (upper portion)
            player = { x: W/2, y: H * 0.25, w: 24, h: 28, vy: 0, dir: 0 };
            platforms = [];
            // Generate initial platforms covering entire screen
            let py = H - 20;
            while (py > -40) {
                platforms.push(createPlatform(py));
                py -= 35 + Math.random() * 20;
            }
            // Guarantee a normal platform right below player's starting position
            const safeY = player.y + player.h/2 + 10;
            platforms.push({ x: player.x - 40, y: safeY, w: 80, h: 8, type: 'normal', color: '#888', broken: false, bounceAnim: 0 });
            loop();
        }

        function createPlatform(screenY) {
            const types = ['normal','normal','normal','normal','bounce','fragile','speed'];
            const type = types[Math.floor(Math.random() * types.length)];
            const w = type === 'bounce' ? 55 : type === 'fragile' ? 48 : 58 + Math.random() * 32;
            const x = 8 + Math.random() * (W - w - 16);
            let color = '#888';
            if (type === 'bounce') color = '#44aaff';
            if (type === 'fragile') color = '#ff4444';
            if (type === 'speed') color = '#ffd700';
            return { x, y: screenY, w, h: 8, type, color, broken: false, bounceAnim: 0 };
        }

        function update() {
            if (gameOver) return;

            // Player horizontal movement
            const moveSpeed = 4;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) { player.x -= moveSpeed; player.dir = -1; }
            else if (keys['ArrowRight'] || keys['d'] || keys['D']) { player.x += moveSpeed; player.dir = 1; }
            else player.dir = 0;
            // Wrap around screen
            if (player.x < -12) player.x = W + 12;
            if (player.x > W + 12) player.x = -12;

            // Scroll speed increases with depth
            scrollSpeed = (1.0 + Math.floor(totalScroll / 500) * 0.3) * speedMultiplier;
            totalScroll += scrollSpeed;

            // Move all platforms upward
            for (const p of platforms) {
                p.y -= scrollSpeed;
            }

            // Player gravity (in screen space)
            player.vy += 0.38;
            player.y += player.vy;
            // Don't go above screen top
            if (player.y < player.h/2) { player.y = player.h/2; if (player.vy < 0) player.vy = 0; }

            // Platform collision (only when falling)
            if (player.vy > 0) {
                for (const p of platforms) {
                    if (p.broken) continue;
                    if (p.y < -40 || p.y > H + 40) continue;
                    // AABB collision: player must have been above platform before this frame
                    if (player.x + player.w/2 > p.x && player.x - player.w/2 < p.x + p.w &&
                        player.y + player.h/2 >= p.y && player.y - player.h/2 < p.y + p.h &&
                        player.y + player.h/2 - player.vy <= p.y + 6) {
                        // Land on platform
                        if (p.type === 'fragile') {
                            p.broken = true;
                            for (let i = 0; i < 8; i++) particles.push({ x: p.x + Math.random()*p.w, y: p.y, vx: (Math.random()-0.5)*3, vy: -1-Math.random()*3, life: 14, color: '#ff4444' });
                            player.vy = -2;
                        } else if (p.type === 'bounce') {
                            player.vy = -9;
                            player.y = p.y - player.h/2;
                            p.bounceAnim = 6;
                            for (let i = 0; i < 5; i++) particles.push({ x: player.x, y: p.y, vx: (Math.random()-0.5)*2, vy: -2-Math.random()*2, life: 10, color: '#44aaff' });
                        } else {
                            player.vy = 0;
                            player.y = p.y - player.h/2;
                            if (p.type === 'speed') {
                                speedMultiplier = 2.0;
                                if (speedTimer) clearTimeout(speedTimer);
                                speedTimer = setTimeout(() => { speedMultiplier = 1.0; }, 2000);
                            }
                        }
                        break;
                    }
                }
            }

            // Score = floors cleared (approximate)
            score = Math.floor(totalScroll / 40);
            document.getElementById('score').textContent = score;
            document.getElementById('speed').textContent = scrollSpeed.toFixed(1);
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('down100-best', bestScore);
                document.getElementById('best').textContent = bestScore;
            }

            // Generate new platforms at bottom
            let maxY = -Infinity;
            for (const p of platforms) {
                if (!p.broken && p.y > maxY) maxY = p.y;
            }
            if (maxY === -Infinity) maxY = H;
            while (maxY < H + 100) {
                maxY += 35 + Math.random() * 20;
                platforms.push(createPlatform(maxY));
            }

            // Remove platforms that scrolled off top
            platforms = platforms.filter(p => p.y < H + 80 && !(p.y < -80 && p.broken));
            // Also clean up broken platforms that are off screen
            if (platforms.length > 30) {
                platforms = platforms.filter(p => !p.broken || p.y > -40);
            }

            // Bounce animation decay
            for (const p of platforms) { if (p.bounceAnim > 0) p.bounceAnim -= 0.4; }

            // Particles
            for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
            particles = particles.filter(p => p.life > 0);

            // Game over: player fell below screen
            if (player.y > H + 40) endGame();
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Background gradient
            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#0a0a2e'); bgGrad.addColorStop(1, '#1a0a2e');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

            // Depth indicator lines (parallax)
            for (let i = 0; i < 5; i++) {
                const ly = ((totalScroll * 0.3 + i * H * 0.25) % H);
                ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
            }

            // Platforms
            for (const p of platforms) {
                if (p.broken || p.y < -30 || p.y > H + 30) continue;
                const bounceOffset = p.bounceAnim > 0 ? Math.sin(p.bounceAnim * 3) * 3 : 0;
                const sy = p.y + bounceOffset;
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(p.x + 2, sy + 2, p.w, p.h);
                // Body
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, sy, p.w, p.h);
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(p.x, sy, p.w, p.h * 0.35);
                // Type icons
                if (p.type === 'speed' && p.bounceAnim <= 0) {
                    ctx.fillStyle = '#000'; ctx.font = '9px "Segoe UI"'; ctx.textAlign = 'center';
                    ctx.fillText('⚡', p.x + p.w/2, sy + p.h - 1);
                }
            }

            // Particles
            for (const p of particles) {
                const alpha = p.life / 14;
                ctx.fillStyle = p.color === '#44aaff'
                    ? `rgba(68,170,255,${alpha})`
                    : `rgba(255,68,68,${alpha})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); ctx.fill();
            }

            // Player
            ctx.save(); ctx.translate(player.x, player.y);
            if (player.dir !== 0) ctx.scale(player.dir || 1, 1);
            // Body glow
            ctx.fillStyle = 'rgba(68,255,136,0.3)'; ctx.beginPath();
            ctx.arc(0, 0, player.w * 0.8, 0, Math.PI*2); ctx.fill();
            // Body
            ctx.fillStyle = '#44ff88'; ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
            // Eyes
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(4, -7, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(5, -7, 2, 0, Math.PI*2); ctx.fill();
            // Hat
            ctx.fillStyle = '#ff6644'; ctx.fillRect(-player.w/2 - 1, -player.h/2 - 4, player.w + 2, 6);
            ctx.restore();

            // Score display
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 14px "Segoe UI"'; ctx.textAlign = 'center';
            ctx.fillText('第 ' + score + ' 层', W/2, 22);
            ctx.textAlign = 'start';

            // Depth indicator
            ctx.fillStyle = '#666'; ctx.font = '10px "Segoe UI"'; ctx.textAlign = 'right';
            ctx.fillText('深度: ' + Math.floor(totalScroll/10) + 'm', W - 8, H - 8);
            ctx.textAlign = 'start';
        }

        function endGame() {
            gameOver = true;
            document.getElementById('endScore').textContent = score;
            document.getElementById('endOverlay').style.display = 'block';
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('down100-best', bestScore);
                document.getElementById('best').textContent = bestScore;
            }
        }

        function loop() { update(); draw(); if (!gameOver) animId = requestAnimationFrame(loop); }

        // Keyboard
        document.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
        document.addEventListener('keyup', e => { keys[e.key] = false; e.preventDefault(); });

        // Touch controls
        let touchLeft = false, touchRight = false;
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            touchLeft = false; touchRight = false;
            for (const t of e.touches) {
                if (t.clientX < rect.left + rect.width / 2) touchLeft = true;
                else touchRight = true;
            }
        });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            touchLeft = false; touchRight = false;
            for (const t of e.touches) {
                if (t.clientX < rect.left + rect.width / 2) touchLeft = true;
                else touchRight = true;
            }
        });
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            touchLeft = false; touchRight = false;
            for (const t of e.touches) {
                if (t.clientX < rect.left + rect.width / 2) touchLeft = true;
                else touchRight = true;
            }
        });

        // Merge touch state into keys before each update
        const origUpdate = update;
        update = function() {
            if (touchLeft) keys['ArrowLeft'] = true; else delete keys['ArrowLeft'];
            if (touchRight) keys['ArrowRight'] = true; else delete keys['ArrowRight'];
            origUpdate();
        };

        document.getElementById('newBtn').addEventListener('click', newGame);
        window.addEventListener('resize', () => { resize(); });
        newGame();
    </script>
    <script src="/joy-game-study/nav.js"></script>
</body>
</html>
