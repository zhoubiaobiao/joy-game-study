<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>060 - 磁力迷宫</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 10px; user-select: none; -webkit-user-select: none; }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }
        .top-bar { display: flex; gap: 16px; margin-bottom: 4px; font-size: clamp(0.8em, 2.5vw, 0.9em); color: #aaa; flex-wrap: wrap; justify-content: center; }
        .top-bar span { color: #ffd700; font-weight: bold; }
        .canvas-wrap { width: 100%; max-width: 400px; }
        canvas { width: 100%; display: block; border: 2px solid #333; border-radius: 6px; touch-action: manipulation; background: #1a1a2e; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 8px 18px; border: 2px solid #444; background: transparent; color: #ccc; border-radius: 8px; cursor: pointer; font-size: clamp(0.75em, 2.5vw, 0.9em); -webkit-tap-highlight-color: transparent; }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }
        .overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px; text-align: center; display: none; z-index: 10; }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; color: #ffd700; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button { padding: 10px 28px; font-size: 1em; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🧲 磁力迷宫 — #060</h1>
    <div class="top-bar">
        <span>🎯 关卡 <span id="level">1</span></span>
        <span>⭐ <span id="score">0</span></span>
        <span>🏆 <span id="best">0</span></span>
    </div>
    <div class="canvas-wrap"><canvas id="game"></canvas></div>
    <div class="btn-row"><button class="btn primary" id="newBtn">🔄 新游戏</button></div>
    <div class="info" style="color:#555;font-size:0.7em;margin-top:4px;">💡 点击/触摸放置磁铁 | 磁铁吸引小球移动 | 红色=N极(推开) 蓝色=S极(吸引) | 引导小球到绿色目标</div>
    <div class="overlay" id="endOverlay">
        <h2 id="endTitle">🎉 到达目标！</h2>
        <p>得分：<strong id="endScore">0</strong></p>
        <button onclick="nextLevel()">▶ 下一关</button>&nbsp;<button onclick="newGame()">🔄 重新开始</button>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W, H, ball, goal, magnets, walls, level, score, bestScore, gameOver, animId;
        let magnetType, mousePos, particles;

        // Level designs
        const LEVELS = [
            // Level 1: Simple straight path
            {
                walls: [
                    { x: 0.2, y: 0.5, w: 0.15, h: 0.02 },
                    { x: 0.6, y: 0.5, w: 0.15, h: 0.02 },
                ],
                ball: { x: 0.1, y: 0.3 },
                goal: { x: 0.85, y: 0.7 },
                name: '第一关 - 直线引导'
            },
            // Level 2: L-shaped path
            {
                walls: [
                    { x: 0.3, y: 0.35, w: 0.02, h: 0.3 },
                    { x: 0.3, y: 0.65, w: 0.4, h: 0.02 },
                    { x: 0.68, y: 0.4, w: 0.02, h: 0.25 },
                ],
                ball: { x: 0.15, y: 0.2 },
                goal: { x: 0.8, y: 0.3 },
                name: '第二关 - L型弯道'
            },
            // Level 3: Zigzag
            {
                walls: [
                    { x: 0.25, y: 0.3, w: 0.02, h: 0.3 },
                    { x: 0.25, y: 0.6, w: 0.25, h: 0.02 },
                    { x: 0.5, y: 0.3, w: 0.02, h: 0.3 },
                    { x: 0.5, y: 0.3, w: 0.25, h: 0.02 },
                    { x: 0.73, y: 0.3, w: 0.02, h: 0.35 },
                ],
                ball: { x: 0.12, y: 0.4 },
                goal: { x: 0.85, y: 0.7 },
                name: '第三关 - 曲折前行'
            },
            // Level 4: Spiral
            {
                walls: [
                    { x: 0.2, y: 0.25, w: 0.6, h: 0.02 },
                    { x: 0.78, y: 0.25, w: 0.02, h: 0.5 },
                    { x: 0.2, y: 0.73, w: 0.6, h: 0.02 },
                    { x: 0.2, y: 0.25, w: 0.02, h: 0.25 },
                    { x: 0.35, y: 0.4, w: 0.3, h: 0.02 },
                    { x: 0.35, y: 0.4, w: 0.02, h: 0.2 },
                    { x: 0.5, y: 0.58, w: 0.02, h: 0.15 },
                ],
                ball: { x: 0.3, y: 0.15 },
                goal: { x: 0.6, y: 0.65 },
                name: '第四关 - 回形迷宫'
            },
            // Level 5: Complex
            {
                walls: [
                    { x: 0.15, y: 0.4, w: 0.02, h: 0.35 },
                    { x: 0.15, y: 0.4, w: 0.2, h: 0.02 },
                    { x: 0.35, y: 0.2, w: 0.02, h: 0.3 },
                    { x: 0.35, y: 0.2, w: 0.2, h: 0.02 },
                    { x: 0.55, y: 0.2, w: 0.02, h: 0.4 },
                    { x: 0.55, y: 0.6, w: 0.15, h: 0.02 },
                    { x: 0.7, y: 0.35, w: 0.02, h: 0.25 },
                    { x: 0.7, y: 0.35, w: 0.15, h: 0.02 },
                ],
                ball: { x: 0.08, y: 0.5 },
                goal: { x: 0.88, y: 0.2 },
                name: '第五关 - 终极挑战'
            },
        ];

        function getLevelData() {
            return LEVELS[(level - 1) % LEVELS.length];
        }

        function resize() {
            const maxW = Math.min(canvas.parentElement.clientWidth, 400);
            W = maxW; H = Math.floor(W * 1.1);
            canvas.width = W; canvas.height = H;
        }

        function newGame() {
            cancelAnimationFrame(animId);
            resize();
            level = 1; score = 0; gameOver = false;
            magnets = []; magnetType = 'attract'; mousePos = null; particles = [];
            bestScore = parseInt(localStorage.getItem('magnet-best') || '0');
            document.getElementById('level').textContent = '1';
            document.getElementById('score').textContent = '0';
            document.getElementById('best').textContent = bestScore;
            document.getElementById('endOverlay').style.display = 'none';
            loadLevel();
            loop();
        }

        function loadLevel() {
            const data = getLevelData();
            walls = data.walls.map(w => ({ x: w.x * W, y: w.y * H, w: w.w * W, h: w.h * H }));
            ball = { x: data.ball.x * W, y: data.ball.y * H, r: 8, vx: 0, vy: 0 };
            goal = { x: data.goal.x * W, y: data.goal.y * H, r: 16 };
            magnets = [];
            document.getElementById('level').textContent = level;
            document.getElementById('endOverlay').style.display = 'none';
        }

        function update() {
            if (gameOver) return;

            // Magnet forces on ball
            for (const m of magnets) {
                const dx = ball.x - m.x, dy = ball.y - m.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 1) continue;
                const force = m.power / (dist * dist) * 800;
                const fx = dx / dist * force, fy = dy / dist * force;
                if (m.type === 'attract') {
                    ball.vx -= fx; ball.vy -= fy;
                } else {
                    ball.vx += fx; ball.vy += fy;
                }
                // Magnetic field particles
                if (Math.random() < 0.3) {
                    const angle = Math.atan2(-dy, -dx);
                    particles.push({
                        x: ball.x, y: ball.y,
                        vx: Math.cos(angle) * (m.type === 'attract' ? -1 : 1) * 2 + (Math.random()-0.5),
                        vy: Math.sin(angle) * (m.type === 'attract' ? -1 : 1) * 2 + (Math.random()-0.5),
                        life: 8, color: m.type === 'attract' ? '#44aaff' : '#ff4444'
                    });
                }
            }

            // Apply velocity
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Friction
            ball.vx *= 0.97;
            ball.vy *= 0.97;

            // Wall collision
            for (const w of walls) {
                // Find closest point on rect
                const closestX = Math.max(w.x, Math.min(ball.x, w.x + w.w));
                const closestY = Math.max(w.y, Math.min(ball.y, w.y + w.h));
                const dx = ball.x - closestX, dy = ball.y - closestY;
                const dist = Math.hypot(dx, dy);
                if (dist < ball.r) {
                    // Push out
                    const overlap = ball.r - dist;
                    if (dist > 0.01) {
                        ball.x += dx / dist * overlap;
                        ball.y += dy / dist * overlap;
                    }
                    // Bounce
                    if (Math.abs(dx) > Math.abs(dy)) {
                        ball.vx *= -0.5;
                    } else {
                        ball.vy *= -0.5;
                    }
                }
            }

            // Boundary collision
            if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -0.5; }
            if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx *= -0.5; }
            if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -0.5; }
            if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy *= -0.5; }

            // Goal check
            if (Math.hypot(ball.x - goal.x, ball.y - goal.y) < goal.r) {
                score += 100 * level;
                document.getElementById('score').textContent = score;
                if (score > bestScore) { bestScore = score; localStorage.setItem('magnet-best', bestScore); document.getElementById('best').textContent = bestScore; }
                document.getElementById('endTitle').textContent = '🎉 第' + level + '关通过！';
                document.getElementById('endScore').textContent = score;
                document.getElementById('endOverlay').style.display = 'block';
                gameOver = true;
                for (let i = 0; i < 20; i++) {
                    particles.push({ x: goal.x, y: goal.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 20, color: '#ffd700' });
                }
            }

            // Decay magnets
            for (const m of magnets) { m.life--; }
            magnets = magnets.filter(m => m.life > 0);

            // Particles
            for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
            particles = particles.filter(p => p.life > 0);
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Background
            ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, W, H);
            // Grid
            ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
            for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

            // Walls
            for (const w of walls) {
                ctx.fillStyle = '#444'; ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.fillStyle = '#555'; ctx.fillRect(w.x, w.y, w.w, 3);
                ctx.fillStyle = '#333'; ctx.fillRect(w.x, w.y + w.h - 3, w.w, 3);
            }

            // Goal
            const goalPulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.3;
            ctx.fillStyle = `rgba(68,255,68,${goalPulse})`; ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r + 3, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#44ff44'; ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 10px "Segoe UI"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🏁', goal.x, goal.y);
            ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';

            // Particles
            for (const p of particles) {
                const color = p.color === '#44aaff' ? '68,170,255' : p.color === '#ff4444' ? '255,68,68' : '255,215,0';
                ctx.fillStyle = `rgba(${color},${p.life/(p.color==='#ffd700'?20:8)})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2); ctx.fill();
            }

            // Magnets
            for (const m of magnets) {
                const alpha = m.life / 120;
                ctx.fillStyle = m.type === 'attract' ? `rgba(68,170,255,${alpha*0.3})` : `rgba(255,68,68,${alpha*0.3})`;
                ctx.beginPath(); ctx.arc(m.x, m.y, m.r + 10, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = m.type === 'attract' ? `rgba(68,170,255,${alpha})` : `rgba(255,68,68,${alpha})`;
                ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
                // Magnet horseshoe symbol
                ctx.fillStyle = '#fff'; ctx.font = 'bold 14px "Segoe UI"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(m.type === 'attract' ? 'S' : 'N', m.x, m.y);
                ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
                // Field lines
                ctx.strokeStyle = m.type === 'attract' ? 'rgba(68,170,255,0.2)' : 'rgba(255,68,68,0.2)';
                ctx.lineWidth = 1;
                for (let a = 0; a < Math.PI*2; a += Math.PI/4) {
                    ctx.beginPath();
                    ctx.moveTo(m.x + Math.cos(a)*m.r, m.y + Math.sin(a)*m.r);
                    const ex = m.x + Math.cos(a)*(m.r + 25), ey = m.y + Math.sin(a)*(m.r + 25);
                    ctx.lineTo(ex, ey);
                    ctx.stroke();
                }
            }

            // Ball
            // Magnetic field glow
            if (magnets.length > 0) {
                let nearestDist = Infinity, nearestType = 'attract';
                for (const m of magnets) {
                    const d = Math.hypot(ball.x - m.x, ball.y - m.y);
                    if (d < nearestDist) { nearestDist = d; nearestType = m.type; }
                }
                const glowAlpha = Math.max(0, 0.5 - nearestDist / 400);
                ctx.fillStyle = nearestType === 'attract' ? `rgba(68,170,255,${glowAlpha})` : `rgba(255,68,68,${glowAlpha})`;
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r + 8, 0, Math.PI*2); ctx.fill();
            }
            // Ball body
            const ballGrad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 2, ball.x, ball.y, ball.r);
            ballGrad.addColorStop(0, '#eee'); ballGrad.addColorStop(1, '#888');
            ctx.fillStyle = ballGrad; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(ball.x - 2, ball.y - 3, 3, 0, Math.PI*2); ctx.fill();

            // Mouse preview (magnet placement indicator)
            if (mousePos && !gameOver) {
                ctx.strokeStyle = magnetType === 'attract' ? 'rgba(68,170,255,0.5)' : 'rgba(255,68,68,0.5)';
                ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 18, 0, Math.PI*2); ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = magnetType === 'attract' ? '#44aaff' : '#ff4444';
                ctx.font = 'bold 12px "Segoe UI"'; ctx.textAlign = 'center';
                ctx.fillText(magnetType === 'attract' ? '🧲 S极' : '🧲 N极', mousePos.x, mousePos.y - 22);
                ctx.textAlign = 'start';
            }

            // HUD
            ctx.fillStyle = '#aaa'; ctx.font = '12px "Segoe UI"'; ctx.textAlign = 'left';
            ctx.fillText(getLevelData().name, 10, H - 10);
            // Magnet mode indicator
            ctx.fillStyle = magnetType === 'attract' ? '#44aaff' : '#ff4444';
            ctx.fillText('当前: ' + (magnetType === 'attract' ? 'S极(吸引)' : 'N极(推开)') + ' | 右键切换', 10, 22);
            ctx.textAlign = 'start';
        }

        function placeMagnet(x, y) {
            magnets.push({ x, y, r: 14, type: magnetType, power: 1, life: 120 });
        }

        function nextLevel() {
            level++;
            gameOver = false;
            loadLevel();
            loop();
        }

        function loop() { update(); draw(); if (!gameOver) animId = requestAnimationFrame(loop); }

        // Controls
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mousePos = { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
        });
        canvas.addEventListener('mouseleave', () => { mousePos = null; });
        canvas.addEventListener('click', e => {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (W / rect.width);
            const my = (e.clientY - rect.top) * (H / rect.height);
            placeMagnet(mx, my);
        });
        canvas.addEventListener('contextmenu', e => {
            e.preventDefault();
            magnetType = magnetType === 'attract' ? 'repel' : 'attract';
        });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            for (const t of e.touches) {
                const mx = (t.clientX - rect.left) * (W / rect.width);
                const my = (t.clientY - rect.top) * (H / rect.height);
                placeMagnet(mx, my);
            }
        });

        // Keyboard to toggle magnet type
        document.addEventListener('keydown', e => {
            if (e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                magnetType = magnetType === 'attract' ? 'repel' : 'attract';
            }
        });

        document.getElementById('newBtn').addEventListener('click', newGame);
        window.addEventListener('resize', () => { resize(); });
        newGame();
    </script>
    <script src="/joy-game-study/nav.js"></script>
</body>
</html>
