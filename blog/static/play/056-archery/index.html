<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>056 - 射箭大师</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 10px; user-select: none; -webkit-user-select: none; }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }
        .top-bar { display: flex; gap: 16px; margin-bottom: 4px; font-size: clamp(0.8em, 2.5vw, 0.9em); color: #aaa; flex-wrap: wrap; justify-content: center; }
        .top-bar span { color: #ffd700; font-weight: bold; }
        .canvas-wrap { width: 100%; max-width: 400px; }
        canvas { width: 100%; display: block; border: 2px solid #333; border-radius: 6px; touch-action: manipulation; background: #2d5a1e; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 8px 18px; border: 2px solid #444; background: transparent; color: #ccc; border-radius: 8px; cursor: pointer; font-size: clamp(0.75em, 2.5vw, 0.9em); -webkit-tap-highlight-color: transparent; }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }
        .overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px; text-align: center; display: none; z-index: 10; }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; color: #ffd700; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button { padding: 10px 28px; font-size: 1em; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🏹 射箭大师 — #056</h1>
    <div class="top-bar">
        <span>⭐ <span id="score">0</span></span>
        <span>🎯 箭 <span id="arrows">10</span></span>
        <span>🏆 <span id="best">0</span></span>
    </div>
    <div class="canvas-wrap"><canvas id="game"></canvas></div>
    <div class="btn-row"><button class="btn primary" id="newBtn">🔄 新游戏</button></div>
    <div class="info" style="color:#555;font-size:0.7em;margin-top:4px;">💡 从弓向上拖拽瞄准靶心，松开发射！向上拖=箭向上飞 | 靶心=10分 | 10支箭挑战</div>
    <div class="overlay" id="endOverlay">
        <h2>🏹 箭已射完！</h2>
        <p>总分：<strong id="endScore">0</strong> | 10环次数：<strong id="endBull">0</strong></p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W, H, bow, arrows, target, score, bestScore, gameOver, animId;
        let dragging, dragPos, particles, arrowsLeft, bullCount, checkTimer;

        function resize() {
            const maxW = Math.min(canvas.parentElement.clientWidth, 400);
            W = maxW; H = Math.floor(W * 1.3);
            canvas.width = W; canvas.height = H;
        }

        function newGame() {
            cancelAnimationFrame(animId);
            if (checkTimer) { clearTimeout(checkTimer); checkTimer = null; }
            resize();
            score = 0; gameOver = false; arrowsLeft = 10; bullCount = 0;
            dragging = false; dragPos = null; particles = [];
            bestScore = parseInt(localStorage.getItem('archery-best') || '0');
            document.getElementById('score').textContent = '0';
            document.getElementById('arrows').textContent = '10';
            document.getElementById('best').textContent = bestScore;
            document.getElementById('endOverlay').style.display = 'none';
            // Bow at bottom center
            bow = { x: W/2, y: H - 65, r: 45 };
            arrows = [];
            // Target at top
            target = { x: W/2, y: H * 0.28, r: 60, angle: 0, rotSpeed: 0.008 + Math.random() * 0.012 };
            target.rotSpeed *= (Math.random() > 0.5 ? 1 : -1);
            loop();
        }

        function update() {
            if (gameOver) return;
            // Rotate target
            target.angle += target.rotSpeed;
            // Move arrows
            for (const a of arrows) {
                if (a.stuck) continue;
                a.x += a.vx; a.y += a.vy;
                a.vy += 0.06; // gentle gravity for realistic arc
                a.rot = Math.atan2(a.vy, a.vx);
                // Trail particle
                if (Math.random() < 0.6) {
                    particles.push({ x: a.x, y: a.y, vx: 0, vy: 0, life: 5, color: '#8B4513' });
                }
                // Hit target
                if (!a.stuck && Math.hypot(a.x - target.x, a.y - target.y) < target.r + 5) {
                    a.stuck = true;
                    const distFromCenter = Math.hypot(a.x - target.x, a.y - target.y);
                    const ringScore = Math.max(1, 10 - Math.floor(distFromCenter / (target.r / 5)));
                    score += ringScore;
                    if (ringScore === 10) bullCount++;
                    document.getElementById('score').textContent = score;
                    if (score > bestScore) { bestScore = score; localStorage.setItem('archery-best', bestScore); document.getElementById('best').textContent = bestScore; }
                    // Hit particles
                    for (let i = 0; i < 8; i++) {
                        particles.push({ x: a.x, y: a.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 18, color: ringScore >= 8 ? '#ffd700' : '#fff' });
                    }
                    a.popup = ringScore;
                    a.popupLife = 35;
                }
            }
            // Remove off-screen arrows
            arrows = arrows.filter(a => a.stuck || (a.y > -60 && a.y < H + 60 && a.x > -60 && a.x < W + 60));
            // Particles
            for (const p of particles) { p.life--; }
            particles = particles.filter(p => p.life > 0);
            // Popup decay
            for (const a of arrows) { if (a.popupLife > 0) a.popupLife--; }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Sky + grass background
            const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
            skyGrad.addColorStop(0, '#87CEEB'); skyGrad.addColorStop(0.52, '#90d0f0');
            skyGrad.addColorStop(0.52, '#4a8c2a'); skyGrad.addColorStop(1, '#2d5a1e');
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, H);

            // Target stand
            const standTop = target.y + target.r;
            const standBot = Math.min(H * 0.52, H - 20);
            ctx.fillStyle = '#8B4513'; ctx.fillRect(target.x - 3, standTop, 6, standBot - standTop);
            // Target legs
            ctx.fillStyle = '#6B3410'; ctx.fillRect(target.x - 9, standTop + 4, 18, 4);

            // Target with rotating rings
            ctx.save(); ctx.translate(target.x, target.y);
            ctx.rotate(target.angle);
            const rings = [
                { r: target.r, color: '#fff' },
                { r: target.r * 0.8, color: '#000' },
                { r: target.r * 0.64, color: '#4488ff' },
                { r: target.r * 0.48, color: '#ff4444' },
                { r: target.r * 0.32, color: '#ffd700' },
                { r: target.r * 0.16, color: '#ff4444' },
            ];
            for (const ring of rings) {
                ctx.fillStyle = ring.color; ctx.beginPath(); ctx.arc(0, 0, ring.r, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(0, 0, ring.r, 0, Math.PI*2); ctx.stroke();
            }
            // Cross lines
            ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(-target.r, 0); ctx.lineTo(target.r, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -target.r); ctx.lineTo(0, target.r); ctx.stroke();
            ctx.restore();

            // Particles (drawn behind bow)
            for (const p of particles) {
                const alpha = p.life / 18;
                ctx.fillStyle = p.color === '#ffd700'
                    ? `rgba(255,215,0,${alpha})`
                    : p.color === '#fff'
                    ? `rgba(255,255,255,${alpha})`
                    : `rgba(139,69,19,${alpha})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
            }

            // Stuck arrows on target
            for (const a of arrows) {
                if (!a.stuck) continue;
                ctx.save(); ctx.translate(a.x, a.y);
                ctx.rotate(a.rot || 0);
                // Shaft
                ctx.fillStyle = '#8B4513'; ctx.fillRect(-1.5, -20, 3, 40);
                // Feathers
                ctx.fillStyle = '#ff4444'; ctx.fillRect(-5, -22, 10, 8);
                ctx.fillStyle = '#ffd700'; ctx.fillRect(-4, -23, 8, 5);
                // Tip
                ctx.fillStyle = '#999'; ctx.beginPath();
                ctx.moveTo(-3, 18); ctx.lineTo(3, 18); ctx.lineTo(0, 25); ctx.closePath(); ctx.fill();
                ctx.restore();
                // Score popup
                if (a.popupLife > 0) {
                    const alpha = a.popupLife / 35;
                    const offsetY = (35 - a.popupLife) * 1.5;
                    ctx.fillStyle = `rgba(255,215,0,${alpha})`;
                    ctx.font = 'bold 16px "Segoe UI"'; ctx.textAlign = 'center';
                    ctx.fillText(a.popup + '分!', a.x, a.y - 28 - offsetY);
                    ctx.textAlign = 'start';
                }
            }

            // Bow (drawn after stuck arrows, before flying arrows)
            if (arrowsLeft > 0) {
                const bx = bow.x, by = bow.y, r = bow.r;
                // Draw bow arc - smile shape (bottom half), opening upward
                ctx.strokeStyle = '#6B3410'; ctx.lineWidth = 8; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.arc(bx, by, r, Math.PI, 2 * Math.PI); ctx.stroke();
                // Inner highlight
                ctx.strokeStyle = '#A0722A'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(bx, by, r - 2, Math.PI, 2 * Math.PI); ctx.stroke();

                // Grip (center bottom of bow)
                ctx.fillStyle = '#4a2800'; ctx.fillRect(bx - 4, by + r - 12, 8, 16);
                ctx.fillStyle = '#8B6914'; ctx.fillRect(bx - 3, by + r - 11, 6, 14);

                const leftX = bx + Math.cos(Math.PI) * r;   // bx - r
                const leftY = by + Math.sin(Math.PI) * r;   // by
                const rightX = bx + Math.cos(2*Math.PI) * r; // bx + r
                const rightY = by + Math.sin(2*Math.PI) * r; // by

                if (dragging && dragPos) {
                    // Pull direction from bow center to drag point
                    const dx = dragPos.x - bx;
                    const dy = dragPos.y - by;
                    const dist = Math.hypot(dx, dy);
                    const pullAngle = Math.atan2(dy, dx);
                    // Clamp pull distance
                    const pullDist = Math.min(r * 0.7, dist);
                    // Pull point (where string is pulled to)
                    const px = bx + Math.cos(pullAngle) * pullDist;
                    const py = by + Math.sin(pullAngle) * pullDist;

                    // Draw bowstring pulled to drag point (V shape)
                    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(leftX, leftY);
                    ctx.lineTo(px, py);
                    ctx.lineTo(rightX, rightY);
                    ctx.stroke();

                    // Arrow direction: same as drag direction (drag up → shoot up)
                    const shootAngle = pullAngle;
                    const power = pullDist / (r * 0.7);
                    const arrowLen = 40 + power * 40;

                    // Trajectory preview (dashed line in shoot direction)
                    ctx.setLineDash([6, 6]);
                    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(bx, by);
                    ctx.lineTo(bx + Math.cos(shootAngle) * arrowLen, by + Math.sin(shootAngle) * arrowLen);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Arrow shaft preview
                    ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(bx, by);
                    ctx.lineTo(bx + Math.cos(shootAngle) * (arrowLen * 0.7), by + Math.sin(shootAngle) * (arrowLen * 0.7));
                    ctx.stroke();
                    // Arrow tip preview
                    const tipX = bx + Math.cos(shootAngle) * (arrowLen * 0.7);
                    const tipY = by + Math.sin(shootAngle) * (arrowLen * 0.7);
                    ctx.fillStyle = '#999'; ctx.beginPath();
                    ctx.arc(tipX, tipY, 3, 0, Math.PI*2); ctx.fill();

                    // Power bar
                    const barW = 60, barH = 6;
                    ctx.fillStyle = '#333'; ctx.fillRect(bx - barW/2, by - r - 18, barW, barH);
                    const powerColor = power < 0.4 ? '#44ff44' : power < 0.75 ? '#ffd700' : '#ff4444';
                    ctx.fillStyle = powerColor; ctx.fillRect(bx - barW/2, by - r - 18, barW * power, barH);
                    ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
                    ctx.strokeRect(bx - barW/2, by - r - 18, barW, barH);

                    // Arrow nocked on the pulled string
                    // Draw a small arrow at bow center pointing in shoot direction
                    const nockLen = 18;
                    ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.moveTo(bx, by);
                    ctx.lineTo(bx + Math.cos(shootAngle) * nockLen, by + Math.sin(shootAngle) * nockLen);
                    ctx.stroke();
                } else {
                    // String at rest (straight across top of arc)
                    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(leftX, leftY);
                    ctx.lineTo(rightX, rightY);
                    ctx.stroke();

                    // Arrow at rest (pointing up from bow center)
                    const arrowLen = 25;
                    ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.moveTo(bx, by);
                    ctx.lineTo(bx, by - arrowLen);
                    ctx.stroke();
                    // Arrow tip
                    ctx.fillStyle = '#999'; ctx.beginPath();
                    ctx.moveTo(bx - 3, by - arrowLen + 5);
                    ctx.lineTo(bx + 3, by - arrowLen + 5);
                    ctx.lineTo(bx, by - arrowLen - 3);
                    ctx.closePath(); ctx.fill();
                }
            }

            // Flying arrows (drawn on top of bow)
            for (const a of arrows) {
                if (a.stuck) continue;
                ctx.save(); ctx.translate(a.x, a.y);
                ctx.rotate(a.rot || 0);
                // Shaft
                ctx.fillStyle = '#8B4513'; ctx.fillRect(-1, -16, 2, 32);
                // Feathers
                ctx.fillStyle = '#ff4444'; ctx.fillRect(-3, -18, 6, 7);
                ctx.fillStyle = '#ffd700'; ctx.fillRect(-2, -19, 4, 4);
                // Tip
                ctx.fillStyle = '#999'; ctx.beginPath();
                ctx.moveTo(-2, 14); ctx.lineTo(2, 14); ctx.lineTo(0, 20); ctx.closePath(); ctx.fill();
                ctx.restore();
            }

            // UI
            ctx.fillStyle = '#333'; ctx.font = 'bold 13px "Segoe UI"'; ctx.textAlign = 'center';
            ctx.fillText('🏹 剩余: ' + arrowsLeft + ' 支', W/2, H - 12);
            ctx.textAlign = 'start';
        }

        function endGame() {
            gameOver = true;
            document.getElementById('endScore').textContent = score;
            document.getElementById('endBull').textContent = bullCount;
            document.getElementById('endOverlay').style.display = 'block';
            if (score > bestScore) { bestScore = score; localStorage.setItem('archery-best', bestScore); }
        }

        function shootArrow() {
            if (arrowsLeft <= 0 || !dragPos) return;
            const bx = bow.x, by = bow.y;
            const dx = dragPos.x - bx;
            const dy = dragPos.y - by;
            const dist = Math.hypot(dx, dy);

            // Arrow shoots in drag direction. If no drag (tap), shoot straight up.
            const shootAngle = dist < 5 ? -Math.PI / 2 : Math.atan2(dy, dx);
            const power = Math.min(1, dist / (bow.r * 0.7));
            const speed = 7 + power * 8; // speed range: 7-15

            arrows.push({
                x: bx, y: by,
                vx: Math.cos(shootAngle) * speed,
                vy: Math.sin(shootAngle) * speed,
                rot: shootAngle, stuck: false
            });
            arrowsLeft--;
            document.getElementById('arrows').textContent = arrowsLeft;

            if (arrowsLeft <= 0) {
                function checkDone() {
                    if (gameOver) return;
                    const allDone = arrows.every(a => a.stuck || a.y > H + 50 || a.x < -50 || a.x > W + 50);
                    if (allDone) { endGame(); }
                    else { checkTimer = setTimeout(checkDone, 400); }
                }
                checkTimer = setTimeout(checkDone, 1200);
            }
        }

        function loop() { update(); draw(); if (!gameOver) animId = requestAnimationFrame(loop); }

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (W / rect.width),
                y: (e.clientY - rect.top) * (H / rect.height)
            };
        }

        canvas.addEventListener('mousedown', e => {
            if (gameOver || arrowsLeft <= 0) return;
            const pos = getCanvasPos(e);
            // Check if touch is near bow area
            if (Math.abs(pos.x - bow.x) < 70 && Math.abs(pos.y - bow.y) < 70) {
                dragging = true;
                dragPos = pos;
            }
        });
        canvas.addEventListener('mousemove', e => {
            if (!dragging) return;
            dragPos = getCanvasPos(e);
        });
        canvas.addEventListener('mouseup', e => {
            if (!dragging || !dragPos) return;
            shootArrow();
            dragging = false; dragPos = null;
        });
        canvas.addEventListener('mouseleave', e => {
            if (!dragging) return;
            shootArrow();
            dragging = false; dragPos = null;
        });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (gameOver || arrowsLeft <= 0) return;
            const pos = getCanvasPos(e.touches[0]);
            if (Math.abs(pos.x - bow.x) < 70 && Math.abs(pos.y - bow.y) < 70) {
                dragging = true;
                dragPos = pos;
            }
        });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!dragging) return;
            dragPos = getCanvasPos(e.touches[0]);
        });
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            if (!dragging || !dragPos) return;
            shootArrow();
            dragging = false; dragPos = null;
        });
        canvas.addEventListener('touchcancel', e => {
            e.preventDefault();
            if (!dragging) return;
            shootArrow();
            dragging = false; dragPos = null;
        });

        document.getElementById('newBtn').addEventListener('click', newGame);
        window.addEventListener('resize', () => { resize(); });
        newGame();
    </script>
    <script src="/joy-game-study/nav.js"></script>
</body>
</html>
