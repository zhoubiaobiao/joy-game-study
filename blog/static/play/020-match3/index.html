<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>020 - 消消乐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; min-height: 100dvh; padding: 10px;
            user-select: none; -webkit-user-select: none;
        }
        h1 { color: #00d4ff; font-size: clamp(1.2em, 4vw, 1.6em); margin-bottom: 2px; }

        .top-bar { display: flex; gap: 16px; margin-bottom: 6px; font-size: clamp(0.8em, 2.5vw, 0.95em); color: #aaa; flex-wrap: wrap; justify-content: center; }
        .top-bar span { color: #ffd700; font-weight: bold; }

        .board-wrap { width: 100%; max-width: 400px; aspect-ratio: 1; }
        .grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(7, 1fr); gap: 3px;
            width: 100%; height: 100%; padding: 2px;
            background: #0f0f23; border: 2px solid #333; border-radius: 8px;
        }
        .cell {
            background: #1a2840; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(1.2em, 5vw, 2em);
            cursor: pointer; transition: all 0.12s;
            -webkit-tap-highlight-color: transparent;
        }
        .cell.selected { background: #00d4ff33; border: 2px solid #00d4ff; transform: scale(1.05); }
        .cell.matched { animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); opacity: 0.5; } 100% { transform: scale(0); opacity: 0; } }

        .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 8px 18px; border: 2px solid #444; background: transparent;
            color: #ccc; border-radius: 8px; cursor: pointer;
            font-size: clamp(0.75em, 2.5vw, 0.9em);
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }

        .info { color: #555; font-size: 0.7em; margin-top: 4px; text-align: center; }

        .overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px;
            text-align: center; display: none; z-index: 10;
        }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; color: #ffd700; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button {
            padding: 10px 28px; font-size: 1em;
            background: #00d4ff; color: #1a1a2e; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin: 4px;
        }
    </style>
</head>
<body>
    <h1>💎 消消乐 — #020</h1>

    <div class="top-bar">
        <span>得分：<span id="score">0</span></span>
        <span>连消：<span id="combo">x1</span></span>
        <span>最佳：<span id="best">0</span></span>
    </div>

    <div class="board-wrap">
        <div class="grid" id="grid"></div>
    </div>

    <div class="btn-row">
        <button class="btn primary" id="newBtn">🔄 新游戏</button>
    </div>
    <div class="info">💡 点击两个相邻的宝石交换位置 | 三个或以上相同连成一线即消除</div>

    <div class="overlay" id="endOverlay">
        <h2>😵 无法移动</h2>
        <p>最终得分：<strong id="endScore">0</strong></p>
        <button onclick="newGame()">🔄 新游戏</button>
    </div>

    <script>
        const SIZE = 7;
        const GEMS = ['🔴','🟠','🟡','🟢','🔵','🟣'];
        let grid, score, bestScore, combo, selected = null, locked = false;

        function newGame() {
            grid = Array.from({length:SIZE},()=>Array(SIZE).fill(0));
            // 生成初始棋盘（无三连）
            for (let r=0; r<SIZE; r++) for (let c=0; c<SIZE; c++) {
                let g;
                do { g = Math.floor(Math.random()*GEMS.length); } while (
                    (r>=2 && grid[r-1][c]===g && grid[r-2][c]===g) ||
                    (c>=2 && grid[r][c-1]===g && grid[r][c-2]===g)
                );
                grid[r][c] = g;
            }
            score = 0; combo = 1; selected = null; locked = false;
            bestScore = parseInt(localStorage.getItem('match3-best')||'0');
            document.getElementById('score').textContent='0';
            document.getElementById('combo').textContent='x1';
            document.getElementById('best').textContent=bestScore;
            document.getElementById('endOverlay').style.display='none';
            render();
        }

        function findMatches() {
            const matched = new Set();
            // 横向
            for (let r=0; r<SIZE; r++) {
                for (let c=0; c<SIZE-2; c++) {
                    if (grid[r][c]===null) continue;
                    let len=1;
                    while (c+len<SIZE && grid[r][c+len]===grid[r][c]) len++;
                    if (len>=3) for (let i=0;i<len;i++) matched.add(r*SIZE+(c+i));
                    c += len-1;
                }
            }
            // 纵向
            for (let c=0; c<SIZE; c++) {
                for (let r=0; r<SIZE-2; r++) {
                    if (grid[r][c]===null) continue;
                    let len=1;
                    while (r+len<SIZE && grid[r+len][c]===grid[r][c]) len++;
                    if (len>=3) for (let i=0;i<len;i++) matched.add((r+i)*SIZE+c);
                    r += len-1;
                }
            }
            return matched;
        }

        function applyGravity() {
            for (let c=0; c<SIZE; c++) {
                let wr = SIZE-1;
                for (let r=SIZE-1; r>=0; r--) {
                    if (grid[r][c] !== null) grid[wr--][c] = grid[r][c];
                }
                while (wr >= 0) { grid[wr][c] = Math.floor(Math.random()*GEMS.length); wr--; }
            }
        }

        function processMatches() {
            let roundCombo = 0;
            let matches = findMatches();
            while (matches.size > 0) {
                roundCombo++;
                for (const idx of matches) {
                    const r = Math.floor(idx/SIZE), c = idx%SIZE;
                    grid[r][c] = null;
                }
                score += matches.size * 10 * roundCombo;
                document.getElementById('score').textContent = score;
                applyGravity();
                render();
                matches = findMatches();
            }
            return roundCombo;
        }

        function swap(r1,c1,r2,c2) {
            if (locked) return;
            locked = true;
            [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
            render();

            const matchCount = findMatches().size;
            if (matchCount === 0) {
                // 无匹配，换回
                setTimeout(() => {
                    [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
                    render(); locked = false;
                }, 250);
                return;
            }

            setTimeout(() => {
                const rounds = processMatches();
                combo = rounds > 1 ? Math.min(5, rounds) : 1;
                document.getElementById('combo').textContent = 'x' + combo;
                updateBest();
                locked = false;
            }, 150);
        }

        function updateBest() {
            if (score > bestScore) { bestScore = score; localStorage.setItem('match3-best', bestScore); document.getElementById('best').textContent = bestScore; }
        }

        function render() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            for (let r=0; r<SIZE; r++) for (let c=0; c<SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (selected && selected.r===r && selected.c===c) cell.classList.add('selected');
                cell.textContent = grid[r][c]!==null ? GEMS[grid[r][c]] : '';
                cell.addEventListener('click', () => cellClick(r,c));
                gridEl.appendChild(cell);
            }
        }

        function cellClick(r, c) {
            if (locked) return;
            if (selected === null) { selected = {r,c}; render(); return; }
            if (selected.r === r && selected.c === c) { selected = null; render(); return; }
            // 检查是否相邻
            const dr = Math.abs(selected.r-r), dc = Math.abs(selected.c-c);
            if ((dr===1&&dc===0) || (dr===0&&dc===1)) {
                swap(selected.r, selected.c, r, c);
                selected = null;
            } else { selected = {r,c}; render(); }
        }

        document.getElementById('newBtn').addEventListener('click', newGame);
        newGame();
    </script>
<script src="/joy-game-study/nav.js"></script>
</body>
</html>
