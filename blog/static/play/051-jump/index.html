<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>051 - 跳一跳</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 10px; user-select: none; -webkit-user-select: none; }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }
        .top-bar { display: flex; gap: 16px; margin-bottom: 4px; font-size: clamp(0.8em, 2.5vw, 0.9em); color: #aaa; flex-wrap: wrap; justify-content: center; }
        .top-bar span { color: #ffd700; font-weight: bold; }
        .canvas-wrap { width: 100%; max-width: 400px; }
        canvas { width: 100%; display: block; border: 2px solid #333; border-radius: 6px; touch-action: manipulation; background: #1a1a2e; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 8px 18px; border: 2px solid #444; background: transparent; color: #ccc; border-radius: 8px; cursor: pointer; font-size: clamp(0.75em, 2.5vw, 0.9em); -webkit-tap-highlight-color: transparent; }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }
        .overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px; text-align: center; display: none; z-index: 10; }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; color: #ffd700; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button { padding: 10px 28px; font-size: 1em; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🦘 跳一跳 — #051</h1>
    <div class="top-bar">
        <span>⭐ <span id="score">0</span></span>
        <span>🔥 连击 <span id="combo">0</span></span>
        <span>🏆 <span id="best">0</span></span>
    </div>
    <div class="canvas-wrap"><canvas id="game"></canvas></div>
    <div class="btn-row"><button class="btn primary" id="newBtn">🔄 新游戏</button></div>
    <div class="info" style="color:#555;font-size:0.7em;margin-top:4px;">💡 按住屏幕蓄力，松开跳跃 | 落在平台中心得2分+连击 | 落偏得1分 | 掉落则结束</div>
    <div class="overlay" id="endOverlay">
        <h2>💔 掉了！</h2>
        <p>得分：<strong id="endScore">0</strong> | 最高连击：<strong id="endCombo">0</strong></p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W, H, player, platforms, score, combo, bestScore, gameOver, animId;
        let charging, chargeStart, chargePower, camX, targetCamX, particles;

        function resize() {
            const maxW = Math.min(canvas.parentElement.clientWidth, 400);
            W = maxW; H = Math.floor(W * 1.4);
            canvas.width = W; canvas.height = H;
        }

        function newGame() {
            cancelAnimationFrame(animId);
            resize();
            score = 0; combo = 0; gameOver = false; camX = 0; targetCamX = 0;
            charging = false; chargePower = 0; particles = [];
            bestScore = parseInt(localStorage.getItem('jump-best') || '0');
            document.getElementById('score').textContent = '0';
            document.getElementById('combo').textContent = '0';
            document.getElementById('best').textContent = bestScore;
            document.getElementById('endOverlay').style.display = 'none';
            platforms = [{ x: W / 2, y: H * 0.75, w: 80, h: 14, color: '#44ff44' }];
            player = { x: W / 2, y: H * 0.75 - 20, w: 22, h: 26, vx: 0, vy: 0, onPlatform: 0, jumping: false, squash: 0 };
            spawnPlatform();
            loop();
        }

        function spawnPlatform() {
            const last = platforms[platforms.length - 1];
            const dir = Math.random() > 0.5 ? 1 : -1;
            const dist = 60 + Math.random() * 100;
            const nx = last.x + dir * dist;
            const ny = last.y - (30 + Math.random() * 25);
            platforms.push({ x: Math.max(40, Math.min(W * 3 - 40, nx)), y: Math.max(60, ny), w: 40 + Math.random() * 50, h: 14, color: `hsl(${Math.random()*360},70%,55%)` });
            if (platforms.length > 10) platforms.shift();
        }

        function update() {
            if (gameOver) return;
            // Charge
            if (charging && !player.jumping && player.onPlatform >= 0) {
                chargePower = Math.min(100, (Date.now() - chargeStart) / 10);
                player.squash = Math.min(0.4, chargePower / 250);
            }
            // Player physics
            if (player.jumping) {
                player.vy += 0.4; // gravity
                player.x += player.vx;
                player.y += player.vy;
                // Check landing on platforms
                player.onPlatform = -1;
                for (const p of platforms) {
                    if (player.vy > 0 && player.y + player.h / 2 >= p.y && player.y + player.h / 2 <= p.y + p.h + 10 &&
                        player.y - player.h / 2 < p.y &&
                        player.x + player.w / 2 > p.x - p.w / 2 && player.x - player.w / 2 < p.x + p.w / 2) {
                        player.y = p.y - player.h / 2;
                        player.vy = 0; player.vx = 0;
                        player.jumping = false;
                        player.onPlatform = platforms.indexOf(p);
                        player.squash = 0.15;
                        // Score
                        const distFromCenter = Math.abs(player.x - p.x);
                        if (distFromCenter < p.w * 0.12) {
                            score += 2; combo++;
                            for (let i = 0; i < 8; i++) particles.push({ x: player.x, y: player.y, vx: (Math.random()-0.5)*3, vy: -2-Math.random()*3, life: 20, color: '#ffd700' });
                        } else {
                            score += 1; combo = 0;
                        }
                        document.getElementById('score').textContent = score;
                        document.getElementById('combo').textContent = combo;
                        if (score > bestScore) { bestScore = score; localStorage.setItem('jump-best', bestScore); document.getElementById('best').textContent = bestScore; }
                        // Spawn next platform
                        spawnPlatform();
                        targetCamX = player.x - W / 2;
                        break;
                    }
                }
                // Fell off screen
                if (player.y > H + 60) { endGame(); return; }
            } else {
                // Squash recovery
                if (player.squash > 0.01) player.squash *= 0.85; else player.squash = 0;
            }
            // Camera
            camX += (targetCamX - camX) * 0.1;
            // Particles
            for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
            particles = particles.filter(p => p.life > 0);
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#1a1a3e'); bgGrad.addColorStop(1, '#0a0a2e');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

            ctx.save(); ctx.translate(-camX, 0);

            // Platforms
            for (const p of platforms) {
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(p.x - p.w/2 + 3, p.y + 3, p.w, p.h);
                // Body
                const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
                grad.addColorStop(0, p.color); grad.addColorStop(1, '#333');
                ctx.fillStyle = grad; ctx.fillRect(p.x - p.w/2, p.y, p.w, p.h);
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(p.x - p.w/2, p.y, p.w, 3);
            }

            // Particles
            for (const p of particles) {
                ctx.fillStyle = `rgba(255,215,0,${p.life/20})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
            }

            // Player
            const px = player.x, py = player.y;
            ctx.save(); ctx.translate(px, py);
            const sq = player.squash || 0;
            ctx.scale(1 + sq * 0.3, 1 - sq);
            // Body (kangaroo shape)
            ctx.fillStyle = '#ff8844';
            ctx.beginPath(); ctx.ellipse(0, -2, player.w/2, player.h/2, 0, 0, Math.PI*2); ctx.fill();
            // Head
            ctx.fillStyle = '#ffaa66'; ctx.beginPath(); ctx.arc(0, -player.h/2, player.w*0.35, 0, Math.PI*2); ctx.fill();
            // Eyes
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-4, -player.h/2-2, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, -player.h/2-2, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-4, -player.h/2-2, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(4, -player.h/2-2, 2, 0, Math.PI*2); ctx.fill();
            // Ears
            ctx.fillStyle = '#ff8844';
            ctx.beginPath(); ctx.ellipse(-8, -player.h/2-8, 3, 7, -0.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(8, -player.h/2-8, 3, 7, 0.2, 0, Math.PI*2); ctx.fill();
            // Tail
            ctx.fillStyle = '#ffaa66'; ctx.beginPath(); ctx.ellipse(0, player.h/2-4, 3, 6, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();

            ctx.restore(); // camera

            // Power bar
            if (charging && !player.jumping) {
                const barW = 120, barH = 12, bx = W/2 - barW/2, by = H - 50;
                ctx.fillStyle = '#333'; ctx.fillRect(bx, by, barW, barH);
                const grad2 = ctx.createLinearGradient(bx, 0, bx + barW, 0);
                grad2.addColorStop(0, '#44ff44'); grad2.addColorStop(0.6, '#ffd700'); grad2.addColorStop(1, '#ff4444');
                ctx.fillStyle = grad2; ctx.fillRect(bx, by, barW * chargePower / 100, barH);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "Segoe UI"'; ctx.textAlign = 'center';
                ctx.fillText('力度 ' + Math.floor(chargePower) + '%', W/2, by - 5);
                ctx.textAlign = 'start';
            }

            // Combo display
            if (combo >= 3) {
                ctx.fillStyle = '#ffd700'; ctx.font = 'bold 16px "Segoe UI"'; ctx.textAlign = 'center';
                ctx.fillText('🔥 x' + combo + ' 连击!', W/2, H * 0.2);
                ctx.textAlign = 'start';
            }
        }

        function endGame() {
            gameOver = true;
            document.getElementById('endScore').textContent = score;
            document.getElementById('endCombo').textContent = combo;
            document.getElementById('endOverlay').style.display = 'block';
            if (score > bestScore) { bestScore = score; localStorage.setItem('jump-best', bestScore); }
        }

        function loop() { update(); draw(); if (!gameOver) animId = requestAnimationFrame(loop); }

        canvas.addEventListener('mousedown', e => { e.preventDefault(); if (!gameOver && !player.jumping) { charging = true; chargeStart = Date.now(); } });
        canvas.addEventListener('mouseup', e => { e.preventDefault(); if (charging) releaseJump(); });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); if (!gameOver && !player.jumping) { charging = true; chargeStart = Date.now(); } });
        canvas.addEventListener('touchend', e => { e.preventDefault(); if (charging) releaseJump(); });

        function releaseJump() {
            charging = false;
            if (!player.jumping && player.onPlatform >= 0) {
                const power = chargePower / 100;
                const angle = -Math.PI/2 + (Math.random() - 0.5) * 0.2;
                player.vx = Math.cos(angle) * power * 8;
                player.vy = Math.sin(angle) * power * 10;
                player.jumping = true;
                player.onPlatform = -1;
            }
            chargePower = 0;
        }

        document.getElementById('newBtn').addEventListener('click', newGame);
        window.addEventListener('resize', () => { resize(); });
        newGame();
    </script>
    <script src="/joy-game-study/nav.js"></script>
</body>
</html>
