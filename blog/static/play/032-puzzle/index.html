<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>032 - 拼图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; min-height: 100dvh; padding: 10px;
            user-select: none; -webkit-user-select: none;
        }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }
        .top-bar { display: flex; gap: 16px; margin-bottom: 6px; font-size: clamp(0.8em, 2.5vw, 0.9em); color: #aaa; flex-wrap: wrap; justify-content: center; }
        .top-bar span { color: #ffd700; font-weight: bold; }
        .diff-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; justify-content: center; }
        .diff-btn {
            padding: 5px 12px; border: 2px solid #333; background: transparent;
            color: #aaa; border-radius: 8px; cursor: pointer;
            font-size: clamp(0.7em, 2.5vw, 0.85em);
            -webkit-tap-highlight-color: transparent;
        }
        .diff-btn.active { background: #00d4ff; color: #1a1a2e; border-color: #00d4ff; font-weight: bold; }
        .grid-wrap { width: 100%; max-width: 380px; }
        .grid {
            display: grid; gap: 3px; width: 100%; aspect-ratio: 1;
            padding: 4px; background: #0f0f23; border: 2px solid #333; border-radius: 8px;
        }
        .tile {
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(1.2em, 5vw, 2em); font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #0088aa);
            color: #fff; border-radius: 6px; cursor: pointer;
            transition: all 0.15s; -webkit-tap-highlight-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .tile:active { transform: scale(0.95); }
        .tile.empty { background: transparent; cursor: default; }
        .tile.correct { background: linear-gradient(135deg, #44dd66, #228833); }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 8px 18px; border: 2px solid #444; background: transparent;
            color: #ccc; border-radius: 8px; cursor: pointer;
            font-size: clamp(0.75em, 2.5vw, 0.9em);
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }
        .info { color: #555; font-size: 0.7em; margin-top: 4px; text-align: center; }
        .overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px;
            text-align: center; display: none; z-index: 10;
        }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; color: #ffd700; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button {
            padding: 10px 28px; font-size: 1em;
            background: #00d4ff; color: #1a1a2e; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin: 4px;
        }
    </style>
</head>
<body>
    <h1>🧩 拼图 — #032</h1>
    <div class="diff-row">
        <button class="diff-btn active" data-size="3">🟢 3×3</button>
        <button class="diff-btn" data-size="4">🟡 4×4</button>
        <button class="diff-btn" data-size="5">🔴 5×5</button>
    </div>
    <div class="top-bar">
        <span>步数：<span id="moves">0</span></span>
        <span>时间：<span id="timer">00:00</span></span>
        <span>最佳：<span id="best">---</span></span>
    </div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <div class="btn-row">
        <button class="btn" id="shuffleBtn">🔀 打乱</button>
        <button class="btn primary" id="newBtn">🔄 新游戏</button>
    </div>
    <div class="info">💡 点击与空格相邻的方块滑动 | 将所有方块按顺序排列</div>
    <div class="overlay" id="winOverlay">
        <h2>🎉 拼图完成！</h2>
        <p>步数：<strong id="winMoves">0</strong> | 用时：<strong id="winTime">0</strong></p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>
    <script>
        let SIZE = 3, board = [], emptyR, emptyC, moves, won, timerSec, timerInterval;
        let bestScores = JSON.parse(localStorage.getItem('puzzle-best') || '{}');

        function newGame() {
            clearInterval(timerInterval); timerInterval = null; timerSec = 0;
            won = false; moves = 0;
            document.getElementById('moves').textContent = '0';
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('winOverlay').style.display = 'none';
            // Solved board
            board = Array.from({ length: SIZE }, (_, r) =>
                Array.from({ length: SIZE }, (_, c) => r * SIZE + c + 1)
            );
            board[SIZE - 1][SIZE - 1] = 0;
            emptyR = SIZE - 1; emptyC = SIZE - 1;
            updateBestDisplay();
            shuffle();
            render();
        }

        function shuffle() {
            // Random moves from solved state
            for (let i = 0; i < SIZE * SIZE * 20; i++) {
                const neighbors = getAdjacent(emptyR, emptyC);
                const n = neighbors[Math.floor(Math.random() * neighbors.length)];
                swap(n.r, n.c);
            }
            moves = 0; won = false; timerSec = 0;
            clearInterval(timerInterval); timerInterval = null;
            document.getElementById('moves').textContent = '0';
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('winOverlay').style.display = 'none';
            render();
        }

        function getAdjacent(r, c) {
            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
            return dirs.map(([dr, dc]) => ({ r: r + dr, c: c + dc }))
                .filter(p => p.r >= 0 && p.r < SIZE && p.c >= 0 && p.c < SIZE);
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => { timerSec++; document.getElementById('timer').textContent = formatTime(timerSec); }, 1000);
        }

        function formatTime(s) { return Math.floor(s/60).toString().padStart(2,'0') + ':' + (s%60).toString().padStart(2,'0'); }

        function swap(r, c) {
            board[emptyR][emptyC] = board[r][c];
            board[r][c] = 0;
            emptyR = r; emptyC = c;
        }

        function clickTile(r, c) {
            if (won) return;
            if (board[r][c] === 0) return;
            const neighbors = getAdjacent(emptyR, emptyC);
            if (!neighbors.some(n => n.r === r && n.c === c)) return;
            startTimer();
            swap(r, c);
            moves++;
            document.getElementById('moves').textContent = moves;
            render();
            if (checkWin()) {
                won = true; clearInterval(timerInterval);
                document.getElementById('winMoves').textContent = moves;
                document.getElementById('winTime').textContent = formatTime(timerSec);
                const key = '' + SIZE;
                if (!bestScores[key] || moves < bestScores[key]) {
                    bestScores[key] = moves;
                    localStorage.setItem('puzzle-best', JSON.stringify(bestScores));
                }
                updateBestDisplay();
                document.getElementById('winOverlay').style.display = 'block';
            }
        }

        function checkWin() {
            for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
                if (r === SIZE - 1 && c === SIZE - 1) return board[r][c] === 0;
                if (board[r][c] !== r * SIZE + c + 1) return false;
            }
            return true;
        }

        function updateBestDisplay() {
            const key = '' + SIZE;
            document.getElementById('best').textContent = bestScores[key] ? bestScores[key] + '步' : '---';
        }

        function render() {
            const gridEl = document.getElementById('grid');
            gridEl.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
            gridEl.innerHTML = '';
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    if (board[r][c] === 0) { tile.classList.add('empty'); }
                    else {
                        tile.textContent = board[r][c];
                        if (board[r][c] === r * SIZE + c + 1) tile.classList.add('correct');
                        tile.addEventListener('click', () => clickTile(r, c));
                    }
                    gridEl.appendChild(tile);
                }
            }
        }

        document.getElementById('newBtn').addEventListener('click', newGame);
        document.getElementById('shuffleBtn').addEventListener('click', shuffle);
        document.querySelectorAll('.diff-btn').forEach(b => b.addEventListener('click', () => {
            document.querySelectorAll('.diff-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            SIZE = parseInt(b.dataset.size);
            newGame();
        }));

        newGame();
    </script>
    <script src="/joy-game-study/nav.js"></script>
</body>
</html>
