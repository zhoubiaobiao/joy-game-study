<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>009 - 扫雷</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; min-height: 100dvh; padding: 10px;
            user-select: none; -webkit-user-select: none;
        }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }

        .diff-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; justify-content: center; }
        .diff-btn {
            padding: 5px 12px; border: 2px solid #333; background: transparent;
            color: #aaa; border-radius: 8px; cursor: pointer;
            font-size: clamp(0.7em, 2.5vw, 0.85em);
            -webkit-tap-highlight-color: transparent;
        }
        .diff-btn.active { background: #00d4ff; color: #1a1a2e; border-color: #00d4ff; font-weight: bold; }

        .status-bar { display: flex; gap: 20px; margin-bottom: 4px; font-size: clamp(0.8em, 2.5vw, 0.9em); color: #aaa; }
        .status-bar span { color: #ffd700; font-weight: bold; font-family: 'Consolas', monospace; }

        .canvas-wrap { position: relative; width: 100%; max-width: 460px; }
        canvas { width: 100%; display: block; border: 2px solid #333; border-radius: 4px; touch-action: manipulation; }

        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 8px 18px; border: 2px solid #444; background: transparent;
            color: #ccc; border-radius: 8px; cursor: pointer;
            font-size: clamp(0.75em, 2.5vw, 0.9em);
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }

        .info { color: #555; font-size: 0.7em; margin-top: 4px; text-align: center; }

        .overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px;
            text-align: center; display: none; z-index: 10;
        }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; }
        .overlay.win h2 { color: #00ff88; }
        .overlay.lose h2 { color: #ff5555; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button {
            padding: 10px 28px; font-size: 1em;
            background: #00d4ff; color: #1a1a2e; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin: 4px;
        }
    </style>
</head>
<body>
    <h1>💣 扫雷 — #009</h1>

    <div class="diff-row">
        <button class="diff-btn active" data-diff="easy">🟢 初级 9×9</button>
        <button class="diff-btn" data-diff="medium">🟡 中级 12×12</button>
        <button class="diff-btn" data-diff="hard">🔴 高级 16×16</button>
    </div>

    <div class="status-bar">
        <span>💣 <span id="mines">10</span></span>
        <span>⏱ <span id="timer">000</span></span>
    </div>

    <div class="canvas-wrap"><canvas id="game"></canvas></div>

    <div class="btn-row">
        <button class="btn primary" id="newBtn">🔄 新一局</button>
    </div>
    <div class="info">💡 点击揭示 | 右键/长按标旗 | 数字代表周围雷数</div>

    <div class="overlay win" id="winOverlay">
        <h2>🎉 扫雷成功！</h2>
        <p>用时：<strong id="winTime">0</strong> 秒</p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>
    <div class="overlay lose" id="loseOverlay">
        <h2>💥 踩雷了！</h2>
        <p>用时：<strong id="loseTime">0</strong> 秒</p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        const DIFF = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 12, cols: 12, mines: 20 },
            hard: { rows: 16, cols: 16, mines: 40 },
        };

        let ROWS, COLS, MINES, CELL;
        let grid, revealed, flagged, gameOver, won, firstClick;
        let timerSec, timerInterval, flagCount;
        let difficulty = 'easy';
        let longPressTimer = null, longPressFired = false;
        let touchStartPos = null;

        const NUM_COLORS = ['', '#4499ff', '#44bb44', '#ff4444', '#8844cc', '#cc4400', '#00aaaa', '#000000', '#888888'];

        function resizeCanvas() {
            const maxW = Math.min(canvas.parentElement.clientWidth, 460);
            CELL = Math.floor(maxW / COLS);
            canvas.width = CELL * COLS; canvas.height = CELL * ROWS;
        }

        function createGrid() {
            grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            revealed = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
            flagged = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
            gameOver = false; won = false; firstClick = true;
            flagCount = 0; timerSec = 0;
            clearInterval(timerInterval); timerInterval = null;
            document.getElementById('timer').textContent = '000';
            document.getElementById('mines').textContent = MINES;
            document.getElementById('winOverlay').style.display = 'none';
            document.getElementById('loseOverlay').style.display = 'none';
            resizeCanvas();
            draw();
        }

        function placeMines(safeR, safeC) {
            const positions = [];
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
                positions.push([r, c]);
            }
            // Shuffle
            for (let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }
            for (let i = 0; i < Math.min(MINES, positions.length); i++) {
                const [r, c] = positions[i];
                grid[r][c] = -1;
            }
            // 计算数字
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                if (grid[r][c] === -1) continue;
                let count = 0;
                for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === -1) count++;
                }
                grid[r][c] = count;
            }
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                timerSec++;
                document.getElementById('timer').textContent = String(timerSec).padStart(3, '0');
            }, 1000);
        }

        function reveal(r, c) {
            if (gameOver || won || revealed[r][c] || flagged[r][c]) return;
            if (firstClick) {
                placeMines(r, c);
                firstClick = false;
                startTimer();
            }

            revealed[r][c] = true;

            if (grid[r][c] === -1) {
                // 踩雷
                gameOver = true;
                clearInterval(timerInterval); timerInterval = null;
                // 揭示所有雷
                for (let rr = 0; rr < ROWS; rr++) for (let cc = 0; cc < COLS; cc++) {
                    if (grid[rr][cc] === -1) revealed[rr][cc] = true;
                }
                document.getElementById('loseTime').textContent = timerSec;
                document.getElementById('loseOverlay').style.display = 'block';
                draw();
                return;
            }

            // 空白格递归展开
            if (grid[r][c] === 0) {
                for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) reveal(nr, nc);
                }
            }

            checkWin();
        }

        function toggleFlag(r, c) {
            if (gameOver || won || revealed[r][c]) return;
            if (firstClick) { startTimer(); firstClick = false; }

            if (flagged[r][c]) {
                flagged[r][c] = false;
                flagCount--;
            } else {
                flagged[r][c] = true;
                flagCount++;
            }
            document.getElementById('mines').textContent = MINES - flagCount;
            draw();
            checkWin();
        }

        function checkWin() {
            let allRevealed = true;
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                if (grid[r][c] !== -1 && !revealed[r][c]) { allRevealed = false; break; }
            }
            if (allRevealed && !gameOver) {
                won = true;
                clearInterval(timerInterval); timerInterval = null;
                document.getElementById('winTime').textContent = timerSec;
                document.getElementById('winOverlay').style.display = 'block';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                const x = c * CELL, y = r * CELL;

                if (revealed[r][c]) {
                    ctx.fillStyle = '#1a2840';
                    ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);

                    if (grid[r][c] === -1) {
                        // 地雷
                        ctx.fillStyle = '#ff4444';
                        ctx.beginPath();
                        ctx.arc(x + CELL / 2, y + CELL / 2, CELL * 0.3, 0, Math.PI * 2);
                        ctx.fill();
                        // 雷的尖刺
                        ctx.fillStyle = '#333';
                        ctx.fillRect(x + CELL / 2 - 1.5, y + CELL * 0.15, 3, CELL * 0.7);
                        ctx.fillRect(x + CELL * 0.15, y + CELL / 2 - 1.5, CELL * 0.7, 3);
                    } else if (grid[r][c] > 0) {
                        ctx.fillStyle = NUM_COLORS[grid[r][c]];
                        ctx.font = 'bold ' + Math.floor(CELL * 0.55) + 'px "Segoe UI"';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(grid[r][c], x + CELL / 2, y + CELL / 2);
                        ctx.textAlign = 'start';
                        ctx.textBaseline = 'alphabetic';
                    }
                } else {
                    // 未揭示的格子
                    const grad = ctx.createLinearGradient(x, y, x, y + CELL);
                    grad.addColorStop(0, '#2a3a5c');
                    grad.addColorStop(1, '#1e2d4a');
                    ctx.fillStyle = grad;
                    ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
                    // 高光
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.fillRect(x + 1, y + 1, CELL - 2, 2);
                    ctx.fillRect(x + 1, y + 1, 2, CELL - 2);

                    // 旗子
                    if (flagged[r][c]) {
                        ctx.fillStyle = '#ff4444';
                        ctx.beginPath();
                        ctx.moveTo(x + CELL * 0.25, y + CELL * 0.2);
                        ctx.lineTo(x + CELL * 0.7, y + CELL * 0.4);
                        ctx.lineTo(x + CELL * 0.25, y + CELL * 0.6);
                        ctx.fill();
                        ctx.strokeStyle = '#333';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(x + CELL * 0.25, y + CELL * 0.2);
                        ctx.lineTo(x + CELL * 0.25, y + CELL * 0.8);
                        ctx.stroke();
                        ctx.lineWidth = 1;
                    }
                }

                // 网格线
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(x, y, CELL, CELL);
            }
        }

        function getCell(e) {
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            const mx = (e.clientX - rect.left) * scale;
            const my = (e.clientY - rect.top) * scale;
            const c = Math.floor(mx / CELL);
            const r = Math.floor(my / CELL);
            if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return [r, c];
            return null;
        }

        function newGame() {
            clearInterval(timerInterval); timerInterval = null;
            createGrid();
        }

        // 鼠标事件
        canvas.addEventListener('click', (e) => {
            if (longPressFired) { longPressFired = false; return; }
            const cell = getCell(e);
            if (cell) reveal(cell[0], cell[1]);
            draw();
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const cell = getCell(e);
            if (cell) toggleFlag(cell[0], cell[1]);
            draw();
        });

        // 触摸事件（支持长按标旗）
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartPos = getCell(e.touches[0]);
            longPressFired = false;
            if (longPressTimer) clearTimeout(longPressTimer);
            longPressTimer = setTimeout(() => {
                if (touchStartPos) {
                    toggleFlag(touchStartPos[0], touchStartPos[1]);
                    draw();
                    longPressFired = true;
                }
            }, 400);
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (longPressTimer) clearTimeout(longPressTimer);
            if (!longPressFired && touchStartPos && !gameOver && !won) {
                reveal(touchStartPos[0], touchStartPos[1]);
                draw();
            }
            longPressFired = false;
        });

        canvas.addEventListener('touchmove', () => {
            if (longPressTimer) clearTimeout(longPressTimer);
        });

        document.getElementById('newBtn').addEventListener('click', newGame);
        document.querySelectorAll('.diff-btn').forEach(b => b.addEventListener('click', () => {
            document.querySelectorAll('.diff-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            difficulty = b.dataset.diff;
            const d = DIFF[difficulty];
            ROWS = d.rows; COLS = d.cols; MINES = d.mines;
            newGame();
        }));

        window.addEventListener('resize', () => { resizeCanvas(); draw(); });

        // 初始化
        const d = DIFF[difficulty];
        ROWS = d.rows; COLS = d.cols; MINES = d.mines;
        createGrid();
    </script>
<script src="/joy-game-study/nav.js"></script>
</body>
</html>
