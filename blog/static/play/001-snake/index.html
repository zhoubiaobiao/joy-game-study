<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>001 - 贪吃蛇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; min-height: 100dvh; padding: 12px;
            user-select: none; -webkit-user-select: none;
        }
        h1 { color: #00d4ff; font-size: clamp(1.2em, 4vw, 1.8em); margin-bottom: 4px; }
        .score { font-size: clamp(1em, 3vw, 1.3em); margin-bottom: 8px; color: #aaa; }
        .score span { color: #ffd700; font-weight: bold; }
        .canvas-wrap {
            position: relative; width: 100%; max-width: 500px;
            aspect-ratio: 1;
        }
        canvas {
            width: 100%; height: 100%;
            border: 2px solid #333; background: #16213e;
            border-radius: 4px; display: block;
            touch-action: none;
        }
        .mobile-controls {
            display: none; width: 100%; max-width: 500px; margin-top: 10px;
        }
        .dpad {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr; gap: 4px; width: 160px;
            margin: 0 auto;
        }
        .dpad button {
            width: 50px; height: 50px; border: 2px solid #444; background: #16213e;
            color: #ddd; border-radius: 8px; font-size: 1.3em; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .dpad button:active { background: #00d4ff33; border-color: #00d4ff; }
        .dpad .empty { border: none; background: transparent; }
        .action-btns { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
        .action-btns button {
            padding: 12px 24px; border: 2px solid #444; background: #16213e;
            color: #ddd; border-radius: 8px; font-size: 1em; cursor: pointer;
        }
        .action-btns button:active { background: #00d4ff33; border-color: #00d4ff; }

        /* Instructions */
        .howto {
            background: #16213e; border: 1px solid #333; border-radius: 10px;
            padding: 12px 18px; margin-top: 14px; width: 100%; max-width: 500px;
        }
        .howto h3 { color: #00d4ff; font-size: 0.95em; margin-bottom: 6px; }
        .howto ul { list-style: none; color: #aaa; font-size: 0.8em; line-height: 1.8; }
        .howto ul li::before { content: '▸ '; color: #00d4ff; }

        /* Navigation */
        .nav { display: flex; gap: 8px; margin-top: 14px; width: 100%; max-width: 500px; justify-content: space-between; }
        .nav a {
            padding: 10px 20px; border: 2px solid #444; border-radius: 8px;
            color: #ccc; text-decoration: none; font-size: 0.9em;
            transition: all 0.15s; white-space: nowrap;
        }
        .nav a:hover { border-color: #00d4ff; color: #00d4ff; }
        .nav a.disabled { opacity: 0.3; pointer-events: none; }

        .info { color: #777; font-size: 0.8em; margin-top: 8px; text-align: center; }

        .game-over-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92); padding: clamp(20px, 5vw, 30px) clamp(30px, 8vw, 50px);
            border-radius: 12px; text-align: center; display: none; z-index: 10;
        }
        .game-over-msg h2 { color: #ff4444; font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; }
        .game-over-msg p { color: #ccc; font-size: clamp(0.9em, 2.5vw, 1.2em); margin-bottom: 16px; }
        .game-over-msg button {
            padding: clamp(8px, 2vw, 10px) clamp(20px, 5vw, 30px);
            font-size: clamp(0.9em, 2.5vw, 1.1em);
            background: #00d4ff; color: #1a1a2e; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin: 4px;
        }

        @media (max-width: 600px), (hover: none) {
            .mobile-controls { display: block; }
        }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇 — #001</h1>
    <div class="score">得分：<span id="score">0</span></div>
    <div class="canvas-wrap"><canvas id="game"></canvas></div>
    <div class="mobile-controls">
        <div class="dpad">
            <div class="empty"></div><button id="btnUp">▲</button><div class="empty"></div>
            <button id="btnLeft">◀</button><button id="btnPause">⏯</button><button id="btnRight">▶</button>
            <div class="empty"></div><button id="btnDown">▼</button><div class="empty"></div>
        </div>
        <div class="action-btns"><button id="btnRestart">🔄 重来</button></div>
    </div>

    <div class="howto">
        <h3>📖 玩法说明</h3>
        <ul>
            <li>控制蛇吃红色食物，每吃一个 +10 分</li>
            <li>撞墙或撞到自己游戏结束</li>
            <li>随着得分增加，蛇移动速度越来越快</li>
            <li>桌面端：方向键 / WASD 控制 | 空格暂停 | R 重来</li>
            <li>手机端：滑动屏幕 或 使用下方方向按钮</li>
        </ul>
    </div>

    <div class="nav">
        <a class="disabled" href="#">◀ 上一个</a>
        <a href="/joy-game-study/">🏠 首页</a>
        <a href="/joy-game-study/play/002-sudoku/">下一个：🧩 数独 ▶</a>
    </div>

    <div class="info">游戏 #001 — Joy Game Studio</div>

    <div class="game-over-msg" id="gameOver">
        <h2>游戏结束 💀</h2>
        <p>最终得分：<strong id="finalScore">0</strong></p>
        <button onclick="restart()">🔄 再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let GRID, COLS, ROWS;
        let snake = [], food = {}, dir, nextDir;
        let score = 0, gameLoop = null, paused = false, speed = 120;

        function resizeCanvas() {
            const size = Math.min(canvas.parentElement.clientWidth, 500);
            canvas.width = size; canvas.height = size;
            GRID = Math.floor(size / 30);
            COLS = Math.floor(size / GRID);
            ROWS = Math.floor(size / GRID);
        }

        function init() {
            resizeCanvas();
            snake = [
                { x: Math.floor(COLS/2), y: Math.floor(ROWS/2) },
                { x: Math.floor(COLS/2)-1, y: Math.floor(ROWS/2) },
                { x: Math.floor(COLS/2)-2, y: Math.floor(ROWS/2) },
            ];
            dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
            score = 0; speed = 120; paused = false;
            document.getElementById('score').textContent = '0';
            document.getElementById('gameOver').style.display = 'none';
            placeFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
            draw();
        }

        function placeFood() {
            let pos;
            do { pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
            while (snake.some(s => s.x === pos.x && s.y === pos.y));
            food = pos;
        }

        function update() {
            dir = { ...nextDir };
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
            if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                placeFood();
                if (speed > 50) { speed -= 1; clearInterval(gameLoop); gameLoop = setInterval(update, speed); }
            } else { snake.pop(); }
            draw();
        }

        function draw() {
            ctx.fillStyle = '#16213e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 0.5;
            for (let x = 0; x <= canvas.width; x += GRID) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y <= canvas.height; y += GRID) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
            const fx = food.x * GRID + GRID/2, fy = food.y * GRID + GRID/2;
            ctx.fillStyle = `rgba(255,68,68,${0.6+0.4*Math.sin(Date.now()/200)})`;
            ctx.beginPath(); ctx.arc(fx, fy, GRID/2-1, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(fx-2, fy-2, 3, 0, Math.PI*2); ctx.fill();
            snake.forEach((s, i) => {
                const x = s.x*GRID+1, y = s.y*GRID+1, size = GRID-2;
                if (i===0) ctx.fillStyle = '#00ff88';
                else ctx.fillStyle = `rgb(0,${Math.max(Math.floor(255*(1-i/snake.length)),50)},${Math.floor(136*(1-i/snake.length))})`;
                ctx.beginPath(); ctx.roundRect(x, y, size, size, size>6?4:2); ctx.fill();
            });
            if (paused) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.floor(canvas.width/12)}px "Segoe UI"`; ctx.textAlign = 'center';
                ctx.fillText('⏸ 暂停中', canvas.width/2, canvas.height/2); ctx.textAlign = 'start';
            }
        }

        function gameOver() { clearInterval(gameLoop); gameLoop = null; document.getElementById('finalScore').textContent = score; document.getElementById('gameOver').style.display = 'block'; draw(); }

        function restart() { if (gameLoop) clearInterval(gameLoop); init(); }

        function changeDir(dx, dy) {
            if ((dx&&dir.x===-dx)||(dy&&dir.y===-dy)) return;
            nextDir = { x: dx, y: dy };
        }

        function togglePause() {
            if (!gameLoop && document.getElementById('gameOver').style.display!=='block') { restart(); return; }
            if (paused) { paused=false; gameLoop=setInterval(update,speed); }
            else { paused=true; clearInterval(gameLoop); gameLoop=null; }
            draw();
        }

        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k==='arrowup'||k==='w'){changeDir(0,-1);e.preventDefault();}
            if (k==='arrowdown'||k==='s'){changeDir(0,1);e.preventDefault();}
            if (k==='arrowleft'||k==='a'){changeDir(-1,0);e.preventDefault();}
            if (k==='arrowright'||k==='d'){changeDir(1,0);e.preventDefault();}
            if (k===' '){togglePause();e.preventDefault();}
            if (k==='r'){restart();e.preventDefault();}
        });

        document.getElementById('btnUp').addEventListener('click',()=>changeDir(0,-1));
        document.getElementById('btnDown').addEventListener('click',()=>changeDir(0,1));
        document.getElementById('btnLeft').addEventListener('click',()=>changeDir(-1,0));
        document.getElementById('btnRight').addEventListener('click',()=>changeDir(1,0));
        document.getElementById('btnPause').addEventListener('click',togglePause);
        document.getElementById('btnRestart').addEventListener('click',restart);

        let tsX=0,tsY=0;
        canvas.addEventListener('touchstart',e=>{tsX=e.touches[0].clientX;tsY=e.touches[0].clientY;});
        canvas.addEventListener('touchmove',e=>{
            const dx=e.touches[0].clientX-tsX,dy=e.touches[0].clientY-tsY;
            if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
            if(Math.abs(dx)>Math.abs(dy))changeDir(dx>0?1:-1,0);else changeDir(dy>0?1:-1,0);
            tsX=e.touches[0].clientX;tsY=e.touches[0].clientY;
        });

        window.addEventListener('resize',()=>{resizeCanvas();draw();});
        init();
    </script>
</body>
</html>
