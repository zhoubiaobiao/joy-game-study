<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>042 - 飞机大战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 10px; user-select: none; -webkit-user-select: none; }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }
        .top-bar { display: flex; gap: 16px; margin-bottom: 4px; font-size: clamp(0.8em, 2.5vw, 0.9em); color: #aaa; flex-wrap: wrap; justify-content: center; }
        .top-bar span { color: #ffd700; font-weight: bold; }
        .canvas-wrap { width: 100%; max-width: 360px; }
        canvas { width: 100%; display: block; border: 2px solid #333; border-radius: 6px; touch-action: manipulation; background: #000; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 8px 18px; border: 2px solid #444; background: transparent; color: #ccc; border-radius: 8px; cursor: pointer; font-size: clamp(0.75em, 2.5vw, 0.9em); -webkit-tap-highlight-color: transparent; }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }
        .overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px; text-align: center; display: none; z-index: 10; }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; color: #ffd700; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button { padding: 10px 28px; font-size: 1em; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>✈️ 飞机大战 — #042</h1>
    <div class="top-bar">
        <span>💥 <span id="score">0</span></span>
        <span>❤️ <span id="lives">5</span></span>
        <span>🏆 <span id="best">0</span></span>
    </div>
    <div class="canvas-wrap"><canvas id="game"></canvas></div>
    <div class="btn-row"><button class="btn primary" id="newBtn">🔄 新游戏</button></div>
    <div class="info" style="color:#555;font-size:0.7em;margin-top:4px;">💡 鼠标/触摸移动 | 自动射击 | 吃道具升级武器 | 每500分Boss来袭</div>
    <div class="overlay" id="endOverlay">
        <h2>💥 坠毁！</h2>
        <p>得分：<strong id="endScore">0</strong></p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W, H, player, bullets, enemies, particles, powerUps, score, lives, bestScore, gameOver, animId;
        let shootTimer, enemyTimer, powerUpTimer, bossTimer, hasBoss, bossHP;
        let weaponLevel, shieldActive;

        const POWER_TYPES = ['spread', 'rapid', 'shield'];
        const POWER_COLORS = { spread: '#ffd700', rapid: '#ff4444', shield: '#4444ff' };

        function resize() {
            const maxW = Math.min(canvas.parentElement.clientWidth, 360);
            W = maxW; H = Math.floor(W * 1.4);
            canvas.width = W; canvas.height = H;
        }

        function newGame() {
            cancelAnimationFrame(animId);
            resize();
            score = 0; lives = 5; gameOver = false;
            weaponLevel = 1; shieldActive = false; hasBoss = false; bossHP = 0;
            bestScore = parseInt(localStorage.getItem('shooter-best') || '0');
            document.getElementById('score').textContent = '0';
            document.getElementById('lives').textContent = '5';
            document.getElementById('best').textContent = bestScore;
            document.getElementById('endOverlay').style.display = 'none';
            player = { x: W / 2, y: H * 0.82, r: 10, invincible: 0 };
            bullets = []; enemies = []; particles = []; powerUps = [];
            shootTimer = 0; enemyTimer = 0; powerUpTimer = 0; bossTimer = 0;
            loop();
        }

        function spawnEnemy() {
            const type = Math.random();
            if (type < 0.5) {
                enemies.push({ x: W * 0.1 + Math.random() * W * 0.8, y: -20, r: 10, hp: 1, vx: 0, vy: 1.5 + score / 500, color: '#ff4444', score: 10 });
            } else if (type < 0.85) {
                const vx = (Math.random() - 0.5) * 2;
                enemies.push({ x: vx > 0 ? -15 : W + 15, y: H * 0.1 + Math.random() * H * 0.4, r: 12, hp: 2, vx, vy: 1, color: '#ff8844', score: 30 });
            } else {
                enemies.push({ x: W * 0.1 + Math.random() * W * 0.8, y: -20, r: 15, hp: 3, vx: (Math.random() - 0.5) * 1.5, vy: 0.8, color: '#ff44ff', score: 50 });
            }
        }

        function spawnBoss() {
            hasBoss = true;
            bossHP = 20 + score / 100;
            enemies.push({ x: W / 2, y: -40, r: 35, hp: bossHP, vx: 0.8, vy: 0.3, color: '#ff0000', score: 200, isBoss: true, maxHP: bossHP });
        }

        function spawnPowerUp(x, y) {
            const type = POWER_TYPES[Math.floor(Math.random() * 3)];
            powerUps.push({ x, y, type, r: 8, vy: 1, life: 300 });
        }

        function shoot() {
            if (weaponLevel === 1) {
                bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -8 });
            } else if (weaponLevel === 2) {
                bullets.push({ x: player.x - 5, y: player.y - 12, vx: 0, vy: -8 });
                bullets.push({ x: player.x + 5, y: player.y - 12, vx: 0, vy: -8 });
            } else {
                bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -8 });
                bullets.push({ x: player.x - 7, y: player.y - 10, vx: -0.5, vy: -7.5 });
                bullets.push({ x: player.x + 7, y: player.y - 10, vx: 0.5, vy: -7.5 });
            }
        }

        function addExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 15 + Math.random() * 15, color });
            }
        }

        function update() {
            if (gameOver) return;
            // Player invincibility
            if (player.invincible > 0) player.invincible--;

            // Shooting
            shootTimer++;
            const rate = weaponLevel === 3 ? 8 : weaponLevel === 2 ? 12 : 18;
            if (shootTimer >= rate) { shoot(); shootTimer = 0; }

            // Enemy spawn
            enemyTimer++;
            if (enemyTimer >= Math.max(20, 60 - score / 30)) { spawnEnemy(); enemyTimer = 0; }

            // Power-up spawn
            powerUpTimer++;
            if (powerUpTimer >= 300 + Math.random() * 200) { spawnPowerUp(W * 0.1 + Math.random() * W * 0.8, -20); powerUpTimer = 0; }

            // Boss check
            bossTimer++;
            if (!hasBoss && bossTimer > 500 + score * 2 && score > 0) { spawnBoss(); bossTimer = 0; }

            // Update bullets
            for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
            bullets = bullets.filter(b => b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);

            // Update enemies
            for (const e of enemies) {
                e.x += e.vx; e.y += e.vy;
                if (e.isBoss) {
                    if (e.x - e.r < 0 || e.x + e.r > W) e.vx *= -1;
                    if (e.y > H * 0.3) e.vy = 0;
                }
            }
            enemies = enemies.filter(e => e.y < H + 60);

            // Update power-ups
            for (const p of powerUps) { p.y += p.vy; p.life--; }
            powerUps = powerUps.filter(p => p.y < H + 30 && p.life > 0);

            // Bullet-enemy collision
            for (let bi = bullets.length - 1; bi >= 0; bi--) {
                const b = bullets[bi];
                for (let ei = enemies.length - 1; ei >= 0; ei--) {
                    const e = enemies[ei];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.r) {
                        bullets.splice(bi, 1);
                        e.hp--;
                        if (e.hp <= 0) {
                            score += e.score;
                            document.getElementById('score').textContent = score;
                            if (score > bestScore) { bestScore = score; localStorage.setItem('shooter-best', bestScore); document.getElementById('best').textContent = bestScore; }
                            addExplosion(e.x, e.y, e.color, e.isBoss ? 30 : 8);
                            if (e.isBoss) { hasBoss = false; weaponLevel = Math.min(3, weaponLevel + 1); }
                            if (Math.random() < 0.15) spawnPowerUp(e.x, e.y);
                            enemies.splice(ei, 1);
                        } else {
                            addExplosion(b.x, b.y, '#fff', 2);
                        }
                        break;
                    }
                }
            }

            // Player-enemy collision
            if (player.invincible <= 0) {
                for (let ei = enemies.length - 1; ei >= 0; ei--) {
                    const e = enemies[ei];
                    if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r) {
                        if (shieldActive) { shieldActive = false; enemies.splice(ei, 1); addExplosion(e.x, e.y, e.color, 8); player.invincible = 30; }
                        else { lives--; document.getElementById('lives').textContent = lives; player.invincible = 60; addExplosion(player.x, player.y, '#ff0', 10); }
                        if (lives <= 0) endGame();
                        break;
                    }
                }
            }

            // Player-powerup collision
            for (let pi = powerUps.length - 1; pi >= 0; pi--) {
                const p = powerUps[pi];
                if (Math.hypot(player.x - p.x, player.y - p.y) < player.r + p.r + 5) {
                    if (p.type === 'spread') weaponLevel = Math.min(3, weaponLevel + 1);
                    else if (p.type === 'rapid') weaponLevel = Math.min(3, weaponLevel + 1);
                    else if (p.type === 'shield') shieldActive = true;
                    addExplosion(p.x, p.y, POWER_COLORS[p.type], 6);
                    powerUps.splice(pi, 1);
                }
            }

            // Update particles
            for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
            particles = particles.filter(p => p.life > 0);
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Starfield
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
            for (let i = 0; i < 60; i++) {
                const sx = (i * 137.5 + Date.now() * 0.02 * (i % 3 + 1)) % W;
                const sy = (i * 97.3 + Date.now() * 0.05 * (i % 3 + 1)) % H;
                ctx.fillStyle = `rgba(255,255,255,${0.3 + (i % 3) * 0.2})`;
                ctx.fillRect(sx, sy, 1 + (i % 2), 1 + (i % 2));
            }

            // Power-ups
            for (const p of powerUps) {
                ctx.fillStyle = POWER_COLORS[p.type]; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 10px "Segoe UI"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(p.type === 'spread' ? 'S' : p.type === 'rapid' ? 'R' : '🛡', p.x, p.y);
            }

            // Enemies
            for (const e of enemies) {
                ctx.fillStyle = e.color; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(e.x - e.r * 0.25, e.y - e.r * 0.25, e.r * 0.35, 0, Math.PI * 2); ctx.fill();
                // HP bar for strong enemies
                if (e.hp > 2 || e.isBoss) {
                    const bw = e.r * 2;
                    ctx.fillStyle = '#333'; ctx.fillRect(e.x - bw / 2, e.y - e.r - 10, bw, 5);
                    ctx.fillStyle = '#ff4444'; ctx.fillRect(e.x - bw / 2, e.y - e.r - 10, bw * (e.hp / (e.maxHP || e.hp + 2)), 5);
                }
            }

            // Bullets
            for (const b of bullets) {
                ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2); ctx.fill();
            }

            // Particles
            for (const p of particles) {
                ctx.fillStyle = `rgba(${p.color === '#ff0' ? '255,255,0' : p.color === '#ff4444' ? '255,100,50' : '255,200,100'},${p.life / 30})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
            }

            // Player
            if (player.invincible <= 0 || Math.floor(player.invincible / 4) % 2 === 0) {
                ctx.fillStyle = '#00d4ff'; ctx.beginPath();
                ctx.moveTo(player.x, player.y - player.r);
                ctx.lineTo(player.x - player.r * 0.7, player.y + player.r);
                ctx.lineTo(player.x + player.r * 0.7, player.y + player.r);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(player.x, player.y - 2, player.r * 0.3, 0, Math.PI * 2); ctx.fill();
                // Shield
                if (shieldActive) {
                    ctx.strokeStyle = 'rgba(68,68,255,0.6)'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 8, 0, Math.PI * 2); ctx.stroke();
                }
            }

            // Weapon indicator
            ctx.fillStyle = '#ffd700'; ctx.font = '10px "Segoe UI"'; ctx.textAlign = 'left';
            ctx.fillText('🔫 Lv.' + weaponLevel + (shieldActive ? ' 🛡' : ''), 8, H - 8);

            // Boss HP bar
            if (hasBoss) {
                const boss = enemies.find(e => e.isBoss);
                if (boss) {
                    ctx.fillStyle = '#333'; ctx.fillRect(20, 20, W - 40, 8);
                    ctx.fillStyle = '#ff4444'; ctx.fillRect(20, 20, (W - 40) * (boss.hp / boss.maxHP), 8);
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText('BOSS', W / 2, 18);
                }
            }
            ctx.textAlign = 'start';
        }

        function endGame() {
            gameOver = true;
            document.getElementById('endScore').textContent = score;
            document.getElementById('endOverlay').style.display = 'block';
            if (score > bestScore) { bestScore = score; localStorage.setItem('shooter-best', bestScore); }
        }

        function loop() { update(); draw(); if (!gameOver) animId = requestAnimationFrame(loop); }

        // Mouse control
        canvas.addEventListener('mousemove', e => {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            player.x = (e.clientX - rect.left) * (W / rect.width);
            player.y = (e.clientY - rect.top) * (H / rect.height);
            player.x = Math.max(player.r, Math.min(W - player.r, player.x));
            player.y = Math.max(H * 0.5, Math.min(H - player.r, player.y));
        });

        // Touch control
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            player.x = (e.touches[0].clientX - rect.left) * (W / rect.width);
            player.y = (e.touches[0].clientY - rect.top) * (H / rect.height);
            player.x = Math.max(player.r, Math.min(W - player.r, player.x));
            player.y = Math.max(H * 0.5, Math.min(H - player.r, player.y));
        });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); if (gameOver) return; const rect = canvas.getBoundingClientRect(); player.x = (e.touches[0].clientX - rect.left) * (W / rect.width); player.y = (e.touches[0].clientY - rect.top) * (H / rect.height); });

        document.getElementById('newBtn').addEventListener('click', newGame);
        window.addEventListener('resize', () => { resize(); });
        newGame();
    </script>
    <script src="/joy-game-study/nav.js"></script>
</body>
</html>
