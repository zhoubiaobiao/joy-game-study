<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>003 - 2048</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px;
            user-select: none;
        }
        h1 { color: #00d4ff; font-size: 1.6em; margin-bottom: 2px; }
        .subtitle { color: #888; font-size: 0.85em; margin-bottom: 14px; }

        .header {
            display: flex; gap: 14px; align-items: center; margin-bottom: 14px;
        }
        .score-box {
            background: #16213e; border: 1px solid #333; border-radius: 8px;
            padding: 8px 20px; text-align: center; min-width: 90px;
        }
        .score-box .label { font-size: 0.7em; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .score-box .value { font-size: 1.5em; font-weight: bold; color: #fff; }
        .best .value { color: #ffd700; }

        .board {
            background: #16213e; border: 3px solid #333; border-radius: 8px;
            padding: 10px; position: relative; width: 420px; height: 420px;
        }
        .grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr); gap: 10px; width: 100%; height: 100%;
        }
        .cell {
            background: #0f0f23; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; transition: all 0.12s ease-in-out;
            position: relative;
        }
        .tile {
            width: 100%; height: 100%; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; position: absolute; top: 0; left: 0;
            animation: appear 0.15s ease-out;
        }
        @keyframes appear {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-row { display: flex; gap: 10px; margin-top: 14px; }
        .btn {
            padding: 10px 26px; background: transparent; color: #ccc;
            border: 2px solid #444; border-radius: 8px; cursor: pointer;
            font-size: 0.95em; transition: all 0.15s;
        }
        .btn:hover { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }
        .btn.primary:hover { background: #00d4ff44; }

        .tips { color: #555; font-size: 0.8em; margin-top: 10px; text-align: center; }

        .overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92); padding: 30px 50px; border-radius: 12px;
            text-align: center; display: none; z-index: 10;
        }
        .overlay h2 { font-size: 2em; margin-bottom: 10px; }
        .overlay.win h2 { color: #ffd700; }
        .overlay.lose h2 { color: #ff5555; }
        .overlay p { color: #ccc; margin-bottom: 18px; }
        .overlay button {
            padding: 10px 30px; font-size: 1em;
            background: #00d4ff; color: #1a1a2e; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }

        @media (max-width: 460px) {
            .board { width: 340px; height: 340px; }
            .grid { gap: 8px; }
            .cell { border-radius: 4px; }
        }
    </style>
</head>
<body>
    <h1>🔢 2048</h1>
    <p class="subtitle">游戏 #003 — 合并数字，冲向 2048！</p>

    <div class="header">
        <div class="score-box">
            <div class="label">得分</div>
            <div class="value" id="score">0</div>
        </div>
        <div class="score-box best">
            <div class="label">最佳</div>
            <div class="value" id="best">0</div>
        </div>
    </div>

    <div class="board">
        <div class="grid" id="grid">
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn" id="undoBtn">↩ 撤销</button>
        <button class="btn primary" id="newBtn">🔄 新游戏</button>
    </div>
    <p class="tips">方向键移动 | 触屏滑动 | 相同数字碰撞合并</p>

    <div class="overlay win" id="winOverlay">
        <h2>🎉 你做到了！</h2>
        <p>达到 2048！得分：<strong id="winScore">0</strong></p>
        <button onclick="continueGame()">🚀 继续挑战</button>
        <button onclick="newGame()" style="margin-left: 8px;">🔄 新游戏</button>
    </div>
    <div class="overlay lose" id="loseOverlay">
        <h2>😵 游戏结束</h2>
        <p>没有可移动的空间了<br>最终得分：<strong id="loseScore">0</strong></p>
        <button onclick="newGame()">🔄 再试一次</button>
    </div>

    <script>
        let grid = Array(4).fill().map(() => Array(4).fill(0));
        let score = 0, bestScore = 0, won = false, keepPlaying = false;
        let history = [];

        const elGrid = document.getElementById('grid');
        const elScore = document.getElementById('score');
        const elBest = document.getElementById('best');

        // Tile colors
        function tileStyle(value) {
            const colors = {
                0:      { bg: '#0f0f23', fg: '#0f0f23' },
                2:      { bg: '#eee4da', fg: '#776e65' },
                4:      { bg: '#ede0c8', fg: '#776e65' },
                8:      { bg: '#f2b179', fg: '#f9f6f2' },
                16:     { bg: '#f59563', fg: '#f9f6f2' },
                32:     { bg: '#f67c5f', fg: '#f9f6f2' },
                64:     { bg: '#f65e3b', fg: '#f9f6f2' },
                128:    { bg: '#edcf72', fg: '#f9f6f2' },
                256:    { bg: '#edcc61', fg: '#f9f6f2' },
                512:    { bg: '#edc850', fg: '#f9f6f2' },
                1024:   { bg: '#edc53f', fg: '#f9f6f2' },
                2048:   { bg: '#edc22e', fg: '#f9f6f2' },
                4096:   { bg: '#3c3a32', fg: '#f9f6f2' },
                8192:   { bg: '#3c3a32', fg: '#f9f6f2' },
            };
            const c = colors[value] || { bg: '#121110', fg: '#f9f6f2' };
            const fs = value >= 100 ? (value >= 1000 ? '1.5em' : '1.7em') : '2em';
            return `background:${c.bg};color:${c.fg};font-size:${fs}`;
        }

        function saveState() {
            history.push({ grid: grid.map(r => [...r]), score });
            if (history.length > 10) history.shift(); // keep last 10
        }

        function undo() {
            if (history.length === 0) return;
            const prev = history.pop();
            grid = prev.grid;
            score = prev.score;
            render();
        }

        function addTile() {
            const empty = [];
            for (let r = 0; r < 4; r++)
                for (let c = 0; c < 4; c++)
                    if (grid[r][c] === 0) empty.push([r, c]);
            if (empty.length === 0) return;
            const [r, c] = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        }

        function render() {
            elGrid.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const val = grid[r][c];
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.cssText = tileStyle(val);
                    cell.textContent = val || '';
                    cell.style.gridRow = r + 1;
                    cell.style.gridColumn = c + 1;
                    elGrid.appendChild(cell);
                }
            }
            elScore.textContent = score;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('2048-best', bestScore);
            }
            elBest.textContent = bestScore;
        }

        function slide(row) {
            // Compact non-zero values
            let arr = row.filter(v => v !== 0);
            // Merge
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            // Pad to 4
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function move(dir) {
            // dir: 'up','down','left','right'
            const old = grid.map(r => [...r]);
            const oldScore = score;

            if (dir === 'left') {
                for (let r = 0; r < 4; r++) grid[r] = slide(grid[r]);
            } else if (dir === 'right') {
                for (let r = 0; r < 4; r++) grid[r] = slide(grid[r].reverse()).reverse();
            } else if (dir === 'up') {
                for (let c = 0; c < 4; c++) {
                    const col = slide([grid[0][c], grid[1][c], grid[2][c], grid[3][c]]);
                    for (let r = 0; r < 4; r++) grid[r][c] = col[r];
                }
            } else if (dir === 'down') {
                for (let c = 0; c < 4; c++) {
                    const col = slide([grid[3][c], grid[2][c], grid[1][c], grid[0][c]]);
                    for (let r = 0; r < 4; r++) grid[r][c] = col[3 - r];
                }
            }

            // Check if anything changed
            const changed = grid.some((r, i) => r.some((v, j) => v !== old[i][j]));
            if (!changed) return false;

            saveState();
            addTile();
            render();

            // Check win (once)
            if (!won && !keepPlaying) {
                for (let r = 0; r < 4; r++)
                    for (let c = 0; c < 4; c++)
                        if (grid[r][c] >= 2048) {
                            won = true;
                            setTimeout(() => {
                                document.getElementById('winScore').textContent = score;
                                document.getElementById('winOverlay').style.display = 'block';
                            }, 200);
                        }
            }

            // Check game over
            if (isGameOver()) {
                setTimeout(() => {
                    document.getElementById('loseScore').textContent = score;
                    document.getElementById('loseOverlay').style.display = 'block';
                }, 300);
            }

            return true;
        }

        function canMove() {
            for (let r = 0; r < 4; r++)
                for (let c = 0; c < 4; c++) {
                    if (grid[r][c] === 0) return true;
                    if (c < 3 && grid[r][c] === grid[r][c + 1]) return true;
                    if (r < 3 && grid[r][c] === grid[r + 1][c]) return true;
                }
            return false;
        }

        function isGameOver() {
            if (canMove()) return false;
            // Check if it was already game-over'd
            return true;
        }

        function continueGame() {
            keepPlaying = true;
            document.getElementById('winOverlay').style.display = 'none';
        }

        function newGame() {
            grid = Array(4).fill().map(() => Array(4).fill(0));
            score = 0; won = false; keepPlaying = false; history = [];
            addTile(); addTile();
            document.getElementById('winOverlay').style.display = 'none';
            document.getElementById('loseOverlay').style.display = 'none';
            render();
        }

        // --- Events ---
        document.addEventListener('keydown', e => {
            const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                          w: 'up', s: 'down', a: 'left', d: 'right',
                          W: 'up', S: 'down', A: 'left', D: 'right' };
            if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
        });

        // Touch swipe
        let tsX = 0, tsY = 0;
        document.addEventListener('touchstart', e => {
            tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
        });
        document.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - tsX;
            const dy = e.changedTouches[0].clientY - tsY;
            if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
            if (Math.abs(dx) > Math.abs(dy)) {
                move(dx > 0 ? 'right' : 'left');
            } else {
                move(dy > 0 ? 'down' : 'up');
            }
        });

        document.getElementById('newBtn').addEventListener('click', newGame);
        document.getElementById('undoBtn').addEventListener('click', undo);

        // --- Init ---
        bestScore = parseInt(localStorage.getItem('2048-best') || '0');
        elBest.textContent = bestScore;
        newGame();
    </script>
</body>
</html>
