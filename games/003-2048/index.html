<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>003 - 2048</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; min-height: 100dvh; padding: 14px;
            user-select: none; -webkit-user-select: none;
        }
        h1 { color: #00d4ff; font-size: clamp(1.2em, 4vw, 1.6em); margin-bottom: 2px; }

        .header { display: flex; gap: 10px; margin-bottom: 10px; }
        .score-box {
            background: #16213e; border: 1px solid #333; border-radius: 8px;
            padding: 6px 16px; text-align: center; min-width: 80px;
        }
        .score-box .label { font-size: 0.7em; color: #888; letter-spacing: 1px; }
        .score-box .value { font-size: clamp(1em, 3vw, 1.5em); font-weight: bold; }
        .best .value { color: #ffd700; }

        .board-wrap { width: 100%; max-width: 420px; aspect-ratio: 1; }
        .board {
            background: #16213e; border: 2px solid #333; border-radius: 8px;
            width: 100%; height: 100%; padding: 2%;
        }
        .grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr); gap: 2.5%; width: 100%; height: 100%;
        }
        .cell {
            background: #0f0f23; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: clamp(1em, 6vw, 2em);
            transition: all 0.1s;
        }
        .btn-row { display: flex; gap: 8px; margin-top: 12px; }
        .btn {
            padding: 10px 22px; border: 2px solid #444; background: transparent;
            color: #ccc; border-radius: 8px; cursor: pointer;
            font-size: 0.9em; -webkit-tap-highlight-color: transparent;
        }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }

        .overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px;
            text-align: center; display: none; z-index: 10;
        }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; }
        .overlay.win h2 { color: #ffd700; }
        .overlay.lose h2 { color: #ff5555; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button {
            padding: 10px 28px; font-size: 1em;
            background: #00d4ff; color: #1a1a2e; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin: 4px;
        }
        .overlay .countdown { color: #888; font-size: 0.8em; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>🔢 2048 — #003</h1>
    <div class="header">
        <div class="score-box"><div class="label">得分</div><div class="value" id="score">0</div></div>
        <div class="score-box best"><div class="label">最佳</div><div class="value" id="best">0</div></div>
    </div>

    <div class="board-wrap">
        <div class="board"><div class="grid" id="grid"></div></div>
    </div>

    <div class="btn-row">
        <button class="btn" id="undoBtn">↩ 撤销</button>
        <button class="btn primary" id="newBtn">🔄 新游戏</button>
    </div>


    <div class="overlay win" id="winOverlay">
        <h2>🎉 你做到了！</h2><p>得分：<strong id="winScore">0</strong></p>
        <button onclick="window.location.href='/joy-game-study/play/004-tetris/'">▶ 下一个游戏</button>
        <button onclick="continueGame()">🚀 继续挑战</button>
        <p class="countdown" id="cdText"></p>
    </div>
    <div class="overlay lose" id="loseOverlay">
        <h2>😵 游戏结束</h2><p>得分：<strong id="loseScore">0</strong></p>
        <button onclick="newGame()">🔄 再试</button>
    </div>

    <script>
        let grid = Array(4).fill().map(() => Array(4).fill(0));
        let score = 0, bestScore = 0, won = false, keepPlaying = false, history = [];
        let countdownTimer = null;

        function tileStyle(value) {
            const colors = {
                0:{bg:'#0f0f23',fg:'#0f0f23'},2:{bg:'#eee4da',fg:'#776e65'},4:{bg:'#ede0c8',fg:'#776e65'},
                8:{bg:'#f2b179',fg:'#f9f6f2'},16:{bg:'#f59563',fg:'#f9f6f2'},32:{bg:'#f67c5f',fg:'#f9f6f2'},
                64:{bg:'#f65e3b',fg:'#f9f6f2'},128:{bg:'#edcf72',fg:'#f9f6f2'},256:{bg:'#edcc61',fg:'#f9f6f2'},
                512:{bg:'#edc850',fg:'#f9f6f2'},1024:{bg:'#edc53f',fg:'#f9f6f2'},2048:{bg:'#edc22e',fg:'#f9f6f2'},
            };
            return colors[value] || { bg: '#121110', fg: '#f9f6f2' };
        }

        function saveState() { history.push({grid:grid.map(r=>[...r]), score}); if (history.length>10) history.shift(); }
        function undo() { if (!history.length) return; const p=history.pop(); grid=p.grid; score=p.score; render(); }

        function addTile() {
            const empty = [];
            for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (grid[r][c]===0) empty.push([r,c]);
            if (!empty.length) return;
            const [r,c] = empty[Math.floor(Math.random()*empty.length)];
            grid[r][c] = Math.random()<0.9 ? 2 : 4;
        }

        function render() {
            const el = document.getElementById('grid');
            el.innerHTML = '';
            for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
                const cell = document.createElement('div'); cell.className = 'cell';
                const s = tileStyle(grid[r][c]);
                cell.style.cssText = `background:${s.bg};color:${s.fg};`;
                cell.textContent = grid[r][c] || ''; el.appendChild(cell);
            }
            document.getElementById('score').textContent = score;
            if (score > bestScore) { bestScore = score; localStorage.setItem('2048-best', bestScore); }
            document.getElementById('best').textContent = bestScore;
        }

        function slide(row) {
            let arr = row.filter(v=>v!==0);
            for (let i=0; i<arr.length-1; i++) if (arr[i]===arr[i+1]) { arr[i]*=2; score+=arr[i]; arr.splice(i+1,1); }
            while (arr.length<4) arr.push(0);
            return arr;
        }

        function move(dir) {
            const old=grid.map(r=>[...r]);
            if (dir==='left') for (let r=0;r<4;r++) grid[r]=slide(grid[r]);
            else if (dir==='right') for (let r=0;r<4;r++) grid[r]=slide(grid[r].reverse()).reverse();
            else if (dir==='up') for (let c=0;c<4;c++) { const col=slide([grid[0][c],grid[1][c],grid[2][c],grid[3][c]]); for (let r=0;r<4;r++) grid[r][c]=col[r]; }
            else if (dir==='down') for (let c=0;c<4;c++) { const col=slide([grid[3][c],grid[2][c],grid[1][c],grid[0][c]]); for (let r=0;r<4;r++) grid[r][c]=col[3-r]; }
            if (grid.every((r,i)=>r.every((v,j)=>v===old[i][j]))) return false;
            saveState(); addTile(); render();
            if (!won && !keepPlaying) {
                for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (grid[r][c]>=2048) {
                    won=true;
                    document.getElementById('winScore').textContent=score;
                    document.getElementById('winOverlay').style.display='block';
                    // Auto countdown
                    let sec=5;
                    document.getElementById('cdText').textContent = `${sec} 秒后自动跳转...`;
                    countdownTimer = setInterval(()=>{
                        sec--; if(sec<=0){clearInterval(countdownTimer);window.location.href='/joy-game-study/play/004-tetris/';}
                        else document.getElementById('cdText').textContent = `${sec} 秒后自动跳转...`;
                    },1000);
                }
            }
            if (isGameOver()) setTimeout(()=>{document.getElementById('loseScore').textContent=score;document.getElementById('loseOverlay').style.display='block';},300);
            return true;
        }

        function canMove() {
            for (let r=0;r<4;r++) for (let c=0;c<4;c++) { if (grid[r][c]===0) return true; if (c<3&&grid[r][c]===grid[r][c+1]) return true; if (r<3&&grid[r][c]===grid[r+1][c]) return true; }
            return false;
        }
        function isGameOver() { return !canMove(); }
        function continueGame() {
            keepPlaying=true;
            if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;}
            document.getElementById('winOverlay').style.display='none';
        }
        function newGame() {
            if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;}
            grid=Array(4).fill().map(()=>Array(4).fill(0)); score=0; won=false; keepPlaying=false; history=[];
            addTile(); addTile(); render();
            document.getElementById('winOverlay').style.display='none'; document.getElementById('loseOverlay').style.display='none';
        }

        document.addEventListener('keydown', e => {
            const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
            if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
            if (e.ctrlKey&&e.key==='z') { e.preventDefault(); undo(); }
        });

        let tsX=0, tsY=0;
        document.addEventListener('touchstart', e => { tsX=e.touches[0].clientX; tsY=e.touches[0].clientY; });
        document.addEventListener('touchend', e => {
            const dx=e.changedTouches[0].clientX-tsX, dy=e.changedTouches[0].clientY-tsY;
            if (Math.abs(dx)<25&&Math.abs(dy)<25) return;
            move(Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'));
        });

        document.getElementById('newBtn').addEventListener('click', newGame);
        document.getElementById('undoBtn').addEventListener('click', undo);

        bestScore = parseInt(localStorage.getItem('2048-best')||'0');
        document.getElementById('best').textContent = bestScore;
        newGame();
    </script>
<script src="/joy-game-study/nav.js"></script>
</body>
</html>
