<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>006 - 弹球</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; min-height: 100dvh; padding: 8px;
            user-select: none; -webkit-user-select: none;
        }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }

        .status-bar {
            display: flex; gap: 14px; align-items: center; margin-bottom: 4px;
            font-size: clamp(0.8em, 2.5vw, 0.95em); color: #aaa;
        }
        .status-bar .val { color: #ffd700; font-weight: bold; }
        .status-bar .lives { color: #ff5555; }

        .canvas-wrap {
            position: relative; width: 100%; max-width: 400px;
            aspect-ratio: 2 / 3;
        }
        canvas {
            width: 100%; height: 100%;
            border: 2px solid #333; background: #0a0a1a;
            border-radius: 6px; display: block;
            touch-action: manipulation;
        }

        .mobile-ctrls {
            display: none; width: 100%; max-width: 400px; margin-top: 8px;
        }
        .flipper-row { display: flex; gap: 12px; justify-content: center; }
        .flipper-btn {
            width: 120px; height: 56px; border: 2px solid #00d4ff66; background: #00d4ff11;
            color: #00d4ff; border-radius: 12px; font-size: 1.1em; font-weight: bold;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            letter-spacing: 2px;
        }
        .flipper-btn:active, .flipper-btn.active { background: #00d4ff33; border-color: #00d4ff; }

        .btn-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 8px 18px; border: 2px solid #444; background: transparent;
            color: #ccc; border-radius: 8px; cursor: pointer;
            font-size: clamp(0.75em, 2.5vw, 0.9em);
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }

        .info { color: #555; font-size: 0.7em; margin-top: 4px; text-align: center; }

        .overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px;
            text-align: center; display: none; z-index: 10;
        }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; }
        .overlay.lose h2 { color: #ff5555; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button {
            padding: 10px 28px; font-size: 1em;
            background: #00d4ff; color: #1a1a2e; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin: 4px;
        }

        @media (max-width: 500px), (hover: none) {
            .mobile-ctrls { display: block; }
        }
    </style>
</head>
<body>
    <h1>🦾 弹球 — #006</h1>

    <div class="status-bar">
        <span>得分：<span class="val" id="score">0</span></span>
        <span>连击：<span class="val" id="combo">x1</span></span>
        <span class="lives">⚫ <span id="lives">3</span></span>
    </div>

    <div class="canvas-wrap"><canvas id="game"></canvas></div>

    <div class="mobile-ctrls">
        <div class="flipper-row">
            <button class="flipper-btn" id="btnLeft">◀◀ 左挡板</button>
            <button class="flipper-btn" id="btnRight">右挡板 ▶▶</button>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn primary" id="launchBtn">🚀 发射</button>
        <button class="btn" id="pauseBtn">⏯ 暂停</button>
    </div>

    <div class="info">💡 键盘：A/D 或 ←→ 控制左右挡板 | 空格发射 | P 暂停</div>

    <div class="overlay lose" id="loseOverlay">
        <h2>💥 游戏结束</h2>
        <p>得分：<strong id="loseScore">0</strong> | 最高连击：<strong id="loseCombo">x1</strong></p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W, H;

        // 物理常量
        const GRAVITY = 0.35;
        const BOUNCE = 0.55;
        const WALL_BOUNCE = 0.7;
        const BUMPER_FORCE = 8;
        const FLIPPER_LENGTH = 64;
        const FLIPPER_WIDTH = 10;
        const BALL_R = 7;

        // 游戏状态
        let ball, flippers, bumpers, walls;
        let score = 0, lives = 3, combo = 1, maxCombo = 1;
        let comboTimer = 0;
        let gameState = 'ready'; // ready | playing | paused | lost
        let animationId = null;
        let leftDown = false, rightDown = false;
        let particles = [];

        function resizeCanvas() {
            const size = Math.min(canvas.parentElement.clientWidth, 400);
            canvas.width = size;
            canvas.height = size * 1.5;
            W = canvas.width; H = canvas.height;
        }

        function createFlippers() {
            const pivotY = H - 60;
            const pivotLX = W * 0.22;
            const pivotRX = W * 0.78;
            flippers = [
                {
                    pivotX: pivotLX, pivotY: pivotY,
                    angle: 0.35,        // 当前角度（弧度，0=水平向右）
                    restAngle: 0.35,    // 静止角度
                    activeAngle: -0.55, // 激活角度
                    length: FLIPPER_LENGTH,
                    width: FLIPPER_WIDTH,
                    side: 'left',
                    active: false,
                    angularVel: 0,
                },
                {
                    pivotX: pivotRX, pivotY: pivotY,
                    angle: Math.PI - 0.35,
                    restAngle: Math.PI - 0.35,
                    activeAngle: Math.PI + 0.55,
                    length: FLIPPER_LENGTH,
                    width: FLIPPER_WIDTH,
                    side: 'right',
                    active: false,
                    angularVel: 0,
                },
            ];
        }

        function createBumpers() {
            bumpers = [];
            const cx = W / 2, cy = H * 0.3;

            // 中央大柱（高分）
            bumpers.push({ x: cx, y: cy, r: 18, points: 50, color: '#ff4466', glow: '#ff446644', hit: 0 });
            // 三角排列
            bumpers.push({ x: cx - 65, y: cy - 45, r: 14, points: 30, color: '#ff8844', glow: '#ff884444', hit: 0 });
            bumpers.push({ x: cx + 65, y: cy - 45, r: 14, points: 30, color: '#ff8844', glow: '#ff884444', hit: 0 });
            bumpers.push({ x: cx - 50, y: cy + 55, r: 12, points: 20, color: '#ffcc00', glow: '#ffcc0044', hit: 0 });
            bumpers.push({ x: cx + 50, y: cy + 55, r: 12, points: 20, color: '#ffcc00', glow: '#ffcc0044', hit: 0 });
            // 顶部小柱
            bumpers.push({ x: cx - 30, y: cy - 85, r: 10, points: 15, color: '#44ddff', glow: '#44ddff44', hit: 0 });
            bumpers.push({ x: cx + 30, y: cy - 85, r: 10, points: 15, color: '#44ddff', glow: '#44ddff44', hit: 0 });
            // 侧边
            bumpers.push({ x: cx - 90, y: cy + 10, r: 10, points: 10, color: '#44dd66', glow: '#44dd6644', hit: 0 });
            bumpers.push({ x: cx + 90, y: cy + 10, r: 10, points: 10, color: '#44dd66', glow: '#44dd6644', hit: 0 });
        }

        function createWalls() {
            walls = [
                // 左边墙
                { x1: 20, y1: 0, x2: 20, y2: H, type: 'wall' },
                // 右边墙
                { x1: W - 20, y1: 0, x2: W - 20, y2: H, type: 'wall' },
                // 顶部弧（用多个线段近似）
                { x1: 20, y1: 30, x2: W - 20, y2: 30, type: 'ceiling' },
                // 左侧导流斜线
                { x1: 20, y1: H * 0.22, x2: 60, y2: H * 0.15, type: 'guide' },
                { x1: W - 20, y1: H * 0.22, x2: W - 60, y2: H * 0.15, type: 'guide' },
            ];
        }

        function resetBall() {
            ball = {
                x: W / 2,
                y: H * 0.85,
                r: BALL_R,
                vx: 0,
                vy: 0,
                launched: false,
                trail: [],
            };
        }

        function launchBall() {
            if (ball.launched) return;
            ball.launched = true;
            ball.x = W / 2 + (Math.random() - 0.5) * 30;
            ball.y = H * 0.85;
            ball.vx = (Math.random() - 0.5) * 2;
            ball.vy = -(6 + Math.random() * 3);
        }

        function newGame() {
            score = 0; lives = 3; combo = 1; maxCombo = 1; comboTimer = 0;
            particles = [];
            document.getElementById('score').textContent = '0';
            document.getElementById('combo').textContent = 'x1';
            document.getElementById('lives').textContent = '3';
            document.getElementById('loseOverlay').style.display = 'none';
            gameState = 'ready';
            document.getElementById('launchBtn').textContent = '🚀 发射';
            resizeCanvas();
            createWalls();
            createBumpers();
            createFlippers();
            resetBall();
            draw();
        }

        function loseBall() {
            lives--;
            document.getElementById('lives').textContent = lives;
            combo = 1; comboTimer = 0;
            document.getElementById('combo').textContent = 'x1';

            if (lives <= 0) {
                gameState = 'lost';
                document.getElementById('loseScore').textContent = score;
                document.getElementById('loseCombo').textContent = 'x' + maxCombo;
                document.getElementById('loseOverlay').style.display = 'block';
                return;
            }

            gameState = 'ready';
            document.getElementById('launchBtn').textContent = '🚀 发射';
            resetBall();
        }

        // 点到线段的距离
        function distToSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1, dy = y2 - y1;
            const lenSq = dx * dx + dy * dy;
            if (lenSq === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
        }

        // 线段法向量
        function segmentNormal(x1, y1, x2, y2) {
            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.hypot(dx, dy);
            if (len === 0) return { nx: 0, ny: -1 };
            return { nx: -dy / len, ny: dx / len };
        }

        function update() {
            if (gameState !== 'playing') return;

            // 更新挡板
            for (const f of flippers) {
                const target = f.active ? f.activeAngle : f.restAngle;
                const diff = target - f.angle;
                f.angularVel += diff * 0.35;
                f.angularVel *= 0.7;
                f.angle += f.angularVel;
                // 限制范围
                if (!f.active && Math.abs(diff) < 0.02) {
                    f.angle = f.restAngle;
                    f.angularVel = 0;
                }
            }

            // 重力
            ball.vy += GRAVITY;

            // 速度限制
            const spd = Math.hypot(ball.vx, ball.vy);
            const maxSpd = 14;
            if (spd > maxSpd) {
                ball.vx = ball.vx / spd * maxSpd;
                ball.vy = ball.vy / spd * maxSpd;
            }

            // 更新位置
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 尾迹
            ball.trail.push({ x: ball.x, y: ball.y, life: 12 });
            if (ball.trail.length > 15) ball.trail.shift();

            // 墙壁碰撞
            for (const w of walls) {
                const d = distToSegment(ball.x, ball.y, w.x1, w.y1, w.x2, w.y2);
                if (d < ball.r) {
                    const n = segmentNormal(w.x1, w.y1, w.x2, w.y2);
                    // 把球推出
                    const overlap = ball.r - d;
                    ball.x += n.nx * overlap;
                    ball.y += n.ny * overlap;
                    // 反射
                    const dot = ball.vx * n.nx + ball.vy * n.ny;
                    if (dot < 0) {
                        ball.vx -= (1 + WALL_BOUNCE) * dot * n.nx;
                        ball.vy -= (1 + WALL_BOUNCE) * dot * n.ny;
                    }
                }
            }

            // 挡板碰撞
            for (const f of flippers) {
                const tipX = f.pivotX + Math.cos(f.angle) * f.length;
                const tipY = f.pivotY - Math.sin(f.angle) * f.length;
                const d = distToSegment(ball.x, ball.y, f.pivotX, f.pivotY, tipX, tipY);

                if (d < ball.r + f.width / 2) {
                    const n = segmentNormal(f.pivotX, f.pivotY, tipX, tipY);
                    // 把球推出
                    const overlap = ball.r + f.width / 2 - d;
                    ball.x += n.nx * overlap;
                    ball.y += n.ny * overlap;

                    // 反射 + 挡板角速度
                    const dot = ball.vx * n.nx + ball.vy * n.ny;
                    if (dot < 0) {
                        ball.vx -= (1 + BOUNCE) * dot * n.nx;
                        ball.vy -= (1 + BOUNCE) * dot * n.ny;
                    }
                    // 加上挡板末端的线速度
                    const tipSpeed = Math.abs(f.angularVel) * f.length;
                    const flipDir = f.side === 'left' ? -1 : 1;
                    if (f.active && tipSpeed > 0.8) {
                        ball.vx += flipDir * Math.cos(f.angle) * tipSpeed * 0.3;
                        ball.vy -= Math.abs(Math.sin(f.angle)) * tipSpeed * 0.5;
                    }

                    // 重置连击计时器
                    comboTimer = 60;
                    spawnHitParticles(ball.x, ball.y, '#00d4ff');
                }
            }

            // 弹球柱碰撞
            for (const b of bumpers) {
                const dx = ball.x - b.x, dy = ball.y - b.y;
                const dist = Math.hypot(dx, dy);
                if (dist < ball.r + b.r) {
                    // 弹开
                    const nx = dx / dist, ny = dy / dist;
                    const overlap = ball.r + b.r - dist;
                    ball.x += nx * overlap;
                    ball.y += ny * overlap;

                    const dot = ball.vx * nx + ball.vy * ny;
                    if (dot < 0) {
                        ball.vx -= 2 * dot * nx;
                        ball.vy -= 2 * dot * ny;
                    }
                    // 额外推力
                    ball.vx += nx * BUMPER_FORCE * 0.5;
                    ball.vy += ny * BUMPER_FORCE * 0.5;

                    // 计分
                    b.hit = 8; // 闪烁帧数
                    score += b.points * combo;
                    document.getElementById('score').textContent = score;
                    comboTimer = 60;
                    if (combo < 10) combo++;
                    if (combo > maxCombo) maxCombo = combo;
                    document.getElementById('combo').textContent = 'x' + combo;

                    spawnHitParticles(b.x, b.y, b.color);
                }
            }

            // 连击衰减
            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer === 0) { combo = 1; document.getElementById('combo').textContent = 'x1'; }
            }

            // 更新粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.1;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // 尾迹衰减
            for (let i = ball.trail.length - 1; i >= 0; i--) {
                ball.trail[i].life--;
                if (ball.trail[i].life <= 0) ball.trail.splice(i, 1);
            }

            // 球掉出底部
            if (ball.y - ball.r > H + 20) {
                loseBall();
                return;
            }

            // 边墙强制限制
            if (ball.x - ball.r < 20) { ball.x = 20 + ball.r; ball.vx = Math.abs(ball.vx) * WALL_BOUNCE; }
            if (ball.x + ball.r > W - 20) { ball.x = W - 20 - ball.r; ball.vx = -Math.abs(ball.vx) * WALL_BOUNCE; }
            if (ball.y - ball.r < 30) { ball.y = 30 + ball.r; ball.vy = Math.abs(ball.vy) * WALL_BOUNCE; }
        }

        function spawnHitParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 4;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    life: 15 + Math.floor(Math.random() * 10),
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // 背景
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, W, H);

            // 装饰网格
            ctx.strokeStyle = 'rgba(255,255,255,0.015)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
            for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

            // 墙壁
            ctx.strokeStyle = '#335';
            ctx.lineWidth = 3;
            for (const w of walls) {
                ctx.beginPath();
                ctx.moveTo(w.x1, w.y1);
                ctx.lineTo(w.x2, w.y2);
                ctx.stroke();
            }
            // 墙柱装饰
            ctx.fillStyle = '#446';
            ctx.beginPath(); ctx.arc(20, 30, 6, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(W - 20, 30, 6, 0, Math.PI * 2); ctx.fill();

            // 弹球柱
            for (const b of bumpers) {
                // 光晕
                const glowAlpha = b.hit > 0 ? 0.6 : 0.15;
                ctx.fillStyle = b.glow.replace('44', Math.floor(glowAlpha * 255).toString(16).padStart(2, '0'));
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r + 8, 0, Math.PI * 2);
                ctx.fill();

                // 主体
                const lit = b.hit > 0;
                ctx.fillStyle = lit ? '#fff' : b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();

                // 高光
                if (lit) {
                    ctx.fillStyle = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r - 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 环
                ctx.strokeStyle = lit ? '#fff' : b.color;
                ctx.lineWidth = lit ? 2.5 : 1.5;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r + 2, 0, Math.PI * 2);
                ctx.stroke();

                if (b.hit > 0) b.hit--;
            }

            // 挡板
            for (const f of flippers) {
                const tipX = f.pivotX + Math.cos(f.angle) * f.length;
                const tipY = f.pivotY - Math.sin(f.angle) * f.length;

                // 阴影
                ctx.strokeStyle = '#000';
                ctx.lineWidth = f.width + 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(f.pivotX, f.pivotY);
                ctx.lineTo(tipX, tipY);
                ctx.stroke();

                // 主体
                const grad = ctx.createLinearGradient(f.pivotX, f.pivotY, tipX, tipY);
                grad.addColorStop(0, '#00d4ff');
                grad.addColorStop(1, '#0088cc');
                ctx.strokeStyle = grad;
                ctx.lineWidth = f.width;
                ctx.beginPath();
                ctx.moveTo(f.pivotX, f.pivotY);
                ctx.lineTo(tipX, tipY);
                ctx.stroke();

                // 枢轴
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(f.pivotX, f.pivotY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#00d4ff';
                ctx.beginPath();
                ctx.arc(f.pivotX, f.pivotY, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // 球尾迹
            for (let i = 0; i < ball.trail.length; i++) {
                const t = ball.trail[i];
                const alpha = t.life / 12;
                ctx.fillStyle = 'rgba(255,255,255,' + (alpha * 0.25) + ')';
                ctx.beginPath();
                ctx.arc(t.x, t.y, ball.r * (0.3 + alpha * 0.7), 0, Math.PI * 2);
                ctx.fill();
            }

            // 球
            if (ball) {
                // 光晕
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r + 5, 0, Math.PI * 2);
                ctx.fill();

                // 主体
                const ballGrad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, ball.r);
                ballGrad.addColorStop(0, '#fff');
                ballGrad.addColorStop(0.5, '#ddd');
                ballGrad.addColorStop(1, '#999');
                ctx.fillStyle = ballGrad;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                ctx.fill();
            }

            // 粒子
            for (const p of particles) {
                const alpha = p.life / 25;
                ctx.fillStyle = p.color.replace(')', ', ' + alpha + ')').replace('rgb', 'rgba');
                if (p.color.startsWith('#')) {
                    ctx.fillStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2.5 * alpha, 0, Math.PI * 2);
                ctx.fill();
            }

            // 等待发射提示
            if (gameState === 'ready' && ball && !ball.launched) {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(0, H * 0.7, W, H * 0.3);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold ' + Math.floor(W / 16) + 'px "Segoe UI"';
                ctx.textAlign = 'center';
                ctx.fillText('按空格或点击发射', W / 2, H * 0.84);
                ctx.textAlign = 'start';
            }

            // 暂停
            if (gameState === 'paused') {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold ' + Math.floor(W / 12) + 'px "Segoe UI"';
                ctx.textAlign = 'center';
                ctx.fillText('⏸ 暂停中', W / 2, H / 2);
                ctx.textAlign = 'start';
            }
        }

        function gameLoop() {
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function togglePause() {
            if (gameState === 'playing') {
                gameState = 'paused';
                document.getElementById('pauseBtn').textContent = '▶ 继续';
            } else if (gameState === 'paused') {
                gameState = 'playing';
                document.getElementById('pauseBtn').textContent = '⏯ 暂停';
            }
            draw();
        }

        // 键盘
        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                if (gameState === 'ready') { gameState = 'playing'; launchBall(); document.getElementById('launchBtn').textContent = '🔄 重来'; }
                else if (gameState === 'lost') newGame();
                else if (gameState === 'paused') togglePause();
            }
            if (e.key === 'p' || e.key === 'P') {
                if (gameState === 'playing' || gameState === 'paused') togglePause();
            }
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                leftDown = true;
                flippers[0].active = true;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                e.preventDefault();
                rightDown = true;
                flippers[1].active = true;
            }
        });

        document.addEventListener('keyup', function(e) {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                leftDown = false;
                flippers[0].active = false;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                rightDown = false;
                flippers[1].active = false;
            }
        });

        // 移动端按钮
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        btnLeft.addEventListener('pointerdown', function(e) { e.preventDefault(); flippers[0].active = true; });
        btnLeft.addEventListener('pointerup', function(e) { e.preventDefault(); flippers[0].active = false; });
        btnLeft.addEventListener('pointerleave', function(e) { flippers[0].active = false; });

        btnRight.addEventListener('pointerdown', function(e) { e.preventDefault(); flippers[1].active = true; });
        btnRight.addEventListener('pointerup', function(e) { e.preventDefault(); flippers[1].active = false; });
        btnRight.addEventListener('pointerleave', function(e) { flippers[1].active = false; });

        document.getElementById('launchBtn').addEventListener('click', function() {
            if (gameState === 'ready') { gameState = 'playing'; launchBall(); this.textContent = '🔄 重来'; }
            else if (gameState === 'lost') newGame();
        });
        document.getElementById('pauseBtn').addEventListener('click', togglePause);

        window.addEventListener('resize', function() {
            resizeCanvas();
            createWalls();
            createBumpers();
            createFlippers();
            draw();
        });

        newGame();
        gameLoop();
    </script>
<script src="/joy-game-study/nav.js"></script>
</body>
</html>
