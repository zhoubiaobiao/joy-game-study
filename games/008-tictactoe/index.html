<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>008 - 井字棋 AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; min-height: 100dvh; padding: 14px;
            user-select: none; -webkit-user-select: none;
        }
        h1 { color: #00d4ff; font-size: clamp(1.2em, 4vw, 1.6em); margin-bottom: 4px; }

        .score-bar { display: flex; gap: 20px; margin-bottom: 6px; font-size: clamp(0.8em, 2.5vw, 0.95em); color: #aaa; }
        .score-bar .s { text-align: center; }
        .score-bar .s .n { color: #ffd700; font-weight: bold; font-size: 1.3em; }
        .status { color: #00d4ff; font-size: clamp(0.9em, 3vw, 1.1em); margin-bottom: 10px; min-height: 1.4em; }

        .board {
            display: grid; grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr); gap: 6px;
            width: 100%; max-width: 320px; aspect-ratio: 1;
        }
        .cell {
            background: #16213e; border: 2px solid #333; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(2.5em, 12vw, 4em); font-weight: bold;
            cursor: pointer; transition: all 0.12s;
            -webkit-tap-highlight-color: transparent;
        }
        .cell:hover { border-color: #555; }
        .cell.x-cell { color: #00d4ff; }
        .cell.o-cell { color: #ff6b6b; }
        .cell.win-cell { animation: pulse 0.5s ease-in-out 3; }
        .cell.disabled { pointer-events: none; }

        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); border-color: #ffd700; } }

        .btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 10px 20px; border: 2px solid #444; background: transparent;
            color: #ccc; border-radius: 8px; cursor: pointer;
            font-size: clamp(0.8em, 2.5vw, 0.95em);
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }

        .info { color: #555; font-size: 0.7em; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>
    <h1>⭕ 井字棋 AI — #008</h1>

    <div class="score-bar">
        <div class="s">你<br><span class="n" id="wins">0</span></div>
        <div class="s">平局<br><span class="n" id="draws">0</span></div>
        <div class="s">AI<br><span class="n" id="losses">0</span></div>
    </div>

    <div class="status" id="status">轮到你了，点击空格落子</div>

    <div class="board" id="board"></div>

    <div class="btn-row">
        <button class="btn primary" id="newBtn">🔄 新一局</button>
        <button class="btn" id="resetBtn">🔃 重置分数</button>
    </div>

    <div class="info">💡 你是 ❌ 先手 | AI 是 ⭕ 后手 | AI 使用 Minimax 算法，无法被击败</div>

    <script>
        const board = document.getElementById('board');
        const statusEl = document.getElementById('status');
        let grid = Array(9).fill(null);
        let wins = 0, draws = 0, losses = 0;
        let gameOver = false, thinking = false, aiTimeout = null;

        // 胜利线
        const LINES = [
            [0,1,2],[3,4,5],[6,7,8], // 行
            [0,3,6],[1,4,7],[2,5,8], // 列
            [0,4,8],[2,4,6],         // 对角线
        ];

        function checkWin(g, player) {
            return LINES.some(l => l.every(i => g[i] === player));
        }

        function getWinLine(g, player) {
            return LINES.find(l => l.every(i => g[i] === player)) || null;
        }

        function getEmpty(g) { return g.map((v, i) => v === null ? i : null).filter(v => v !== null); }

        // Minimax with alpha-beta pruning
        function minimax(g, isMax, alpha, beta) {
            if (checkWin(g, 'O')) return 10;
            if (checkWin(g, 'X')) return -10;
            const empty = getEmpty(g);
            if (empty.length === 0) return 0;

            if (isMax) {
                let best = -Infinity;
                for (const i of empty) {
                    g[i] = 'O';
                    best = Math.max(best, minimax(g, false, alpha, beta));
                    g[i] = null;
                    alpha = Math.max(alpha, best);
                    if (beta <= alpha) break;
                }
                return best;
            } else {
                let best = Infinity;
                for (const i of empty) {
                    g[i] = 'X';
                    best = Math.min(best, minimax(g, true, alpha, beta));
                    g[i] = null;
                    beta = Math.min(beta, best);
                    if (beta <= alpha) break;
                }
                return best;
            }
        }

        function aiMove() {
            const empty = getEmpty(grid);
            if (empty.length === 0 || gameOver) return;

            thinking = true;
            statusEl.textContent = 'AI 思考中...';
            renderBoard();

                aiTimeout = setTimeout(() => {
                let bestScore = -Infinity, bestIdx = empty[0];
                for (const i of empty) {
                    grid[i] = 'O';
                    const score = minimax(grid, false, -Infinity, Infinity);
                    grid[i] = null;
                    if (score > bestScore) { bestScore = score; bestIdx = i; }
                }

                grid[bestIdx] = 'O';
                thinking = false;

                if (checkWin(grid, 'O')) {
                    gameOver = true; losses++;
                    document.getElementById('losses').textContent = losses;
                    statusEl.textContent = '😞 AI 赢了！';
                    highlightWin('O');
                } else if (getEmpty(grid).length === 0) {
                    gameOver = true; draws++;
                    document.getElementById('draws').textContent = draws;
                    statusEl.textContent = '🤝 平局！';
                } else {
                    statusEl.textContent = '轮到你了，点击空格落子';
                }

                document.getElementById('wins').textContent = wins;
                renderBoard();
            }, 200);
        }

        function playerMove(idx) {
            if (gameOver || thinking || grid[idx] !== null) return;
            grid[idx] = 'X';
            renderBoard();

            if (checkWin(grid, 'X')) {
                gameOver = true; wins++;
                document.getElementById('wins').textContent = wins;
                statusEl.textContent = '🎉 你赢了！（不可能吧？）';
                highlightWin('X');
                return;
            }
            if (getEmpty(grid).length === 0) {
                gameOver = true; draws++;
                document.getElementById('draws').textContent = draws;
                statusEl.textContent = '🤝 平局！';
                return;
            }

            aiMove();
        }

        function highlightWin(player) {
            const line = getWinLine(grid, player);
            if (!line) return;
            const cells = board.querySelectorAll('.cell');
            line.forEach(i => cells[i].classList.add('win-cell'));
        }

        function renderBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (grid[i] === 'X') { cell.textContent = '❌'; cell.classList.add('x-cell'); }
                else if (grid[i] === 'O') { cell.textContent = '⭕'; cell.classList.add('o-cell'); }
                if (gameOver || thinking || grid[i] !== null) cell.classList.add('disabled');

                cell.addEventListener('click', () => playerMove(i));
                board.appendChild(cell);
            }
        }

        function newRound() {
            if (aiTimeout) { clearTimeout(aiTimeout); aiTimeout = null; }
            grid = Array(9).fill(null);
            gameOver = false; thinking = false;
            statusEl.textContent = '轮到你了，点击空格落子';
            renderBoard();
        }

        function resetScore() {
            wins = 0; draws = 0; losses = 0;
            document.getElementById('wins').textContent = '0';
            document.getElementById('draws').textContent = '0';
            document.getElementById('losses').textContent = '0';
            newRound();
        }

        document.getElementById('newBtn').addEventListener('click', newRound);
        document.getElementById('resetBtn').addEventListener('click', resetScore);

        renderBoard();
    </script>
<script src="/joy-game-study/nav.js"></script>
</body>
</html>
