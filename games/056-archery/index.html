<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>056 - 射箭大师</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 10px; user-select: none; -webkit-user-select: none; }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }
        .top-bar { display: flex; gap: 16px; margin-bottom: 4px; font-size: clamp(0.8em, 2.5vw, 0.9em); color: #aaa; flex-wrap: wrap; justify-content: center; }
        .top-bar span { color: #ffd700; font-weight: bold; }
        .canvas-wrap { width: 100%; max-width: 400px; }
        canvas { width: 100%; display: block; border: 2px solid #333; border-radius: 6px; touch-action: manipulation; background: #2d5a1e; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 8px 18px; border: 2px solid #444; background: transparent; color: #ccc; border-radius: 8px; cursor: pointer; font-size: clamp(0.75em, 2.5vw, 0.9em); -webkit-tap-highlight-color: transparent; }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }
        .overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px; text-align: center; display: none; z-index: 10; }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; color: #ffd700; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button { padding: 10px 28px; font-size: 1em; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🏹 射箭大师 — #056</h1>
    <div class="top-bar">
        <span>⭐ <span id="score">0</span></span>
        <span>🎯 箭 <span id="arrows">10</span></span>
        <span>🏆 <span id="best">0</span></span>
    </div>
    <div class="canvas-wrap"><canvas id="game"></canvas></div>
    <div class="btn-row"><button class="btn primary" id="newBtn">🔄 新游戏</button></div>
    <div class="info" style="color:#555;font-size:0.7em;margin-top:4px;">💡 拖拽弓弦瞄准，松开发射 | 靶心旋转中 | 命中中心=10分 | 10支箭挑战最高分</div>
    <div class="overlay" id="endOverlay">
        <h2>🏹 箭已射完！</h2>
        <p>总分：<strong id="endScore">0</strong> | 10环次数：<strong id="endBull">0</strong></p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W, H, bow, arrows, target, score, bestScore, gameOver, animId;
        let dragging, dragStart, particles, arrowsLeft, bullCount, checkTimer;

        function resize() {
            const maxW = Math.min(canvas.parentElement.clientWidth, 400);
            W = maxW; H = Math.floor(W * 1.3);
            canvas.width = W; canvas.height = H;
        }

        function newGame() {
            cancelAnimationFrame(animId);
            if (checkTimer) { clearTimeout(checkTimer); checkTimer = null; }
            resize();
            score = 0; gameOver = false; arrowsLeft = 10; bullCount = 0;
            dragging = false; particles = [];
            bestScore = parseInt(localStorage.getItem('archery-best') || '0');
            document.getElementById('score').textContent = '0';
            document.getElementById('arrows').textContent = '10';
            document.getElementById('best').textContent = bestScore;
            document.getElementById('endOverlay').style.display = 'none';
            bow = { x: W/2, y: H - 65 };
            arrows = [];
            target = { x: W/2, y: H * 0.28, r: 65, angle: 0, rotSpeed: 0.008 + Math.random() * 0.012, dir: Math.random() > 0.5 ? 1 : -1 };
            target.rotSpeed *= target.dir;
            loop();
        }

        function update() {
            if (gameOver) return;
            // Rotate target
            target.angle += target.rotSpeed;
            // Move arrows
            for (const a of arrows) {
                if (a.stuck) continue;
                a.x += a.vx; a.y += a.vy;
                a.vy += 0.15; // slight gravity
                a.rot = Math.atan2(a.vy, a.vx);
                // Trail
                particles.push({ x: a.x, y: a.y, vx: 0, vy: 0, life: 4, color: '#8B4513' });
                // Hit target
                if (!a.stuck && Math.hypot(a.x - target.x, a.y - target.y) < target.r + 5) {
                    a.stuck = true;
                    const distFromCenter = Math.hypot(a.x - target.x, a.y - target.y);
                    const ringScore = Math.max(1, 10 - Math.floor(distFromCenter / (target.r / 5)));
                    score += ringScore;
                    if (ringScore === 10) bullCount++;
                    document.getElementById('score').textContent = score;
                    if (score > bestScore) { bestScore = score; localStorage.setItem('archery-best', bestScore); document.getElementById('best').textContent = bestScore; }
                    // Particles
                    for (let i = 0; i < 6; i++) {
                        particles.push({ x: a.x, y: a.y, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 15, color: ringScore >= 8 ? '#ffd700' : '#fff' });
                    }
                    // Show score popup
                    a.popup = ringScore;
                    a.popupLife = 30;
                }
            }
            // Remove off-screen arrows
            arrows = arrows.filter(a => a.stuck || (a.y > -50 && a.y < H + 50 && a.x > -50 && a.x < W + 50));
            // Particles
            for (const p of particles) { p.life--; }
            particles = particles.filter(p => p.life > 0);
            // Popup decay
            for (const a of arrows) { if (a.popupLife > 0) a.popupLife--; }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Sky + grass background
            const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
            skyGrad.addColorStop(0, '#87CEEB'); skyGrad.addColorStop(0.55, '#90d0f0'); skyGrad.addColorStop(0.55, '#4a8c2a'); skyGrad.addColorStop(1, '#2d5a1e');
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, H);

            // Target stand
            ctx.fillStyle = '#8B4513'; ctx.fillRect(target.x - 3, target.y + target.r, 6, H * 0.55 - target.y - target.r);
            ctx.fillStyle = '#A0522D'; ctx.fillRect(target.x - 2, target.y + target.r, 6, H * 0.55 - target.y - target.r);
            // Target legs
            ctx.fillStyle = '#6B3410'; ctx.fillRect(target.x - 8, target.y + target.r + 3, 16, 4);

            // Target
            ctx.save(); ctx.translate(target.x, target.y);
            ctx.rotate(target.angle);
            // Rings
            const rings = [
                { r: target.r, color: '#fff' },
                { r: target.r * 0.8, color: '#000' },
                { r: target.r * 0.64, color: '#4488ff' },
                { r: target.r * 0.48, color: '#ff4444' },
                { r: target.r * 0.32, color: '#ffd700' },
                { r: target.r * 0.16, color: '#ff4444' },
            ];
            for (const ring of rings) {
                ctx.fillStyle = ring.color; ctx.beginPath(); ctx.arc(0, 0, ring.r, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(0, 0, ring.r, 0, Math.PI*2); ctx.stroke();
            }
            // Cross lines on target
            ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(-target.r, 0); ctx.lineTo(target.r, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -target.r); ctx.lineTo(0, target.r); ctx.stroke();
            ctx.restore();

            // Particles
            for (const p of particles) {
                ctx.fillStyle = `rgba(${p.color === '#ffd700' ? '255,215,0' : '200,200,200'},${p.life/(p.color==='#ffd700'?15:4)})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
            }

            // Stuck arrows
            for (const a of arrows) {
                if (!a.stuck) continue;
                ctx.save(); ctx.translate(a.x, a.y);
                ctx.rotate(a.rot || 0);
                // Shaft
                ctx.fillStyle = '#8B4513'; ctx.fillRect(-1, -18, 2, 36);
                // Feather
                ctx.fillStyle = '#ff4444'; ctx.fillRect(-4, -18, 8, 6);
                ctx.fillStyle = '#ffd700'; ctx.fillRect(-3, -19, 6, 4);
                // Tip
                ctx.fillStyle = '#666'; ctx.beginPath(); ctx.moveTo(-3, 16); ctx.lineTo(3, 16); ctx.lineTo(0, 22); ctx.closePath(); ctx.fill();
                ctx.restore();
                // Score popup
                if (a.popupLife > 0) {
                    const alpha = a.popupLife / 30;
                    ctx.fillStyle = `rgba(255,215,0,${alpha})`; ctx.font = 'bold 16px "Segoe UI"'; ctx.textAlign = 'center';
                    ctx.fillText(a.popup + '分!', a.x, a.y - 25 - (30 - a.popupLife) * 1.2);
                    ctx.textAlign = 'start';
                }
            }

            // Bow
            if (arrowsLeft > 0) {
                const bx = bow.x, by = bow.y;
                // Bow arc
                ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 6; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.arc(bx, by, 45, -Math.PI * 0.7, Math.PI * 0.7); ctx.stroke();
                // Bowstring
                if (dragging && dragStart) {
                    const dx = dragStart.x - bx, dy = dragStart.y - by;
                    const dist = Math.min(30, Math.hypot(dx, dy));
                    const angle = Math.atan2(dy, dx);
                    const pullX = bx + Math.cos(angle) * dist;
                    const pullY = by + Math.sin(angle) * dist;
                    // String pulled
                    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(bx + Math.cos(-Math.PI * 0.7) * 45, by + Math.sin(-Math.PI * 0.7) * 45);
                    ctx.lineTo(pullX, pullY);
                    ctx.lineTo(bx + Math.cos(Math.PI * 0.7) * 45, by + Math.sin(Math.PI * 0.7) * 45);
                    ctx.stroke();
                    // Arrow preview (pointing OPPOSITE to drag - toward target)
                    const shootAngle = Math.atan2(-dy, -dx);
                    ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(pullX, pullY);
                    ctx.lineTo(pullX + Math.cos(shootAngle) * 40, pullY + Math.sin(shootAngle) * 40);
                    ctx.stroke();
                    // Arrow tip
                    ctx.fillStyle = '#666'; ctx.beginPath(); ctx.arc(pullX + Math.cos(shootAngle) * 40, pullY + Math.sin(shootAngle) * 40, 4, 0, Math.PI*2); ctx.fill();
                    // Power indicator
                    const power = Math.min(1, dist / 30);
                    ctx.fillStyle = '#333'; ctx.fillRect(bx - 30, by - 55, 60, 8);
                    const powerColor = power < 0.5 ? '#44ff44' : power < 0.8 ? '#ffd700' : '#ff4444';
                    ctx.fillStyle = powerColor; ctx.fillRect(bx - 30, by - 55, 60 * power, 8);
                } else {
                    // String at rest
                    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(bx + Math.cos(-Math.PI * 0.7) * 45, by + Math.sin(-Math.PI * 0.7) * 45);
                    ctx.lineTo(bx, by);
                    ctx.lineTo(bx + Math.cos(Math.PI * 0.7) * 45, by + Math.sin(Math.PI * 0.7) * 45);
                    ctx.stroke();
                }
            }

            // UI
            ctx.fillStyle = '#333'; ctx.font = 'bold 14px "Segoe UI"'; ctx.textAlign = 'center';
            ctx.fillText('🏹 剩余: ' + arrowsLeft + ' 支', W/2, H - 15);
            ctx.textAlign = 'start';
        }

        function endGame() {
            gameOver = true;
            document.getElementById('endScore').textContent = score;
            document.getElementById('endBull').textContent = bullCount;
            document.getElementById('endOverlay').style.display = 'block';
            if (score > bestScore) { bestScore = score; localStorage.setItem('archery-best', bestScore); }
        }

        function shootArrow(fromX, fromY, toX, toY) {
            if (arrowsLeft <= 0) return;
            const dx = toX - fromX, dy = toY - fromY;
            const dist = Math.min(30, Math.hypot(dx, dy));
            // Arrow shoots OPPOSITE to drag direction (like pulling a bowstring)
            const shootAngle = Math.atan2(-dy, -dx);
            const power = dist / 30;
            const speed = 8 + power * 7;
            arrows.push({
                x: fromX, y: fromY,
                vx: Math.cos(shootAngle) * speed,
                vy: Math.sin(shootAngle) * speed,
                rot: shootAngle, stuck: false
            });
            arrowsLeft--;
            document.getElementById('arrows').textContent = arrowsLeft;
            if (arrowsLeft <= 0) {
                // Check after last arrow lands, retry if still in flight
                function checkDone() {
                    if (gameOver) return;
                    if (arrows.every(a => a.stuck || a.y > H || a.x < -50 || a.x > W + 50)) {
                        endGame();
                    } else {
                        checkTimer = setTimeout(checkDone, 500);
                    }
                }
                checkTimer = setTimeout(checkDone, 1500);
            }
        }

        function loop() { update(); draw(); if (!gameOver) animId = requestAnimationFrame(loop); }

        canvas.addEventListener('mousedown', e => {
            if (gameOver || arrowsLeft <= 0) return;
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (W / rect.width);
            const my = (e.clientY - rect.top) * (H / rect.height);
            if (Math.abs(mx - bow.x) < 60 && Math.abs(my - bow.y) < 60) {
                dragging = true;
                dragStart = { x: mx, y: my };
            }
        });
        canvas.addEventListener('mousemove', e => {
            if (!dragging) return;
            const rect = canvas.getBoundingClientRect();
            dragStart.x = (e.clientX - rect.left) * (W / rect.width);
            dragStart.y = (e.clientY - rect.top) * (H / rect.height);
        });
        canvas.addEventListener('mouseup', e => {
            if (!dragging || !dragStart) return;
            shootArrow(bow.x, bow.y, dragStart.x, dragStart.y);
            dragging = false; dragStart = null;
        });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (gameOver || arrowsLeft <= 0) return;
            const rect = canvas.getBoundingClientRect();
            const mx = (e.touches[0].clientX - rect.left) * (W / rect.width);
            const my = (e.touches[0].clientY - rect.top) * (H / rect.height);
            if (Math.abs(mx - bow.x) < 60 && Math.abs(my - bow.y) < 60) {
                dragging = true;
                dragStart = { x: mx, y: my };
            }
        });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!dragging) return;
            const rect = canvas.getBoundingClientRect();
            dragStart.x = (e.touches[0].clientX - rect.left) * (W / rect.width);
            dragStart.y = (e.touches[0].clientY - rect.top) * (H / rect.height);
        });
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            if (!dragging || !dragStart) return;
            shootArrow(bow.x, bow.y, dragStart.x, dragStart.y);
            dragging = false; dragStart = null;
        });

        document.getElementById('newBtn').addEventListener('click', newGame);
        window.addEventListener('resize', () => { resize(); });
        newGame();
    </script>
    <script src="/joy-game-study/nav.js"></script>
</body>
</html>
