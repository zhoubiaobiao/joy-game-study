<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>034 - 台球</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; min-height: 100dvh; padding: 10px;
            user-select: none; -webkit-user-select: none;
        }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }
        .top-bar { display: flex; gap: 16px; margin-bottom: 4px; font-size: clamp(0.8em, 2.5vw, 0.9em); color: #aaa; flex-wrap: wrap; justify-content: center; }
        .top-bar span { color: #ffd700; font-weight: bold; }
        .canvas-wrap { width: 100%; max-width: 480px; }
        canvas { width: 100%; display: block; border: 2px solid #333; border-radius: 6px; touch-action: manipulation; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 8px 18px; border: 2px solid #444; background: transparent;
            color: #ccc; border-radius: 8px; cursor: pointer;
            font-size: clamp(0.75em, 2.5vw, 0.9em);
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }
        .info { color: #555; font-size: 0.7em; margin-top: 4px; text-align: center; }
        .overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px;
            text-align: center; display: none; z-index: 10;
        }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; color: #ffd700; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button {
            padding: 10px 28px; font-size: 1em;
            background: #00d4ff; color: #1a1a2e; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🎱 台球 — #034</h1>
    <div class="top-bar">
        <span>得分：<span id="score">0</span></span>
        <span>进球：<span id="pocketed">0</span></span>
        <span>最佳：<span id="best">0</span></span>
    </div>
    <div class="canvas-wrap"><canvas id="game"></canvas></div>
    <div class="btn-row">
        <button class="btn primary" id="newBtn">🔄 新游戏</button>
    </div>
    <div class="info">💡 从白球拖拽瞄准并设定力度 | 松开击球 | 把所有彩球打进6个洞</div>
    <div class="overlay" id="winOverlay">
        <h2>🎱 全部清空！</h2>
        <p>得分：<strong id="winScore">0</strong></p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W, H, BALL_R;
        let balls, pockets, score, pocketed, bestScore, gameOver;
        let aiming, aimStart, aimEnd, ballsMoving, cueBallIdx;

        const BALL_COLORS = ['#fff','#ffdd00','#2244ff','#ff2200','#8800cc','#ff8800','#00aa44','#aa0000','#ffdd00','#2244ff','#ff2200','#8800cc','#ff8800','#00aa44','#aa0000','#333'];

        function resize() {
            const maxW = Math.min(canvas.parentElement.clientWidth, 480);
            W = maxW; H = Math.floor(W * 0.65);
            canvas.width = W; canvas.height = H;
            BALL_R = Math.floor(W / 35);
        }

        function newGame() {
            resize();
            score = 0; pocketed = 0; gameOver = false; ballsMoving = false;
            aiming = false; aimStart = null; aimEnd = null;
            bestScore = parseInt(localStorage.getItem('pool-best') || '0');
            document.getElementById('score').textContent = '0';
            document.getElementById('pocketed').textContent = '0';
            document.getElementById('best').textContent = bestScore;
            document.getElementById('winOverlay').style.display = 'none';

            // 6 pockets (corners + sides)
            const m = 8;
            pockets = [
                { x: m, y: m, r: BALL_R * 2.2 },
                { x: W / 2, y: m - 2, r: BALL_R * 2 },
                { x: W - m, y: m, r: BALL_R * 2.2 },
                { x: m, y: H - m, r: BALL_R * 2.2 },
                { x: W / 2, y: H - m + 2, r: BALL_R * 2 },
                { x: W - m, y: H - m, r: BALL_R * 2.2 },
            ];

            // Place balls in triangle
            balls = [];
            // Cue ball
            balls.push({ x: W * 0.25, y: H / 2, vx: 0, vy: 0, color: '#fff', active: true });
            cueBallIdx = 0;

            // Rack (triangle)
            const rackX = W * 0.65, rackY = H / 2;
            const gap = BALL_R * 2 + 1;
            let idx = 1;
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col <= row; col++) {
                    if (idx >= BALL_COLORS.length) break;
                    balls.push({
                        x: rackX + row * gap * 0.87,
                        y: rackY + (col - row / 2) * gap,
                        vx: 0, vy: 0, color: BALL_COLORS[idx], active: true
                    });
                    idx++;
                }
            }
            loop();
        }

        function update() {
            if (gameOver) return;
            let anyMoving = false;
            for (let b of balls) {
                if (!b.active) continue;
                if (Math.abs(b.vx) < 0.05 && Math.abs(b.vy) < 0.05) {
                    b.vx = 0; b.vy = 0; continue;
                }
                anyMoving = true;
                b.vx *= 0.985; b.vy *= 0.985;
                b.x += b.vx; b.y += b.vy;

                // Rail bounce
                if (b.x - BALL_R < 0) { b.x = BALL_R; b.vx = -b.vx * 0.8; }
                if (b.x + BALL_R > W) { b.x = W - BALL_R; b.vx = -b.vx * 0.8; }
                if (b.y - BALL_R < 0) { b.y = BALL_R; b.vy = -b.vy * 0.8; }
                if (b.y + BALL_R > H) { b.y = H - BALL_R; b.vy = -b.vy * 0.8; }

                // Pocket check
                for (let p of pockets) {
                    const dx = b.x - p.x, dy = b.y - p.y;
                    if (Math.sqrt(dx*dx+dy*dy) < p.r) {
                        if (b === balls[cueBallIdx]) {
                            // Cue ball pocketed = penalty, respawn
                            score = Math.max(0, score - 20);
                            b.x = W * 0.25; b.y = H / 2; b.vx = 0; b.vy = 0;
                        } else {
                            b.active = false;
                            pocketed++;
                            score += 10;
                            document.getElementById('pocketed').textContent = pocketed;
                        }
                        document.getElementById('score').textContent = score;
                        if (score > bestScore) { bestScore = score; localStorage.setItem('pool-best', bestScore); document.getElementById('best').textContent = bestScore; }
                        break;
                    }
                }
            }

            // Ball-ball collision
            for (let i = 0; i < balls.length; i++) {
                if (!balls[i].active) continue;
                for (let j = i + 1; j < balls.length; j++) {
                    if (!balls[j].active) continue;
                    const dx = balls[j].x - balls[i].x;
                    const dy = balls[j].y - balls[i].y;
                    const dist = Math.sqrt(dx*dx+dy*dy);
                    if (dist < BALL_R * 2 && dist > 0) {
                        const nx = dx / dist, ny = dy / dist;
                        const overlap = BALL_R * 2 - dist;
                        balls[i].x -= nx * overlap / 2; balls[j].x += nx * overlap / 2;
                        balls[i].y -= ny * overlap / 2; balls[j].y += ny * overlap / 2;
                        const dvx = balls[i].vx - balls[j].vx;
                        const dvy = balls[i].vy - balls[j].vy;
                        const dvn = dvx * nx + dvy * ny;
                        if (dvn > 0) { balls[i].vx -= dvn * nx; balls[i].vy -= dvn * ny; balls[j].vx += dvn * nx; balls[j].vy += dvn * ny; }
                    }
                }
            }

            ballsMoving = anyMoving;

            // Check win
            const activeColored = balls.filter((b, i) => b.active && i !== cueBallIdx);
            if (activeColored.length === 0 && !ballsMoving) {
                document.getElementById('winScore').textContent = score;
                document.getElementById('winOverlay').style.display = 'block';
                gameOver = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Table felt
            ctx.fillStyle = '#0d5e2e'; ctx.fillRect(0, 0, W, H);
            // Rail
            ctx.strokeStyle = '#5c3a1e'; ctx.lineWidth = 12;
            ctx.strokeRect(6, 6, W - 12, H - 12);
            ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 6;
            ctx.strokeRect(6, 6, W - 12, H - 12);

            // Pockets
            ctx.fillStyle = '#111';
            for (let p of pockets) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); }

            // Aim line
            if (aiming && aimStart && aimEnd && !ballsMoving) {
                const cue = balls[cueBallIdx];
                const dx = aimStart.x - aimEnd.x;
                const dy = aimStart.y - aimEnd.y;
                const power = Math.min(15, Math.sqrt(dx*dx+dy*dy) / 8);
                // Guide line
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(cue.x, cue.y);
                ctx.lineTo(cue.x + dx * 2, cue.y + dy * 2);
                ctx.stroke(); ctx.setLineDash([]);
                // Power indicator
                ctx.fillStyle = '#ffd700'; ctx.font = 'bold 12px "Segoe UI"'; ctx.textAlign = 'center';
                ctx.fillText('力度: ' + Math.round(power / 15 * 100) + '%', cue.x, cue.y - 18);
                ctx.textAlign = 'start';
            }

            // Balls
            for (let b of balls) {
                if (!b.active) continue;
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath(); ctx.arc(b.x + 1, b.y + 1, BALL_R, 0, Math.PI*2); ctx.fill();
                // Ball
                ctx.fillStyle = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, Math.PI*2); ctx.fill();
                // Number
                if (b !== balls[cueBallIdx]) {
                    ctx.fillStyle = '#fff'; ctx.font = `bold ${BALL_R}px "Segoe UI"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    const idx = balls.indexOf(b);
                    if (idx <= 9) ctx.fillText(idx, b.x, b.y + 1);
                    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
                }
            }
        }

        function loop() { update(); draw(); if (!gameOver) requestAnimationFrame(loop); }

        canvas.addEventListener('mousedown', e => {
            if (ballsMoving || gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const cx = (e.clientX - rect.left) * (W / rect.width);
            const cy = (e.clientY - rect.top) * (H / rect.height);
            const cue = balls[cueBallIdx];
            const dist = Math.sqrt((cx-cue.x)**2 + (cy-cue.y)**2);
            if (dist < BALL_R * 3) { aiming = true; aimStart = { x: cx, y: cy }; aimEnd = { x: cx, y: cy }; }
        });
        canvas.addEventListener('mousemove', e => {
            if (!aiming) return;
            const rect = canvas.getBoundingClientRect();
            aimEnd = { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
        });
        canvas.addEventListener('mouseup', () => {
            if (!aiming) return;
            const cue = balls[cueBallIdx];
            const dx = aimStart.x - aimEnd.x, dy = aimStart.y - aimEnd.y;
            const power = Math.min(15, Math.sqrt(dx*dx+dy*dy) / 8);
            cue.vx = (dx / Math.sqrt(dx*dx+dy*dy)) * power;
            cue.vy = (dy / Math.sqrt(dx*dx+dy*dy)) * power;
            aiming = false; aimStart = null; aimEnd = null;
        });

        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            if (ballsMoving || gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const cx = (e.touches[0].clientX - rect.left) * (W / rect.width);
            const cy = (e.touches[0].clientY - rect.top) * (H / rect.height);
            const cue = balls[cueBallIdx];
            if (Math.sqrt((cx-cue.x)**2 + (cy-cue.y)**2) < BALL_R * 4) { aiming = true; aimStart = { x: cx, y: cy }; aimEnd = { x: cx, y: cy }; }
        });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!aiming) return;
            const rect = canvas.getBoundingClientRect();
            aimEnd = { x: (e.touches[0].clientX - rect.left) * (W / rect.width), y: (e.touches[0].clientY - rect.top) * (H / rect.height) };
        });
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            if (!aiming) return;
            const cue = balls[cueBallIdx];
            const dx = aimStart.x - aimEnd.x, dy = aimStart.y - aimEnd.y;
            const dist = Math.sqrt(dx*dx+dy*dy);
            if (dist < 5) { aiming = false; return; }
            const power = Math.min(15, dist / 8);
            cue.vx = (dx / dist) * power;
            cue.vy = (dy / dist) * power;
            aiming = false; aimStart = null; aimEnd = null;
        });

        document.getElementById('newBtn').addEventListener('click', newGame);
        window.addEventListener('resize', () => { resize(); });
        newGame();
    </script>
    <script src="/joy-game-study/nav.js"></script>
</body>
</html>
