<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>044 - 坦克大战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; min-height: 100dvh; padding: 10px; user-select: none; -webkit-user-select: none; }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }
        .top-bar { display: flex; gap: 16px; margin-bottom: 4px; font-size: clamp(0.8em, 2.5vw, 0.9em); color: #aaa; flex-wrap: wrap; justify-content: center; }
        .top-bar span { color: #ffd700; font-weight: bold; }
        .canvas-wrap { width: 100%; max-width: 420px; }
        canvas { width: 100%; display: block; border: 2px solid #333; border-radius: 6px; touch-action: manipulation; background: #2d4a1e; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 8px 18px; border: 2px solid #444; background: transparent; color: #ccc; border-radius: 8px; cursor: pointer; font-size: clamp(0.75em, 2.5vw, 0.9em); -webkit-tap-highlight-color: transparent; }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; }
        .overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px; text-align: center; display: none; z-index: 10; }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; color: #ffd700; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button { padding: 10px 28px; font-size: 1em; background: #00d4ff; color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔫 坦克大战 — #044</h1>
    <div class="top-bar">
        <span>🔵 P1: <span id="score1">0</span></span>
        <span>🔴 P2: <span id="score2">0</span></span>
    </div>
    <div class="canvas-wrap"><canvas id="game"></canvas></div>
    <div class="btn-row"><button class="btn primary" id="newBtn">🔄 新游戏</button></div>
    <div class="info" style="color:#555;font-size:0.7em;margin-top:4px;">💡 P1: WASD移动/Q射击 | P2: 方向键移动/M射击 | 子弹遇墙反弹 | 先5杀获胜</div>
    <div class="overlay" id="endOverlay">
        <h2 id="endTitle">🏆 获胜！</h2>
        <p>P1 <span id="endScore1">0</span> : <span id="endScore2">0</span> P2</p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W, H, p1, p2, bullets, walls, powerUps, particles;
        let score1, score2, gameOver, animId, powerUpTimer;

        function resize() {
            const maxW = Math.min(canvas.parentElement.clientWidth, 420);
            W = maxW; H = Math.floor(W * 0.8);
            canvas.width = W; canvas.height = H;
        }

        function newGame() {
            cancelAnimationFrame(animId);
            resize();
            score1 = 0; score2 = 0; gameOver = false;
            document.getElementById('score1').textContent = '0';
            document.getElementById('score2').textContent = '0';
            document.getElementById('endOverlay').style.display = 'none';
            p1 = { x: W * 0.2, y: H * 0.5, angle: 0, r: 14, color: '#44aaff', reload: 0 };
            p2 = { x: W * 0.8, y: H * 0.5, angle: Math.PI, r: 14, color: '#ff4444', reload: 0 };
            bullets = []; particles = []; powerUps = []; powerUpTimer = 0;
            setupWalls();
            loop();
        }

        function setupWalls() {
            walls = [
                { x: W * 0.3, y: H * 0.35, w: W * 0.02, h: 40 },
                { x: W * 0.7, y: H * 0.35, w: W * 0.02, h: 40 },
                { x: W * 0.3, y: H * 0.6, w: W * 0.02, h: 40 },
                { x: W * 0.7, y: H * 0.6, w: W * 0.02, h: 40 },
                { x: W * 0.48, y: H * 0.2, w: W * 0.04, h: H * 0.15 },
                { x: W * 0.48, y: H * 0.65, w: W * 0.04, h: H * 0.15 },
            ];
        }

        function moveTank(tank, dx, dy) {
            const nx = tank.x + dx; const ny = tank.y + dy;
            if (nx - tank.r < 0 || nx + tank.r > W || ny - tank.r < 0 || ny + tank.r > H) return;
            for (const w of walls) {
                if (nx + tank.r > w.x && nx - tank.r < w.x + w.w && ny + tank.r > w.y && ny - tank.r < w.y + w.h) return;
            }
            const other = tank === p1 ? p2 : p1;
            if (Math.hypot(nx - other.x, ny - other.y) < tank.r + other.r) return;
            tank.x = nx; tank.y = ny;
        }

        function shoot(tank) {
            if (tank.reload > 0) return;
            tank.reload = 25;
            bullets.push({ x: tank.x, y: tank.y, vx: Math.cos(tank.angle) * 6, vy: Math.sin(tank.angle) * 6, owner: tank, bounces: 3 });
            // Recoil particles
            for (let i = 0; i < 3; i++) {
                particles.push({ x: tank.x, y: tank.y, vx: -Math.cos(tank.angle) * (1 + Math.random()), vy: -Math.sin(tank.angle) * (1 + Math.random()), life: 8, color: tank.color });
            }
        }

        function spawnPowerUp() {
            const types = ['speed', 'rapid', 'multi'];
            const type = types[Math.floor(Math.random() * 3)];
            let px, py, tries = 0;
            do {
                px = W * 0.1 + Math.random() * W * 0.8;
                py = H * 0.1 + Math.random() * H * 0.8;
                tries++;
            } while (walls.some(w => px > w.x - 10 && px < w.x + w.w + 10 && py > w.y - 10 && py < w.y + w.h + 10) && tries < 20);
            powerUps.push({ x: px, y: py, type, r: 8, life: 400 });
        }

        function update() {
            if (gameOver) return;
            // Reload
            if (p1.reload > 0) p1.reload--; if (p2.reload > 0) p2.reload--;

            // Power-ups
            powerUpTimer++;
            if (powerUpTimer > 300 + Math.random() * 200) { spawnPowerUp(); powerUpTimer = 0; }
            for (const p of powerUps) p.life--;
            powerUps = powerUps.filter(p => p.life > 0);

            // Tank-powerup collision
            for (const tank of [p1, p2]) {
                for (let pi = powerUps.length - 1; pi >= 0; pi--) {
                    const p = powerUps[pi];
                    if (Math.hypot(tank.x - p.x, tank.y - p.y) < tank.r + p.r + 4) {
                        if (p.type === 'speed') tank.speedBoost = 200;
                        else if (p.type === 'rapid') tank.rapidBoost = 200;
                        else if (p.type === 'multi') {
                            for (let i = -1; i <= 1; i++) {
                                bullets.push({ x: tank.x, y: tank.y, vx: Math.cos(tank.angle + i * 0.2) * 6, vy: Math.sin(tank.angle + i * 0.2) * 6, owner: tank, bounces: 2 });
                            }
                        }
                        powerUps.splice(pi, 1);
                    }
                }
            }
            // Decay boosts
            if (p1.speedBoost > 0) p1.speedBoost--; if (p1.rapidBoost > 0) p1.rapidBoost--;
            if (p2.speedBoost > 0) p2.speedBoost--; if (p2.rapidBoost > 0) p2.rapidBoost--;

            // Bullets
            for (const b of bullets) {
                b.x += b.vx; b.y += b.vy;
                // Wall bounce
                let bounced = false;
                for (const w of walls) {
                    if (b.x > w.x && b.x < w.x + w.w && b.y > w.y && b.y < w.y + w.h && b.bounces > 0) {
                        // Determine bounce direction
                        const cx = w.x + w.w / 2, cy = w.y + w.h / 2;
                        if (Math.abs(b.x - cx) / (w.w / 2) > Math.abs(b.y - cy) / (w.h / 2)) b.vx *= -1;
                        else b.vy *= -1;
                        b.bounces--;
                        bounced = true;
                        break;
                    }
                }
                // Edge bounce
                if (!bounced && b.bounces > 0) {
                    if (b.x < 0 || b.x > W) { b.vx *= -1; b.bounces--; }
                    if (b.y < 0 || b.y > H) { b.vy *= -1; b.bounces--; }
                }
            }
            bullets = bullets.filter(b => b.x > -30 && b.x < W + 30 && b.y > -30 && b.y < H + 30 && b.bounces >= 0);

            // Bullet-tank collision
            for (let bi = bullets.length - 1; bi >= 0; bi--) {
                const b = bullets[bi];
                const target = b.owner === p1 ? p2 : p1;
                if (Math.hypot(b.x - target.x, b.y - target.y) < target.r + 2) {
                    if (b.owner === p1) { score1++; document.getElementById('score1').textContent = score1; }
                    else { score2++; document.getElementById('score2').textContent = score2; }
                    for (let i = 0; i < 12; i++) {
                        particles.push({ x: target.x, y: target.y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 15 + Math.random() * 10, color: target.color });
                    }
                    // Reset target
                    target.x = target === p1 ? W * 0.2 : W * 0.8;
                    target.y = H * 0.3 + Math.random() * H * 0.4;
                    target.angle = target === p1 ? 0 : Math.PI;
                    bullets.splice(bi, 1);
                    if (score1 >= 5 || score2 >= 5) { endGame(); return; }
                }
            }

            // Particles
            for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
            particles = particles.filter(p => p.life > 0);
        }

        function drawTank(tank) {
            ctx.save();
            ctx.translate(tank.x, tank.y);
            ctx.rotate(tank.angle);
            ctx.fillStyle = tank.color; ctx.fillRect(-tank.r, -tank.r * 0.6, tank.r * 2, tank.r * 1.2);
            // Turret
            ctx.fillStyle = tank.color; ctx.fillRect(0, -tank.r * 0.25, tank.r * 1.3, tank.r * 0.5);
            // Tracks
            ctx.fillStyle = '#333'; ctx.fillRect(-tank.r - 2, -tank.r * 0.7, tank.r * 2 + 4, tank.r * 0.25);
            ctx.fillRect(-tank.r - 2, tank.r * 0.45, tank.r * 2 + 4, tank.r * 0.25);
            // Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(-tank.r * 0.5, -tank.r * 0.5, tank.r, tank.r * 0.4);
            ctx.restore();
            // Speed boost indicator
            if (tank.speedBoost > 0) {
                ctx.strokeStyle = 'rgba(255,215,0,0.5)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(tank.x, tank.y, tank.r + 6, 0, Math.PI * 2); ctx.stroke();
            }
            if (tank.rapidBoost > 0) {
                ctx.strokeStyle = 'rgba(255,68,68,0.5)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(tank.x, tank.y, tank.r + 10, 0, Math.PI * 2); ctx.stroke();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Ground
            ctx.fillStyle = '#2d4a1e'; ctx.fillRect(0, 0, W, H);
            // Grid
            ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 0.5;
            for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
            for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

            // Walls
            for (const w of walls) {
                ctx.fillStyle = '#8B4513'; ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = '#5D3310'; ctx.lineWidth = 2; ctx.strokeRect(w.x, w.y, w.w, w.h);
            }

            // Power-ups
            for (const p of powerUps) {
                ctx.fillStyle = p.type === 'speed' ? '#ffd700' : p.type === 'rapid' ? '#ff4444' : '#ff44ff';
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = `bold ${p.r}px "Segoe UI"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(p.type === 'speed' ? '⚡' : p.type === 'rapid' ? '🔫' : '💥', p.x, p.y);
            }

            // Particles
            for (const p of particles) {
                ctx.fillStyle = `rgba(${p.color === '#44aaff' ? '68,170,255' : '255,68,68'},${p.life / 25})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill();
            }

            // Bullets
            for (const b of bullets) {
                ctx.fillStyle = b.owner === p1 ? '#88ccff' : '#ff8888';
                ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI * 2); ctx.fill();
            }

            drawTank(p1);
            drawTank(p2);

            // Labels
            ctx.fillStyle = '#44aaff'; ctx.font = 'bold 12px "Segoe UI"'; ctx.textAlign = 'center';
            ctx.fillText('P1 (WASD+Q)', p1.x, p1.y - tank.r - 14);
            ctx.fillStyle = '#ff4444';
            ctx.fillText('P2 (方向键+M)', p2.x, p2.y - tank.r - 14);

            // Score
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 16px "Segoe UI"'; ctx.textAlign = 'center';
            ctx.fillText(score1 + ' : ' + score2, W / 2, 20);
            ctx.textAlign = 'start';
        }

        function endGame() {
            gameOver = true;
            const winner = score1 >= 5 ? 'P1 🔵' : 'P2 🔴';
            document.getElementById('endTitle').textContent = '🏆 ' + winner + ' 获胜！';
            document.getElementById('endScore1').textContent = score1;
            document.getElementById('endScore2').textContent = score2;
            document.getElementById('endOverlay').style.display = 'block';
        }

        function loop() { update(); draw(); if (!gameOver) animId = requestAnimationFrame(loop); }

        const keys = {};
        document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
        document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });

        function handleInput() {
            if (gameOver) return;
            const spd1 = p1.speedBoost > 0 ? 3 : 2;
            const spd2 = p2.speedBoost > 0 ? 3 : 2;

            // P1: WASD + Q shoot
            if (keys['w']) { p1.angle = -Math.PI / 2; moveTank(p1, 0, -spd1); }
            if (keys['s']) { p1.angle = Math.PI / 2; moveTank(p1, 0, spd1); }
            if (keys['a']) { p1.angle = Math.PI; moveTank(p1, -spd1, 0); }
            if (keys['d']) { p1.angle = 0; moveTank(p1, spd1, 0); }
            if (keys['q']) { if (p1.rapidBoost > 0) { p1.reload = 0; } shoot(p1); }

            // P2: Arrows + M shoot
            if (keys['arrowup']) { p2.angle = -Math.PI / 2; moveTank(p2, 0, -spd2); }
            if (keys['arrowdown']) { p2.angle = Math.PI / 2; moveTank(p2, 0, spd2); }
            if (keys['arrowleft']) { p2.angle = Math.PI; moveTank(p2, -spd2, 0); }
            if (keys['arrowright']) { p2.angle = 0; moveTank(p2, spd2, 0); }
            if (keys['m']) { if (p2.rapidBoost > 0) { p2.reload = 0; } shoot(p2); }
        }

        // Game loop with input handling
        function gameLoop() { handleInput(); update(); draw(); if (!gameOver) animId = requestAnimationFrame(gameLoop); }
        // Override loop
        const origLoop = loop; loop = gameLoop;

        document.getElementById('newBtn').addEventListener('click', newGame);
        window.addEventListener('resize', () => { resize(); });
        newGame();
    </script>
    <script src="/joy-game-study/nav.js"></script>
</body>
</html>
