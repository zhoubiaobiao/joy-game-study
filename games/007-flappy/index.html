<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>007 - Flappy Bird</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e; color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; min-height: 100dvh; padding: 8px;
            user-select: none; -webkit-user-select: none;
        }
        h1 { color: #00d4ff; font-size: clamp(1.1em, 4vw, 1.6em); margin-bottom: 2px; }
        .status { display: flex; gap: 16px; margin-bottom: 4px; font-size: clamp(0.8em, 2.5vw, 0.95em); color: #aaa; }
        .status .val { color: #ffd700; font-weight: bold; }

        .canvas-wrap { position: relative; width: 100%; max-width: 420px; aspect-ratio: 3/4; }
        canvas { width: 100%; height: 100%; border: 2px solid #333; background: #16213e; border-radius: 6px; display: block; touch-action: manipulation; }

        .btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .btn {
            padding: 10px 24px; border: 2px solid #444; background: transparent;
            color: #ccc; border-radius: 8px; cursor: pointer;
            font-size: clamp(0.8em, 2.5vw, 0.95em);
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { border-color: #00d4ff; color: #00d4ff; }
        .btn.primary { background: #00d4ff33; border-color: #00d4ff; color: #00d4ff; font-size: 1.2em; padding: 14px 40px; }

        .info { color: #555; font-size: 0.7em; margin-top: 4px; text-align: center; }

        .overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.92); padding: 24px 30px; border-radius: 12px;
            text-align: center; display: none; z-index: 10;
        }
        .overlay h2 { font-size: clamp(1.3em, 4vw, 2em); margin-bottom: 8px; }
        .overlay.lose h2 { color: #ff5555; }
        .overlay p { color: #ccc; margin-bottom: 14px; }
        .overlay button {
            padding: 10px 28px; font-size: 1em;
            background: #00d4ff; color: #1a1a2e; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold; margin: 4px;
        }
    </style>
</head>
<body>
    <h1>🐤 Flappy Bird — #007</h1>

    <div class="status">
        <span>得分：<span class="val" id="score">0</span></span>
        <span>最佳：<span class="val" id="best">0</span></span>
    </div>

    <div class="canvas-wrap"><canvas id="game"></canvas></div>

    <div class="btn-row">
        <button class="btn primary" id="playBtn">👆 点击起飞</button>
    </div>
    <div class="info">💡 点击屏幕 / 按空格键 让小鸟飞起来 | P 暂停 | 穿过管道 +1 分</div>

    <div class="overlay lose" id="loseOverlay">
        <h2>💥 撞到了！</h2>
        <p>得分：<strong id="loseScore">0</strong> | 最佳：<strong id="loseBest">0</strong></p>
        <button onclick="newGame()">🔄 再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W, H;

        // 游戏常量
        const GRAVITY = 0.45;
        const FLAP = -7.5;
        const PIPE_W = 50;
        const PIPE_GAP = 130;
        const PIPE_SPEED = 2.5;
        const BIRD_X_RATIO = 0.3;

        let bird, pipes, score, bestScore, frame;
        let gameState = 'idle'; // idle | playing | paused | lost
        let animationId;

        function resizeCanvas() {
            const size = Math.min(canvas.parentElement.clientWidth, 420);
            canvas.width = size;
            canvas.height = size * 1.333;
            W = canvas.width; H = canvas.height;
        }

        function resetBird() {
            bird = { x: W * BIRD_X_RATIO, y: H / 2, vy: 0, r: Math.max(10, W / 28), flapFrame: 0 };
        }

        function createPipe(x) {
            const minTop = 50;
            const maxTop = H - PIPE_GAP - minTop;
            const top = minTop + Math.random() * (maxTop - minTop);
            return { x: x, top: top, bottom: top + PIPE_GAP, scored: false };
        }

        function newGame() {
            resizeCanvas();
            resetBird();
            pipes = [createPipe(W + 100), createPipe(W + 300), createPipe(W + 500)];
            score = 0; frame = 0;
            gameState = 'idle';
            document.getElementById('score').textContent = '0';
            document.getElementById('loseOverlay').style.display = 'none';
            document.getElementById('playBtn').textContent = '👆 点击起飞';
            document.getElementById('playBtn').className = 'btn primary';
            bestScore = parseInt(localStorage.getItem('flappy-best') || '0');
            document.getElementById('best').textContent = bestScore;
            draw();
        }

        function flap() { bird.vy = FLAP; bird.flapFrame = 8; }

        function update() {
            if (gameState !== 'playing') return;
            frame++;

            // 鸟物理
            bird.vy += GRAVITY;
            bird.y += bird.vy;
            if (bird.flapFrame > 0) bird.flapFrame--;

            // 管道移动
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= PIPE_SPEED + score * 0.08;
                if (pipes[i].x < -PIPE_W) {
                    pipes.splice(i, 1);
                    pipes.push(createPipe(pipes[pipes.length - 1].x + 200 + Math.random() * 60));
                }
                // 计分
                if (!pipes[i].scored && pipes[i].x + PIPE_W < bird.x) {
                    pipes[i].scored = true;
                    score++;
                    document.getElementById('score').textContent = score;
                }
            }

            // 碰撞检测
            const bx = bird.x, by = bird.y, br = bird.r;

            // 天花板/地面
            if (by - br <= 0 || by + br >= H) return endGame();

            // 管道碰撞
            for (const p of pipes) {
                if (bx + br > p.x && bx - br < p.x + PIPE_W) {
                    if (by - br < p.top || by + br > p.bottom) return endGame();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // 天空渐变
            const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
            skyGrad.addColorStop(0, '#1a3a5c');
            skyGrad.addColorStop(0.5, '#1e4d7b');
            skyGrad.addColorStop(1, '#16213e');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, H);

            // 装饰性背景山
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.beginPath();
            ctx.moveTo(0, H);
            for (let x = 0; x <= W; x += 5) ctx.lineTo(x, H * 0.7 + Math.sin(x * 0.02 + frame * 0.01) * 30);
            ctx.lineTo(W, H);
            ctx.fill();

            // 星星
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            const stars = [[50, 40], [150, 80], [250, 30], [320, 60], [180, 100], [380, 50]];
            for (const [sx, sy] of stars) {
                const twinkle = Math.sin(frame * 0.05 + sx) * 0.5 + 0.5;
                ctx.globalAlpha = 0.2 + twinkle * 0.5;
                ctx.beginPath(); ctx.arc((sx / 420) * W, (sy / 560) * H, 1.5, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;

            // 管道
            for (const p of pipes) {
                const px = p.x, pw = PIPE_W;
                // 管道主体
                const pipeGrad = ctx.createLinearGradient(px, 0, px + pw, 0);
                pipeGrad.addColorStop(0, '#2d8a4e');
                pipeGrad.addColorStop(0.3, '#4ecb71');
                pipeGrad.addColorStop(0.5, '#5fe87d');
                pipeGrad.addColorStop(0.7, '#4ecb71');
                pipeGrad.addColorStop(1, '#2d8a4e');

                // 上管道
                ctx.fillStyle = pipeGrad;
                ctx.fillRect(px, 0, pw, p.top);
                // 管口
                ctx.fillStyle = '#3ab85c';
                ctx.fillRect(px - 4, p.top - 22, pw + 8, 22);
                ctx.fillStyle = '#4ecb71';
                ctx.fillRect(px - 2, p.top - 20, pw + 4, 20);
                ctx.strokeStyle = '#2d8a4e';
                ctx.lineWidth = 2;
                ctx.strokeRect(px - 4, p.top - 22, pw + 8, 22);

                // 下管道
                ctx.fillStyle = pipeGrad;
                ctx.fillRect(px, p.bottom, pw, H - p.bottom);
                // 管口
                ctx.fillStyle = '#3ab85c';
                ctx.fillRect(px - 4, p.bottom, pw + 8, 22);
                ctx.fillStyle = '#4ecb71';
                ctx.fillRect(px - 2, p.bottom + 2, pw + 4, 20);
                ctx.strokeStyle = '#2d8a4e';
                ctx.lineWidth = 2;
                ctx.strokeRect(px - 4, p.bottom, pw + 8, 22);
            }

            // 地面
            ctx.fillStyle = '#3d2817';
            ctx.fillRect(0, H - 8, W, 8);
            ctx.fillStyle = '#5a3d22';
            ctx.fillRect(0, H - 5, W, 5);
            // 草坪
            ctx.fillStyle = '#2d8a4e';
            for (let x = 0; x < W; x += 15) {
                ctx.fillRect(x + (frame % 15), H - 13, 3, 5);
            }

            // 小鸟
            const bx = bird.x, by = bird.y, br = bird.r;
            // 阴影
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath(); ctx.arc(bx + 2, by + 3, br, 0, Math.PI * 2); ctx.fill();

            // 身体
            const bodyGrad = ctx.createRadialGradient(bx - br * 0.2, by - br * 0.3, br * 0.1, bx, by, br);
            bodyGrad.addColorStop(0, '#ffe066');
            bodyGrad.addColorStop(0.7, '#ffaa00');
            bodyGrad.addColorStop(1, '#e68a00');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();

            // 翅膀
            const wingAngle = bird.flapFrame > 0 ? -0.6 : -0.15;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(bx - br * 0.3, by - br * 0.1, br * 0.6, br * 0.3, wingAngle, 0, Math.PI * 2);
            ctx.fill();

            // 眼睛
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(bx + br * 0.35, by - br * 0.25, br * 0.35, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath(); ctx.arc(bx + br * 0.4, by - br * 0.22, br * 0.16, 0, Math.PI * 2); ctx.fill();

            // 喙
            ctx.fillStyle = '#ff6644';
            ctx.beginPath();
            ctx.moveTo(bx + br * 0.7, by - br * 0.05);
            ctx.lineTo(bx + br * 1.3, by + br * 0.15);
            ctx.lineTo(bx + br * 0.7, by + br * 0.25);
            ctx.fill();

            // 分数
            if (gameState === 'playing' || gameState === 'paused') {
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.font = 'bold ' + Math.floor(W / 8) + 'px "Segoe UI"';
                ctx.textAlign = 'center';
                ctx.fillText(score, W / 2, H * 0.12);
                ctx.textAlign = 'start';
            }

            // 待开始
            if (gameState === 'idle') {
                // 小鸟上下浮动
                ctx.fillStyle = 'rgba(0,0,0,0.25)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold ' + Math.floor(W / 15) + 'px "Segoe UI"';
                ctx.textAlign = 'center';
                ctx.fillText('点击屏幕 或 按空格起飞', W / 2, H * 0.5);
                ctx.textAlign = 'start';
            }

            // 暂停
            if (gameState === 'paused') {
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold ' + Math.floor(W / 12) + 'px "Segoe UI"';
                ctx.textAlign = 'center';
                ctx.fillText('⏸ 暂停中', W / 2, H / 2);
                ctx.textAlign = 'start';
            }
        }

        function endGame() {
            gameState = 'lost';
            if (score > bestScore) { bestScore = score; localStorage.setItem('flappy-best', bestScore); }
            document.getElementById('best').textContent = bestScore;
            document.getElementById('loseScore').textContent = score;
            document.getElementById('loseBest').textContent = bestScore;
            document.getElementById('loseOverlay').style.display = 'block';
            document.getElementById('playBtn').textContent = '👆 点击起飞';
            document.getElementById('playBtn').className = 'btn primary';
        }

        function togglePause() {
            if (gameState === 'playing') { gameState = 'paused'; }
            else if (gameState === 'paused') { gameState = 'playing'; }
            draw();
        }

        function startGame() {
            if (gameState === 'lost') { newGame(); return; }
            if (gameState === 'playing') return;
            gameState = 'playing';
            flap();
            document.getElementById('playBtn').textContent = '🔄 重来';
            document.getElementById('playBtn').className = 'btn';
        }

        function gameLoop() {
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        // 输入事件
        canvas.addEventListener('click', () => { if (gameState === 'idle') startGame(); else if (gameState === 'playing') flap(); });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); if (gameState === 'idle') startGame(); else if (gameState === 'playing') flap(); }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                if (gameState === 'idle') startGame();
                else if (gameState === 'playing') flap();
                else if (gameState === 'lost') newGame();
            }
            if (e.key === 'p' || e.key === 'P') { if (gameState === 'playing' || gameState === 'paused') togglePause(); }
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            if (gameState === 'idle') startGame();
            else if (gameState === 'playing') flap();
            else if (gameState === 'lost') newGame();
        });

        window.addEventListener('resize', () => { resizeCanvas(); draw(); });
        newGame();
        gameLoop();
    </script>
<script src="/joy-game-study/nav.js"></script>
</body>
</html>
